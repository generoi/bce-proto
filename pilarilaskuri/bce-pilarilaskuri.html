<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BCE-pilarilaskuri – työpajaprototyyppi v0.2</title>
<style>
/* ---------------------------------------------------------------------------
   BCE-pilarilaskuri v0.2 – työpajaprototyyppi.
   Tyylit ovat sivuston design systemistä (docs/wireframes/DESIGN-SYSTEM.md,
   bce-v4.css): samat tokenit, sama typografia, samat komponentit. Tämä tiedosto
   ei linkitä bce-v4.css:ää, koska laskurin on toimittava yksin file://-osoitteesta
   ja Claude-artefaktina — tokenit ja säännöt on kopioitu, ei keksitty uudelleen.
   Kun laskuri upotetaan sivustolle, tämän lohkon voi korvata bce-v4.css:llä ja
   jättää jäljelle vain "laskurin omat" -osion lopusta.
   --------------------------------------------------------------------------- */
:root{
  /* Väri. Oranssi vain ensisijaiselle toiminnolle ja pilareille piirustuksissa;
     pienessä tekstissä --accent-dark. */
  --accent:#e25d25; --accent-dark:#b8420f;
  --ink:#252425; --ink-2:#515151; --ink-3:#6f6d6b;
  --paper:#faf9f7; --paper-2:#f2f0ec;
  --rule:#e1ded9; --rule-2:#cfcac3;
  --surface:#fdfcfa; --on-accent:#fffdfa;
  --ff:"Raleway",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ff-d:"Oswald","Raleway",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --fs-fine:13px; --fs-small:15px; --fs-body:17px; --fs-lede:19px;
  --fs-h3:18px; --fs-h2:clamp(23px,2.2vw,30px); --fs-h1:clamp(32px,4vw,52px);
  --r-ctl:3px; --r-card:4px;
  --tap:44px;
  --boksi:56px;              /* säätimen laatikko: neliö, sama vaaka- ja pystysäätimessä */

  /* Laskurin oma lisäys: lähteiden tilavärit. Näitä ei ole bce-v4.css:ssä, koska
     sivustolla ei ole vastaavaa tehtävää. Sävyt on valittu samasta perheestä ja
     mitattu paperia vasten: ok 5,3:1, warn 5,1:1, miss 5,6:1. */
  --ok:#2f6b45; --ok-bg:#eaf1ec;
  --warn:#8a5a00; --warn-bg:#f6efe1;
  --miss:#a01b12; --miss-bg:#f7e9e7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f0eeeb; --ink-2:#c3bfba; --ink-3:#a29d97;
    --paper:#1c1b1c; --paper-2:#262526; --surface:#232223;
    --rule:#3a383a; --rule-2:#4d4a4c; --on-accent:#1c1b1c;
    --accent:#e2692f; --accent-dark:#ef8047;
    --ok:#7fc79b; --ok-bg:#1e2c23; --warn:#d8a44b; --warn-bg:#2e2617; --miss:#eb8a80; --miss-bg:#2f1d1b;
  }
}
:root[data-theme="dark"]{
  --ink:#f0eeeb; --ink-2:#c3bfba; --ink-3:#a29d97;
  --paper:#1c1b1c; --paper-2:#262526; --surface:#232223;
  --rule:#3a383a; --rule-2:#4d4a4c; --on-accent:#1c1b1c;
  --accent:#e2692f; --accent-dark:#ef8047;
  --ok:#7fc79b; --ok-bg:#1e2c23; --warn:#d8a44b; --warn-bg:#2e2617; --miss:#eb8a80; --miss-bg:#2f1d1b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--ff); font-size:var(--fs-body); line-height:1.6;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:var(--r-ctl)}
h1,h2,h3{margin:0;font-family:var(--ff-d);font-weight:600;text-transform:uppercase;line-height:1.1}
h2{font-size:var(--fs-h2);margin:0 0 var(--s3)}
h3{font-size:var(--fs-h3)}
p{margin:0 0 var(--s3)}
ul,ol{margin:0 0 var(--s3);padding-left:20px}
li{margin:0 0 var(--s2);max-width:68ch}
code{background:var(--paper-2);padding:0 4px;border-radius:2px;font-size:.92em}

/* --- komponentit design systemistä ---------------------------------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  font-family:var(--ff-d);text-transform:uppercase;font-size:19px;font-weight:600;
  letter-spacing:.02em;padding:14px var(--s5);border:2px solid transparent;
  border-radius:var(--r-ctl);text-decoration:none;cursor:pointer;
}
.btn-1{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn-1:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn-2{background:var(--surface);color:var(--ink);border-color:var(--rule-2)}
.btn-2:hover{border-color:var(--ink)}
.btn-s{font-size:16px;padding:11px 18px}
.btn.wide{width:100%;margin:0 0 var(--s2)}
.btn[disabled],.btn[disabled]:hover{background:var(--paper-2);color:var(--ink-3);
  border-color:var(--rule-2);cursor:not-allowed}
.btnhint{font-size:var(--fs-fine);color:var(--ink-3);margin:0 0 var(--s3);text-align:center}
.more{
  display:inline-flex;align-items:center;min-height:var(--tap);
  background:none;border:0;padding:0;cursor:pointer;
  font-weight:600;font-size:var(--fs-body);color:var(--ink);
  text-decoration:none;border-bottom:2px solid var(--rule-2);
}
.more:hover{border-color:var(--ink)}
.lbl{
  font-family:var(--ff);font-size:var(--fs-fine);font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;display:block;
}
.lede{color:var(--ink-2);margin:0 0 var(--s4);max-width:68ch}
.fine{font-size:var(--fs-fine);color:var(--ink-3);max-width:76ch;margin-top:var(--s3)}
.field{
  width:100%;font:inherit;font-size:16px;padding:13px 14px;
  border:1px solid var(--rule-2);border-radius:var(--r-ctl);
  background:var(--surface);color:var(--ink);min-height:var(--tap);
}
.ph{
  background:var(--paper-2);border:1px dashed var(--rule-2);border-radius:var(--r-card);
  color:var(--ink-3);font-size:var(--fs-fine);
}

/* --- ylärivi -------------------------------------------------------------- */
.top{
  display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;
  padding:var(--s3) var(--s5);border-bottom:1px solid var(--rule);background:var(--surface);
}
.wordmark{font-family:var(--ff-d);text-transform:uppercase;font-weight:600;font-size:var(--fs-h3);letter-spacing:.02em;margin:0 auto 0 0;line-height:1.2}
.wordmark small{display:block;font-family:var(--ff);font-weight:400;text-transform:none;font-size:var(--fs-fine);color:var(--ink-3);letter-spacing:0}
.langs{display:flex;gap:var(--s1)}
.lang{
  background:var(--surface);border:1px solid var(--rule-2);border-radius:var(--r-ctl);
  padding:0 var(--s3);min-height:var(--tap);min-width:var(--tap);cursor:pointer;
  font-size:var(--fs-small);font-weight:600;text-transform:uppercase;
}
.lang:hover{border-color:var(--ink)}
.lang[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.wsbtn{
  font-family:var(--ff-d);text-transform:uppercase;font-weight:600;font-size:16px;letter-spacing:.02em;
  background:var(--surface);color:var(--ink);border:2px solid var(--rule-2);
  border-radius:var(--r-ctl);padding:11px 18px;min-height:var(--tap);cursor:pointer;
}
.wsbtn:hover{border-color:var(--ink)}
.wsbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--paper-2)}

/* --- näyttämö ------------------------------------------------------------- */
.stage{display:flex;gap:var(--s7);align-items:flex-start;padding:var(--s6) var(--s5) var(--s8);justify-content:center}
.stage.ws-on{justify-content:flex-start}
@media (max-width:980px){ .stage{flex-direction:column;align-items:center;gap:var(--s6);padding:var(--s5) var(--s4) var(--s7)} }
@media (min-width:981px){ .panel{min-height:720px} }

/* --- laskuripaneeli ------------------------------------------------------- */
/* Kiinteä 720 px:n korkeus sai puhelimen näyttämään puhelimelta työpöydällä,
   mutta puhelimessa se työnsi ensisijaisen toiminnon taitteen alle ja jätti
   ruudun tyhjäksi. Korkeus on vain siellä, missä se on koriste. */
.panel{
  width:100%;max-width:420px;flex:0 0 auto;
  background:var(--surface);border:1px solid var(--rule-2);border-radius:var(--r-card);
  padding:var(--s5);display:flex;flex-direction:column;
}
.scr{display:flex;flex-direction:column;flex:1}
.nav{display:flex;align-items:center;gap:10px;margin:0 0 var(--s4);min-height:var(--tap)}
.back{
  background:var(--surface);border:1px solid var(--rule-2);border-radius:var(--r-ctl);
  width:var(--tap);height:var(--tap);cursor:pointer;font-size:18px;line-height:1;
}
.back:hover{border-color:var(--ink)}
.prog{flex:1;height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--ink)}
.stepno{font-size:var(--fs-fine);color:var(--ink-3);font-variant-numeric:tabular-nums}
.spacer{flex:1;min-height:var(--s5)}

/* valintakortti. Lähin kanoninen on .sizes button[aria-pressed]; tämä on sen
   täysleveä, kuvaileva muoto. Jos laskuri otetaan sivustolle, luokka lisätään
   katalogiin (DESIGN-SYSTEM.md luku 3). */
.opts{display:flex;flex-direction:column;gap:var(--s2);margin:0 0 var(--s4)}
.opt{
  display:block;width:100%;text-align:left;cursor:pointer;line-height:1.35;
  background:var(--surface);border:1px solid var(--rule-2);border-radius:var(--r-card);
  padding:13px var(--s4);min-height:56px;
}
.opt:hover{border-color:var(--ink)}
.opt b{display:block;font-size:var(--fs-body);font-weight:600}
.opt span{display:block;font-size:var(--fs-small);color:var(--ink-2);margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* Kuvallinen valintakortti. Kuvat tulevat docs/kuvat/liitos-*.svg:sta, jotka on
   viety **yhdellä yhteisellä skaalalla** (docs/kuvat/liitoskuva.py). Siksi kuva
   näytetään luonnollisessa koossaan eikä sille anneta korkeutta: jos CSS pakottaisi
   kaikki samaan korkeuteen, pieni PIK 50-70 näyttäisi yhtä isolta kuin leveä
   TL 150×150 ja kuva tekisi päinvastoin kuin sen on tarkoitus. Kuvapaikka on
   kiinteä, jotta tekstit ovat samassa linjassa vaikka kuvat ovat eri kokoisia. */
.opt.kuva{display:flex;align-items:center;gap:var(--s3);padding:10px var(--s3) 10px 10px}
/* Kuvapaikka on juuri niin suuri, että suurin kuva mahtuu siihen luonnollisessa
   koossaan (leveys 102, korkeus 111): jos paikka olisi pienempi, max-width leikkaisi
   yhden kuvan pienemmäksi kuin muut ja mittasuhde valehtelisi. Tausta on valkoinen,
   koska liitoskuvan vaaleat metalliosat katosivat lämpimään harmaaseen. */
.opt.kuva .kuvapaikka{
  flex:0 0 124px;height:124px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--r-ctl);background:#fff;
}
.opt.kuva .kuvapaikka img{display:block;width:auto;height:auto;max-width:120px;max-height:120px}
.opt.kuva .teksti{flex:1 1 auto;min-width:0}
/* Kaksi eri tyhjää paikkaa, koska syyt ovat eri. Raidoitettu = kuva puuttuu ja se on
   avoin kysymys (P-PIK: lähteet ristiriidassa siitä, miten lauta kiinnittyy). Sileä =
   kuvaa ei kuulukaan olla, koska vaihtoehto ei nimeä mitään tuotetta (En tiedä vielä).
   Kumpikin pitää tekstit samassa linjassa muiden korttien kanssa. */
.opt.kuva .kuvapaikka.avoin{background:repeating-linear-gradient(135deg,
  var(--paper-2, #f4f2ef) 0 6px, #fff 6px 12px)}
.opt.kuva .kuvapaikka.eikuvaa{background:transparent}

/* stepperit */
.step{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:10px 0;border-bottom:1px solid var(--rule)}
.step .slbl{font-weight:600;font-size:var(--fs-body)}
.step .ctl{display:flex;align-items:center;gap:var(--s2)}
/* Laatikot ovat neliöitä ja keskenään samankokoisia: +, arvo ja − muodostavat
   kolmen palan sarjan, ja eri kokoiset palat näkyvät heti kun ne ovat allekkain. */
.step button{
  width:var(--boksi);height:var(--boksi);border-radius:var(--r-ctl);border:1px solid var(--rule-2);
  background:var(--surface);cursor:pointer;font-size:20px;line-height:1;
}
.step button:hover:not([disabled]){border-color:var(--ink)}
.step button[disabled]{opacity:.35;cursor:not-allowed}
/* Arvo on muokattava kenttä: 3 → 8 metriä olisi kymmenen napautusta steppereillä.
   ± jää hienosäätöön, kirjoittaminen hoitaa ison muutoksen. */
.step .val{width:var(--boksi);height:var(--boksi);text-align:center;
  font-variant-numeric:tabular-nums;font-weight:600;
  font-size:var(--fs-body);padding:8px 4px;border:1px solid var(--rule-2);
  border-radius:var(--r-ctl);background:var(--surface);color:var(--ink);
  -moz-appearance:textfield}
.step .val::-webkit-outer-spin-button,.step .val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step .unit{font-size:var(--fs-small);color:var(--ink-3);min-width:14px}
.derived{margin:10px 0 var(--s5);color:var(--ink-2);font-size:var(--fs-small)}
/* Ruudukossa pinta-ala on kuvan yläpuolella eikä kaipaa omia marginaalejaan. */
.m-ala .derived{margin:0 0 var(--s2)}

/* Mittaruudun asettelu: säädin on sillä reunalla, jota se mittaa. Kuvan mittaviivat
   noudattivat tätä jo (Leveys alareunassa, Pituus vasemmalla), mutta säätimet olivat
   allekkain listana, jolloin kumpi on kumpi piti lukea labelista. Pystysäädin kuvan
   oikealla ja vaakasäädin sen alla tekevät yhteyden ilman lukemista. */
.mitat{display:grid;grid-template-columns:1fr auto;
  grid-template-areas:"ala ala" "kuva pituus" "leveys leveys";
  column-gap:var(--s3);align-items:center;margin:0 0 var(--s3);
  /* Yhteinen oikea kouru. Pystysäätimen yksikkö m roikkuu laatikoiden oikealla
     puolella virran ulkopuolella, ja ilman samaa kourua leveysrivillä säätimien
     oikeat reunat jäisivät eri pystylinjaan. */
  --kouru:20px}
/* Säädin keskitetään ruudukkoon eikä sidota alareunaan: ruudukko on neliö, ja sen
   keskikorkeus on se taso, jolta pituutta luetaan. Pinta-ala on siksi oma
   ruudukkorivinsä kuvan yläpuolella eikä kuvan sisällä. */
.m-kuva{grid-area:kuva;min-width:0}
/* .plan kantaa omat marginaalinsa (4 px ylhäällä, 16 px alhaalla) muita käyttöjä
   varten. Ruudukossa ne siirtäisivät kuvan alareunan säätimen alareunan yläpuolelle,
   vaikka align-items:end asettaa itse ruudukkopalat kohdakkain. Väleistä vastaa grid. */
.m-kuva .plan{margin:0}
.m-ala{grid-area:ala}
/* Säädin keskitetään ruudukkoon, ei koko kuvaan: kuvan ylämarginaali on 14 px ja
   alamarginaali 40 px (leveysmitan teksti), joten SVG:n keskus on 13 px ruudukon
   keskuksen alapuolella. Alamarginaali nostaa keskitetyn palan puolikkaallaan.
   Luku on likimääräinen, koska kuva skaalautuu leveyden mukaan — kapealla ruudulla
   ero on muutaman pikselin pienempi, mikä ei erotu. */
.m-pituus{grid-area:pituus;padding-right:var(--kouru);margin-bottom:26px}
.m-leveys{grid-area:leveys;padding-right:var(--kouru)}
/* Pystysäätimessä + on ylhäällä ja − alhaalla, koska suunta on sama kuin mitalla.
   Kolme laatikkoa ovat päällekkäin, joten niillä on pakko olla sama leveys: vaakasuunnassa
   64 px:n kenttä ja --tap:n painikkeet eivät häiritse, pystyssä ero näkyy heti. Leveys
   tulee siksi yhdestä paikasta (.ctl) ja lapset venyvät siihen. Yksikkö nostetaan pois
   virrasta absoluuttisesti, koska rivissä se leventäisi vain keskimmäistä laatikkoa. */
.step.pysty{flex-direction:column;align-items:center;gap:var(--s2);padding:0;border-bottom:0}
.step.pysty .ctl{flex-direction:column;align-items:center}
.step.pysty .arvo{position:relative;display:block}
.step.pysty .arvo .unit{position:absolute;left:calc(100% + 6px);top:50%;transform:translateY(-50%)}
/* Kapealla ruudulla kuva kutistuisi säätimen tieltä lukukelvottomaksi, joten
   pystysäädin siirtyy kuvan alle ja molemmat ovat taas vaakasäätimiä. */
@media (max-width:359px){
  .mitat{grid-template-columns:1fr;grid-template-areas:"kuva" "pituus" "leveys"}
  .step.pysty{flex-direction:row;justify-content:space-between;
    padding:10px 0;border-bottom:1px solid var(--rule)}
  .step.pysty .ctl{flex-direction:row}
}

/* tulos */
/* Pohjapiirros. Sama funktio piirtää mittaruudun havainnekuvan ja tuloksen
   sijoituskaavion, jotta kuva ei muutu toiseksi kesken polun. Korkeus katkaistaan,
   jotta kapea ja pitkä rakennus ei vie koko ruutua; preserveAspectRatio pitää
   mittasuhteet totena. */
.plan{margin:var(--s1) 0 var(--s4)}
.plan svg{width:100%;height:auto;display:block;max-height:300px}
.plan.plan-s svg{max-height:270px}
.plan .outline{fill:none;stroke:var(--ink-3);stroke-width:1.25}
.plan .grid{stroke:var(--rule);stroke-width:1}
/* Kiinteä vertailukenttä: reuna kertoo mihin ruudukko loppuu, täyttö erottaa
   valitun alan kentästä. */
.plan .frame{fill:none;stroke:var(--rule);stroke-width:1}
.plan .sel{fill:var(--accent);opacity:.12}
.plan .dim{stroke:var(--ink-3);stroke-width:1}
.plan .dimtx{font-family:var(--ff);font-size:12px;font-weight:600;fill:var(--ink-2)}
.plan .scaletx{font-family:var(--ff);font-size:11px;fill:var(--ink-3)}
.plan .scalebar{stroke:var(--ink-3);stroke-width:1}
.plan .scalefill{fill:var(--ink-3)}
.plan .pill{fill:var(--accent)}
.group{margin:0 0 var(--s5)}
/* Tuoterivi: kuva · nimi ja määrä samalla rivillä · tiedot alla.
   Määrä kuuluu nimen viereen, koska kysymys on "montako TÄTÄ" — erillisenä
   lukuna se jää irralleen ja jättää rivin oikean laidan tyhjäksi.
   Sivuston .tcard tekee saman työn leveässä sarakkeessa; tämä on sen 420 px:n muoto. */
.prow{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:var(--s3);
  padding:var(--s3) 0;border-top:1px solid var(--rule);align-items:start}
.pimg{width:84px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:var(--s1);line-height:1.25;font-size:11px;
  overflow-wrap:break-word;hyphens:auto}
/* Aito tuotekuva on läpinäkyvä, joten sen alle ei tule levyä eikä kehystä:
   ne kuuluvat kuvapaikalle, eivät kuvalle (TUOTEKUVAT.md, sääntö 2). Kuva saa
   myös enemmän tilaa kuin paikanpitäjä, koska 64 px riittää tekstilapulle muttei
   kolmiulotteiselle kappaleelle. */
img.pimg{width:84px;object-fit:contain;border:0;background:none}
.pname{display:block;font-weight:600;line-height:1.3}
/* Määrä on vastaus kysymykseen, jonka aloitusruutu esitti. Oma sarake, kiinteä
   oikea reuna, isompi aste: rivittyvän nimen sisällä se jäi reikään roikkumaan. */
.pqty{font-size:var(--fs-lede);font-weight:600;font-variant-numeric:tabular-nums;
  white-space:nowrap;text-align:right;line-height:1.25;color:var(--ink)}
.pqty small{display:block;font-size:var(--fs-fine);font-weight:400;color:var(--ink-3)}
.pspec{display:block;font-size:var(--fs-small);color:var(--ink-2);margin-top:2px}
.pchoice{display:block;font-size:var(--fs-fine);font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
/* Vaihtoehto ei ole tuoterivi: se on huomautus tuoteriviin. */
.palt{margin:0;padding:10px var(--s3);background:var(--paper-2);font-size:var(--fs-small)}
.group .palt{margin-top:var(--s3)}
.note{border:1px solid var(--rule-2);border-radius:var(--r-card);background:var(--paper-2);
  padding:10px var(--s3);margin:0 0 var(--s2);font-size:var(--fs-small)}
.note.warn{border-color:var(--warn);background:var(--warn-bg)}
details{border-top:1px solid var(--rule);padding:0}
summary{cursor:pointer;font-weight:600;min-height:var(--tap);display:flex;align-items:center;
  gap:var(--s2);font-size:var(--fs-body);list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;margin-left:auto;

  'eng.mokki.load':'Mökin kuormana on terassin hyötykuorma {q} kN/m² (Kestopuu). Katon lumikuorma sekä katon ja seinien omapaino eivät ole mukana.',
  'eng.spacing.q':'Palkkivälin taulukko on laadittu hyötykuormalle 2,0 kN/m². Laskennassa käytetty kuorma on {q} kN/m², joten jakoväli ei enää vastaa palkin kestävyyttä.',
  'disclaimer':'Laskuri antaa suosituksen yleisimpiin tilanteisiin. Pilarien kantavuus perustuu valmistajan rakennesuunnittelijan mitoitukseen. Maapohjan kantavuus, routasuojaus, salaojitus ja maanpinnan korkeus suunnitellaan aina kohteen mukaan. Jos olet epävarma, kysy meiltä: vastaamme tunnin sisällä arkisin.'
};

/* sv ja en: samat avaimet, arvona fi-teksti etuliitteellä, jotta puuttuva
   käännös näkyy sivulla eikä jää tyhjäksi. */
function prefixAll(obj, p){ var o = {}, k; for (k in obj) o[k] = obj[k] ? p + obj[k] : obj[k]; return o; }
var I18N = { fi: FI, sv: prefixAll(FI, '[sv] '), en: prefixAll(FI, '[en] ') };

function nf(v, lang, dec){
  if (v === null || v === undefined || v !== v) return '–';
  var s;
  /* Kaksi desimaalia, päättävät nollat pois. Yksi desimaali riitti copylle mutta
     valehteli kaavoissa: 1,33 × 1,25 = 1,67 ei näytä oikealta muodossa 1,3 × 1,3 = 1,7. */
  if (dec === undefined) s = String(Math.round(v * 100) / 100);
  else s = v.toFixed(dec);
  var neg = s.charAt(0) === '-'; if (neg) s = s.slice(1);
  var parts = s.split('.'), ip = parts[0], fp = parts[1];
  /* tuhaterotin väliksi fi/sv, pilkuksi en; desimaalierotin päinvastoin. */
  if (ip.length > 3) ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, (lang === 'en') ? ',' : '\u00A0');
  return (neg ? '-' : '') + ip + (fp ? ((lang === 'en') ? '.' : ',') + fp : '');
}
function fmt(key, vars, lang){
  lang = lang || 'fi';
  var dict = I18N[lang] || I18N.fi;
  var s = dict[key];
  if (s === undefined) return '⟦' + key + '⟧';
  if (!vars) return s;
  return s.replace(/\{(\w+)\}/g, function(m, k){
    var v = vars[k];
    if (v === undefined || v === null) return '';
    return (typeof v === 'number') ? nf(v, lang) : String(v);
  });
}

/* --- apurit --------------------------------------------------------------- */
function r6(x){ return Math.round(x * 1e6) / 1e6; }
function gridFor(w, l, sp){
  var cols = Math.max(2, Math.ceil(r6(w / sp)) + 1);
  var rows = Math.max(2, Math.ceil(r6(l / sp)) + 1);
  return { cols:cols, rows:rows, n:cols * rows,
           spacing_w:r6(w / (cols - 1)), spacing_l:r6(l / (rows - 1)), nominal_spacing:sp };
}
/* Kun työpaja on muuttanut vakion, lähde vaihtuu ja PUUTTUU-tila muuttuu päätökseksi. */
function srcOf(R, path, fallback){ return (R && R._edited && R._edited[path]) ? (R._workshopSrc || 'Työpaja') : fallback; }
function tierOf(R, path, fallback){ return (R && R._edited && R._edited[path]) ? 'ok' : fallback; }
function terrainDiff(R, id){
  for (var i = 0; i < R.terrainClasses.length; i++) if (R.terrainClasses[i].id === id) return R.terrainClasses[i].maxDiff;
  return null;
}
function heightSpan(R, f){ var h = R.heightRange[f]; return h ? h[1] - h[0] : null; }
function heightsOf(f, R){
  var rg = R.heightRange[f] || [0, Infinity];
  return (PILLARS[f].heights || []).filter(function(h){ return h >= rg[0] && h <= rg[1]; });
}
/* Kuormitusala: sisäpilari kantaa oman ruutunsa, reunapilari puolikkaan ja
   nurkkapilari neljänneksen. Palauttaa suurimman yksittäisen kuormitusalan.
   Tätä ei käytetä tuotevalintaan, vain raportointiin. */
function tributaryMax(w, l, g){
  var sw = w / (g.cols - 1), sl = l / (g.rows - 1), mx = 0, i, j, fx, fy;
  for (i = 0; i < g.cols; i++) for (j = 0; j < g.rows; j++){
    fx = (i === 0 || i === g.cols - 1) ? 0.5 : 1;
    fy = (j === 0 || j === g.rows - 1) ? 0.5 : 1;
    if (fx * sw * fy * sl > mx) mx = fx * sw * fy * sl;
  }
  return { a:r6(mx), sw:r6(sw), sl:r6(sl) };
}
function capacityRow(f){
  var t = PILLARS[f].capacity.table || [], c = PILLARS[f].capacity.conservative_kN, i;
  for (i = 0; i < t.length; i++) if (t[i].kN === c) return t[i];
  return t.length ? t[t.length - 1] : null;
}
function weightRange(f, R){
  var hs = heightsOf(f, R), w = PILLARS[f].weights || {}, a = [];
  for (var i = 0; i < hs.length; i++) if (w[hs[i]] != null) a.push(w[hs[i]]);
  if (!a.length) return null;
  var mn = Math.min.apply(null, a), mx = Math.max.apply(null, a);
  return (mn === mx) ? String(mn) : (mn + '–' + mx);
}

/* --- compute -------------------------------------------------------------- */
function compute(state, R, lang){
  R = R || RULES; lang = lang || 'fi';
  var t = function(k, v){ return fmt(k, v, lang); };
  var out = {
    handoff:null, family:null, grid:null, range:null, pillars:[], accessories:[],
    engineering:[], check:null,
    load:{ q_kNm2:null, per_pillar_kN:null, capacity_kN:null, ok:null, snow_zone_kNm2:null },
    notes:[], how:[], install:[], disclaimer:t('disclaimer'),
    alternative:null, refine:false, area:null
  };
  var how = function(key, vars, tier, src){
    out.how.push({ key:key, vars:vars || {}, text:t(key, vars), tier:tier, src:src });
  };
  var eng = function(key, vars, tier, src){
    out.engineering.push({ key:key, vars:vars || {}, text:t(key, vars), tier:tier, src:src });
  };
  var note = function(kind, key, vars){
    var text = t(key, vars);
    for (var i = 0; i < out.notes.length; i++) if (out.notes[i].text === text) return;
    out.notes.push({ kind:kind, text:text, key:key });
  };
  for (var s = 1; s <= 7; s++) out.install.push({ text:t('install.' + s), tier:'ok', src:'OPAS' });

  /* Vaihe 0 – tolppa: oma lyhyt polku, ei kuormatarkistusta eikä tarvikkeita. */
  if (state.building === 'tolppa'){
    out.family = 'PP';
    out.pillars = [{ family:'PP', qty:state.poles, heights:heightsOf('PP', R), heightRule:null }];
    how('how.pp', null, 'ok', 'SITE');
    how('how.pp.capacity', null, 'miss', 'PUUTTUU');
    note('info', 'n.pp.capacity');
    return out;
  }

  var area = r6(state.w * state.l);
  out.area = area;
  var bname = t('b.' + state.building);

  /* Vaihe 1 – kieltäytyminen ennen laskentaa. */
  if (state.terrain === 'yli60'){
    out.handoff = { code:'korkeus', reason:t('h.reason.korkeus') };
    how('how.terrain.over', { label:t('k3.yli60'), family:'KP', min:R.heightRange.KP[0], max:R.heightRange.KP[1] }, 'ok', 'KRQ');
    return out;
  }
  var lim = R.areaLimit[state.building];
  if (lim !== null && lim !== undefined && area > lim){
    out.handoff = { code:'area', reason:t('h.reason.area', { area:area, limit:lim }) };
    return out;
  }
  if (state.building === 'mokki' && state.heated === 'ympari'){
    note('warn', 'n.mokki.lupa');
    if (state.soil === 'pehmea'){
      out.handoff = { code:'mokki_savi', reason:t('h.reason.mokki_savi') };
      return out;
    }
  }

  /* Vaihe 2 – tuoteperhe BCE:n käyttökohteista. */
  var fam = null, candidate = null;
  if (state.building === 'katos'){
    fam = 'KP';
    how('how.family.site', { building:bname, family:'KP' }, 'ok', 'SITE');
  } else if (state.building === 'terassi' && state.cover === 'kyllä'){
    fam = 'KP';
    how('how.family.cover', null, 'ok', 'OPAS');
    note('info', 'n.cover');
  } else if (state.building === 'mokki'){
    fam = 'KP';
    how('how.family.site', { building:bname, family:'KP' }, 'ok', 'SITE');
    how('how.mokki.tp', null, 'miss', 'PUUTTUU');   /* T6: pienmökin TP-raja puuttuu */
  } else {
    candidate = 'AP|TP';
  }

  /* Vaihe 3 – jakoväli ja määrä. */
  var n = null, grid = null, range = null;
  if (state.building === 'katos'){
    n = state.poles;
    grid = { cols:2, rows:Math.ceil(n / 2), spacing_w:null, spacing_l:null, nominal_spacing:null, visualOnly:true };
    how('how.poles', { n:n }, 'ok', 'SITE');
  } else {
    var sp = (state.beam && R.spacingByBeam[state.beam] !== undefined) ? R.spacingByBeam[state.beam] : R.spacingUnknownBeam;
    if (sp === null || sp === undefined){
      var vals = [];
      for (var bk in R.spacingByBeam) if (typeof R.spacingByBeam[bk] === 'number') vals.push(R.spacingByBeam[bk]);
      var sp1 = Math.min.apply(null, vals), sp2 = Math.max.apply(null, vals);
      var gLoose = gridFor(state.w, state.l, sp2), gDense = gridFor(state.w, state.l, sp1);
      range = { n1:gLoose.n, n2:gDense.n, sp1:sp1, sp2:sp2, gridLoose:gLoose, gridDense:gDense };
      n = gLoose.n;                    /* kuormatarkistus pienimmällä pilarimäärällä */
      out.refine = true;
      how('how.spacing.range', { sp1:sp1, sp2:sp2, n1:range.n1, n2:range.n2 }, 'miss', 'PUUTTUU');
      note('warn', 'n.beam.eos');
    } else {
      grid = gridFor(state.w, state.l, sp);
      n = grid.n;
      how('how.spacing',
          { beam:t('k5.' + state.beam), sp:sp, cols:grid.cols, rows:grid.rows, n:n, sw:grid.spacing_w, sl:grid.spacing_l },
          tierOf(R, 'spacingByBeam.' + state.beam, 'ok'),
          srcOf(R, 'spacingByBeam.' + state.beam, 'KESTOPUU'));
    }
  }

  /* Vaihe 4 – kuorma ja tuoteperheen lopullinen valinta. */
  var q, sk = null, usedPostcode = false, liveOnly = null, selfW = null;
  if (state.building === 'katos'){
    var pre = String(state.postcode || '').slice(0, 2);
    if (pre && R.snowByPostcodePrefix && R.snowByPostcodePrefix[pre] !== undefined){
      sk = R.snowByPostcodePrefix[pre]; usedPostcode = true;
    } else {
      sk = R.snowDefault;
    }
    q = r6(R.snowShape * sk);
    liveOnly = q;
    if (R.roofSelfWeight != null){ q = r6(q + R.roofSelfWeight); selfW = R.roofSelfWeight; }
    how('how.load.snow', { sk:sk, mu:R.snowShape, q:liveOnly },
        usedPostcode ? tierOf(R, 'snowByPostcodePrefix', 'ok') : 'ok', 'YM');
    note('info', 'n.snow', { sk:sk,
      src: usedPostcode ? t('n.snow.src.post', { postcode:state.postcode }) : t('n.snow.src.default') });
  } else {
    q = R.liveLoad[state.building];
    if (q === null || q === undefined) q = 0;
    liveOnly = q;
    if (R.selfWeight != null){ q = r6(q + R.selfWeight); selfW = R.selfWeight; }
  }
  var pp = r6(q * area / n);
  var diff = terrainDiff(R, state.terrain);
  if (diff === null || diff === undefined) diff = 0;

  var fits = function(f){
    var cap = R.capacity[f];
    if (cap === null || cap === undefined) return false;
    return pp <= cap + 1e-9 && diff <= heightSpan(R, f);
  };

  if (candidate === 'AP|TP'){
    var apOk = fits('AP'), tpOk = fits('TP');
    if (apOk && tpOk){
      fam = 'TP';
      /* Haarukkatuloksessa vaihtoehdolla ei ole yhtä lukua, vaan sama haarukka. */
      out.alternative = { family:'AP', qty: range ? null : n, qtyRange: range ? [range.n1, range.n2] : null };
      how('how.family.aptp', { pp:pp, diff:diff }, 'ok', 'KRQ');
    } else if (tpOk){
      fam = 'TP';
      how('how.family.tp', { pp:pp, diff:diff }, 'ok', 'KRQ');
    } else if (apOk){
      fam = 'AP';
      how('how.family.tp', { pp:pp, diff:diff }, 'ok', 'KRQ');
    } else if (fits('KP')){
      fam = 'KP';
      how('how.family.kp', null, 'ok', 'KRQ');
    } else {
      out.handoff = { code:'kuorma', reason:t('h.reason.kuorma', { pp:pp, cap:R.capacity.KP }) };
      out.load = { q_kNm2:q, per_pillar_kN:pp, capacity_kN:R.capacity.KP, ok:false, snow_zone_kNm2:sk };
      return out;
    }
  } else if (!fits(fam)){
    out.handoff = { code:'kuorma', reason:t('h.reason.kuorma', { pp:pp, cap:R.capacity[fam] }) };
    out.load = { q_kNm2:q, per_pillar_kN:pp, capacity_kN:R.capacity[fam], ok:false, snow_zone_kNm2:sk };
    return out;
  }

  out.family = fam;
  out.grid = grid;
  out.range = range;
  out.load = { q_kNm2:q, per_pillar_kN:pp, capacity_kN:R.capacity[fam], ok:true, snow_zone_kNm2:sk };
  var loadKey = (state.building === 'katos')
    ? (selfW != null ? 'how.load.katos.sw' : 'how.load.katos')
    : (selfW != null ? 'how.load.sw' : 'how.load');
  how(loadKey,
      { q:q, live:liveOnly, sw:selfW, area:area, n:n, pp:pp, family:fam, cap:R.capacity[fam] },
      state.building === 'mokki' ? 'warn' : tierOf(R, 'liveLoad.' + state.building, 'ok'),
      selfW != null ? (R._workshopSrc || 'Työpaja')
        : (state.building === 'katos' ? srcOf(R, 'snowShape', 'YM') : srcOf(R, 'liveLoad.' + state.building, 'KESTOPUU')));
  how('how.terrain',
      { label:t('k3.' + state.terrain), family:fam, min:R.heightRange[fam][0], max:R.heightRange[fam][1] },
      'ok', srcOf(R, 'heightRange.' + fam, 'SITE'));

  /* Vaihe 5 – korkeudet. Ilman työpajan sääntöä tämä on PUUTTUU (T4). */
  var hs = heightsOf(fam, R);
  if (!R.heightSplitRule){
    var p = { family:fam, qty:n, heights:hs, heightRule:null };
    if (range){ p.qty = null; p.qtyRange = [range.n1, range.n2]; }
    out.pillars = [p];
    how('how.height.miss', { fill:PILLARS[fam].fill_mm }, 'miss', 'PUUTTUU');
  } else {
    var mode = R.heightSplitRule[state.terrain] || R.heightSplitRule.muut || null;
    var mn = hs[0], mx = hs[hs.length - 1];
    if (mode && /min|matal/i.test(mode) && !/puoli|half/i.test(mode)){
      out.pillars = [{ family:fam, qty:n, height:mn, heights:[mn], heightRule:mode }];
    } else if (mode && /puoli|half/i.test(mode)){
      var a = Math.ceil(n / 2), b = n - a;
      out.pillars = [{ family:fam, qty:a, height:mn, heights:[mn], heightRule:mode }];
      if (b > 0) out.pillars.push({ family:fam, qty:b, height:mx, heights:[mx], heightRule:mode });
    } else {
      out.pillars = [{ family:fam, qty:n, heights:hs, heightRule:null }];
    }
    if (range && out.pillars.length === 1){ out.pillars[0].qty = null; out.pillars[0].qtyRange = [range.n1, range.n2]; }
    how('how.height.rule', { rule:String(mode) }, 'ok', R._workshopSrc || 'Työpaja');
  }

  /* Vaihe 6 – tarvikkeet. */
  var acc = function(code, extra){
    var a = ACCESSORIES[code];
    var o = { code:code, qty:n, name:a.name, use:a.use, src:a.src, tier:a.tier };
    if (range){ o.qty = null; o.qtyRange = [range.n1, range.n2]; }
    if (extra) for (var k in extra) o[k] = extra[k];
    out.accessories.push(o);
  };
  if (state.building === 'katos'){
    if (state.post === '90-140'){
      acc('PIK-90-140'); how('how.acc.post', { post:'90–140', code:'PIK 90–140' }, 'ok', 'SITE');
    } else if (state.post === 'yli140'){
      acc('TL-150x150'); how('how.acc.post.heavy', null, 'warn', 'SITE');
    } else {
      acc('PIK-90-140', { choice:true }); acc('TL-150x150', { choice:true });
      how('how.acc.post.eos', null, 'miss', 'PUUTTUU');
    }
  } else {
    /* Paksuus valitsee pilarikengän mallin (ura mittaa paksuutta) ja palkin korkeus
       palkkikengän koon (satula mittaa korkeutta). Molemmat on luettu tuotekuvista,
       eivät BCE:n säännöstä, joten rivit ovat tilaa warn eivätkä ok. */
    var PAKSU = { '48':'PIK-50-70', '96':'PIK-90-140', '98':'PIK-90-140' };
    var SATULA = { '48x123':'PAK-100x150', '48x148':'PAK-100x150', '48x198':'PAK-100x200' };
    if (state.fixing === 'piilo'){
      acc('P-PIK-50x70'); how('how.acc.piilo', null, 'ok', 'SITE');
      if (state.thickness === '96' || state.thickness === '98')
        how('how.acc.pik.piilo', { mm:state.thickness }, 'miss', 'PUUTTUU');
    } else if (state.fixing === 'nakyva'){
      if (PAKSU[state.thickness]){
        acc(PAKSU[state.thickness]);
        how('how.acc.pik', { mm:state.thickness, code:ACCESSORIES[PAKSU[state.thickness]].short }, 'warn', 'SITE');
      } else {
        acc('PIK-50-70', { choice:true }); acc('PIK-90-140', { choice:true });
        how('how.acc.eos', null, 'miss', 'PUUTTUU');
      }
    } else if (state.fixing === 'palkki'){
      if (SATULA[state.beam]){
        acc(SATULA[state.beam]);
        how('how.acc.pak', { beam:t('k5.' + state.beam), code:ACCESSORIES[SATULA[state.beam]].short }, 'warn', 'SITE');
      } else {
        acc('PAK-100x150', { choice:true }); acc('PAK-100x200', { choice:true });
        how('how.acc.palkki', null, 'miss', 'PUUTTUU');
      }
    } else if (state.fixing === 'tasainen'){
      acc('TL-100x100', { choice:true }); acc('TL-100x175', { choice:true }); acc('TL-150x150', { choice:true });
      how('how.acc.tasainen', null, 'miss', 'PUUTTUU');
    }
  }
  out.accessories.push({ code:'NOSTOKORVA', qty:1, name:ACCESSORIES.NOSTOKORVA.name,
                         use:ACCESSORIES.NOSTOKORVA.use, src:'SITE', tier:'ok' });
  how('how.acc.nostokorva', null, 'ok', 'SITE');
  /* T8. Rivi kertoo, ettei PAK:ia ehdoteta — se olisi väärin silloin kun käyttäjä
     valitsi juuri sen, joten rivi jää pois siltä haaralta. */
  if (state.fixing !== 'palkki') how('how.pak', null, 'miss', 'PUUTTUU');

  /* Tarkistuslaskelmat. Raportoidaan, eivät valitse tuotetta. Nämä ovat ne
     kohdat, jotka rakennesuunnittelija tarkistaa ensimmäisenä. */
  var gEff = grid || (range ? range.gridLoose : null);
  var row = capacityRow(fam);
  out.check = { tributary_m2:null, tributary_kN:null, tributary_ratio:null,
                capacity_row:row, soil_required_kNm2:row ? row.soil_kNm2 : null,
                soil_checked:false, q_kNm2:q, per_pillar_kN:pp };
  if (gEff && !gEff.visualOnly){
    var tb = tributaryMax(state.w, state.l, gEff);
    var tkN = r6(q * tb.a);
    out.check.tributary_m2 = tb.a;
    out.check.tributary_kN = tkN;
    out.check.tributary_ratio = r6(tkN / pp);
    eng('eng.tributary', { sw:tb.sw, sl:tb.sl, a:tb.a, kN:tkN, ratio:out.check.tributary_ratio, pp:pp }, 'warn', 'LASKENTA');
  } else {
    eng('eng.tributary.katos', { n:n }, 'ok', 'SITE');
  }
  if (row) eng('eng.row', { kN:row.kN, ecc:row.ecc_mm, soil:row.soil_kNm2 }, 'ok', 'KRQ');
  if (fam === 'AP' || (out.alternative && out.alternative.family === 'AP'))
    eng('eng.ap', null, 'miss', 'PUUTTUU');
  if (row) eng('eng.soil', { soil:row.soil_kNm2 }, 'miss', 'PUUTTUU');
  if (!R.heightSplitRule && state.building !== 'katos'){
    var beamMm = (state.beam && /^48x(\d+)$/.test(state.beam)) ? state.beam.split('x')[1] : '–';
    eng('eng.height.inputs', { beam:beamMm, fill:PILLARS[fam].fill_mm }, 'miss', 'PUUTTUU');
    eng('eng.height.q', null, 'warn', 'LASKENTA');
  }
  if (state.building === 'terassi' && state.cover === 'kyllä')
    eng('eng.cover.snow', { q:q, snow:r6(R.snowShape * R.snowDefault) }, 'miss', 'PUUTTUU');
  if (state.building === 'mokki') eng('eng.mokki.load', { q:q }, 'miss', 'PUUTTUU');
  if (state.building !== 'katos' && liveOnly !== null && Math.abs(liveOnly - 2.0) > 1e-9)
    eng('eng.spacing.q', { q:q }, 'warn', 'KESTOPUU');

  /* Vaihe 7 – huomiot. */
  if (state.soil === 'pehmea') note('warn', 'n.soil.pehmea');
  if (state.soil === 'eos')    note('info', 'n.soil.eos');
  if (fam === 'KP')            note('info', 'n.kp.lift', { kg:weightRange('KP', R) });
  if (lim !== null && lim !== undefined && area <= lim) note('info', 'n.rakl', { limit:lim });

  return out;
}

if (typeof module !== 'undefined' && module.exports){
  module.exports = {
    compute:compute, RULES:RULES, defaultRules:defaultRules, gridFor:gridFor,
    PILLARS:PILLARS, ACCESSORIES:ACCESSORIES, SOURCES:SOURCES, I18N:I18N, fmt:fmt, FI:FI
  };
}
</script>

<script id="ui">
(function(){

var state = freshState();
window.dataLayer = window.dataLayer || [];

function freshState(){
  return { building:null, w:4, l:3, cover:null, heated:null, poles:2, terrain:null,
           soil:null, beam:null, thickness:null, fixing:null, post:null, postcode:'', email:'', tips:false,
           contact:'', message:'' };
}
function t(k, v){ return fmt(k, v, LANG); }
function num(v, d){ return nf(v, LANG, d); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
  });
}
function push(ev, data){
  var o = { event:ev }; if (data) for (var k in data) o[k] = data[k];
  window.dataLayer.push(o);
}
var phone = document.getElementById('phone');
var wsEl  = document.getElementById('ws');

/* --- polku ---------------------------------------------------------------- */
/* Ruutujärjestys 18.9.2026, kierros 2: **yksi kysymys per ruutu.**
   Kierroksella 1 ruutuja oli neljä, mutta kolme niistä kantoi kaksi kysymystä
   (rakennus + ehdollinen, korkeusero + maapohja, palkki + liitostyyppi). Olli hylkäsi
   sen: kahta kysymystä ei panna samaan ruutuun. Ruutuja on nyt kahdesta seitsemään
   rakennustyypin mukaan, ja koska jokaisella on tasan yksi kysymys, jokainen etenee
   klikkauksesta itsestään — Jatka-painike jää vain mittaruudulle, joka ei ole klikki.
   Napautusmäärä ei kasvanut: poistuneet Jatka-painikkeet korvaavat uudet ruudut.

   Mitat ovat yhä viimeisenä. Perustelu on luettavissa koodista: state.w ja state.l
   luetaan vain compute():ssa, eikä yksikään kysymys haarauda niistä, ja kieltäytymiset
   syntyvät joka tapauksessa vasta toResult():ssa.

   Ruutujen tunnukset ovat nimiä eivätkä numeroita (K1…K5). Numerot lupasivat kiinteän
   määrän, ja määrä riippuu nyt rakennuksesta; numerointi myös vanheni joka kerta kun
   järjestys muuttui. Näkyvä askellaskuri tulee steps():n pituudesta.
   Avoin päätös T1: työpaja vahvistaa tai kumoaa. */
function steps(){
  var b = state.building, a = ['rakennus'];
  if (b === 'terassi' || b === 'mokki') a.push('lisa');
  if (b && b !== 'tolppa'){
    a.push('kaltevuus', 'maapohja', 'liitos');
    /* Paksuus kysytään vasta palkin koon jälkeen, ja vain kun se muuttaa vastausta:
       teräslaatalla rakenne lasketaan tasaiselle levylle eikä mikään ura mittaa sitä. */
    if (b !== 'katos'){
      a.push('palkki');
      if (state.fixing !== 'tasainen') a.push('paksuus');
    }
  }
  a.push('mitat');
  return a;
}
function order(){ return ['start'].concat(steps(), ['result','lead','sent']); }
function stepsTotal(){ return steps().length; }
function stepNo(scr){ var i = steps().indexOf(scr); return i < 0 ? 0 : i + 1; }
function go(scr, noHist){
  if (!noHist && SCREEN !== scr) HIST.push(SCREEN);
  SCREEN = scr;
  /* Puhelimen paluuele hävitti viisi vastausta. Yksi historiamerkintä per ruutu
     tekee siitä askeleen taaksepäin. file://-osoitteessa pushState voi heittää. */
  try { history.pushState({ scr:scr }, ''); } catch (err){}
  render();
  if (phone.scrollIntoView) phone.scrollIntoView({ block:'nearest' });
  var h = phone.querySelector('h2'); if (h) h.setAttribute('tabindex','-1'), h.focus();
}
function next(){
  var o = order(), i = o.indexOf(SCREEN);
  var nxt = o[i + 1];
  if (nxt === 'result') return toResult();
  go(nxt);
}
function back(){
  if (!HIST.length) return;
  SCREEN = HIST.pop();
  render();
}
function toResult(){
  RESULT = compute(state, RULES, LANG);
  if (RESULT.handoff){
    push('laskuri_handoff', { code:RESULT.handoff.code, building:state.building, area:RESULT.area });
    go('handoff');
  } else {
    push('laskuri_result', { family:RESULT.family, n:totalPillars(RESULT), area:RESULT.area,
                             building:state.building, handoff:false });
    go('result');
  }
}
function totalPillars(r){
  var n = 0; r.pillars.forEach(function(p){ n += (p.qty || 0); });
  if (!n && r.pillars[0] && r.pillars[0].qtyRange) n = r.pillars[0].qtyRange[1];
  return n;
}

/* --- pohjapiirros ---------------------------------------------------------
   Yksi funktio, kaksi käyttöä: mittaruudun havainnekuva (ilman pilareita) ja
   tuloksen sijoituskaavio (pilarit paikoillaan). Mittakaava on aina tosi: ruudukko
   ja skaalapalkki kertovat metrit, joten 3 × 4 m ja 25 × 30 m näyttävät oikean
   kokoisilta suhteessa itseensä. */
function niceStep(maxDim){
  if (maxDim <= 6)  return 0.5;
  if (maxDim <= 15) return 1;
  if (maxDim <= 30) return 2;
  if (maxDim <= 60) return 5;
  return 10;
}
/* Mittaruudun havainnekuvassa mittakaava ei saa elää: jos alue skaalataan aina
   laatikon täyteen, pituuden vähentäminen suurentaa metrin ja leveys näyttää
   kasvavan, vaikka käyttäjä ei koskenut siihen. Siksi kiinteä vertailukenttä,
   jossa ruutu on aina yhtä suuri ja alue kasvaa kentän vasemmasta alakulmasta.
   Kenttä vaihtuu portaittain vasta kun mitta ei enää mahdu. */
function fieldFor(maxDim){
  var ladder = [10, 15, 20, 30, 50], i;
  for (i = 0; i < ladder.length; i++) if (maxDim <= ladder[i] + 1e-9) return ladder[i];
  return Math.ceil(maxDim);
}
function planSVG(o){
  var W = o.w, L = o.l, pts = o.pts || [];
  if (!(W > 0) || !(L > 0)) return '';
  var boxW = o.boxW || 280, boxH = o.boxH || 230;
  var F = o.field || 0;                       /* 0 = mittakaava sovitetaan kuvaan */
  var sc = F ? Math.min(boxW, boxH) / F : Math.min(boxW / W, boxH / L);
  var pw = W * sc, ph = L * sc;
  var fw = F ? F * sc : pw, fh = F ? F * sc : ph;
  /* Kiinteässä kentässä alue on aina kiinni kentän alareunassa, joten leveysmitan
     teksti on aina samalla korkeudella (padT + fh + 31). Ruudun kokoteksti mahtuu
     samalle riville oikeaan reunaan, jolloin alamarginaali on 52 sijasta 40. */
  var padL = 42, padT = 14, padR = 16, padB = F ? 40 : 62;
  var vw = Math.round(fw + padL + padR), vh = Math.round(fh + padT + padB);
  var oy = F ? F - L : 0;                     /* alue kiinni kentän alareunassa */
  var FX = function(m){ return padL + m * sc; }, FY = function(m){ return padT + m * sc; };
  var X = function(m){ return FX(m); }, Y = function(m){ return FY(m + oy); };
  var f1 = function(v){ return v.toFixed(1); };
  var step = niceStep(F || Math.max(W, L));
  var g = '', k;

  /* metriruudukko */
  if (F){
    for (k = step; k < F - 1e-9; k += step)
      g += '<line class="grid" x1="' + f1(FX(k)) + '" y1="' + f1(FY(0)) + '" x2="' + f1(FX(k)) + '" y2="' + f1(FY(F)) + '"/>'
        +  '<line class="grid" x1="' + f1(FX(0)) + '" y1="' + f1(FY(k)) + '" x2="' + f1(FX(F)) + '" y2="' + f1(FY(k)) + '"/>';
    g += '<rect class="frame" x="' + f1(FX(0)) + '" y="' + f1(FY(0)) + '" width="' + f1(fw) + '" height="' + f1(fh) + '"/>'
      +  '<rect class="sel" x="' + f1(X(0)) + '" y="' + f1(Y(0)) + '" width="' + f1(pw) + '" height="' + f1(ph) + '"/>';
  } else {
    for (k = step; k < W - 1e-9; k += step)
      g += '<line class="grid" x1="' + f1(X(k)) + '" y1="' + f1(Y(0)) + '" x2="' + f1(X(k)) + '" y2="' + f1(Y(L)) + '"/>';
    for (k = step; k < L - 1e-9; k += step)
      g += '<line class="grid" x1="' + f1(X(0)) + '" y1="' + f1(Y(k)) + '" x2="' + f1(X(W)) + '" y2="' + f1(Y(k)) + '"/>';
  }

  /* rakennuksen ulkoreuna */
  g += '<rect class="outline" x="' + f1(X(0)) + '" y="' + f1(Y(0)) + '" width="' + f1(pw) + '" height="' + f1(ph) + '"/>';

  /* Pilarit. Säde seuraa pilarien väliä, jottei tiheä ruudukko mene puuroksi.
     Väli tulee kutsujalta: pisteistä etsiminen olisi O(n²) ja kaatuisi tuhannella
     pilarilla. */
  if (pts.length){
    var minGap = o.gap || Math.min(W, L);
    var rad = Math.max(1.4, Math.min(5, minGap * sc / 4));
    g += '<g class="pill">' + pts.map(function(p){
      return '<circle cx="' + f1(X(p[0])) + '" cy="' + f1(Y(p[1])) + '" r="' + rad.toFixed(1) + '"/>';
    }).join('') + '</g>';
  }

  /* mittaviivat: sana ja luku sillä reunalla, jota ne mittaavat */
  var dy = Y(L) + 16;
  g += '<line class="dim" x1="' + f1(X(0)) + '" y1="' + dy + '" x2="' + f1(X(W)) + '" y2="' + dy + '"/>'
    +  '<line class="dim" x1="' + f1(X(0)) + '" y1="' + (dy - 4) + '" x2="' + f1(X(0)) + '" y2="' + (dy + 4) + '"/>'
    +  '<line class="dim" x1="' + f1(X(W)) + '" y1="' + (dy - 4) + '" x2="' + f1(X(W)) + '" y2="' + (dy + 4) + '"/>'
    +  '<text class="dimtx" x="' + f1(X(W / 2)) + '" y="' + (dy + 15) + '" text-anchor="middle">'
    +  esc(t('k2.w')) + ' ' + esc(num(W)) + ' m</text>';
  var dx = X(0) - 22;
  g += '<line class="dim" x1="' + dx + '" y1="' + f1(Y(0)) + '" x2="' + dx + '" y2="' + f1(Y(L)) + '"/>'
    +  '<line class="dim" x1="' + (dx - 4) + '" y1="' + f1(Y(0)) + '" x2="' + (dx + 4) + '" y2="' + f1(Y(0)) + '"/>'
    +  '<line class="dim" x1="' + (dx - 4) + '" y1="' + f1(Y(L)) + '" x2="' + (dx + 4) + '" y2="' + f1(Y(L)) + '"/>'
    +  '<text class="dimtx" transform="translate(' + (dx - 8) + ',' + f1(Y(L / 2)) + ') rotate(-90)" text-anchor="middle">'
    +  esc(t('k2.l')) + ' ' + esc(num(L)) + ' m</text>';

  /* Mittakaavapalkki. Kokonaispituus pyöristetään tuttuun lukuun (1, 2, 5, 10, 20, 50 m),
     jottei palkissa lue 2,5 m silloin kun 2 m kertoo saman asian selvemmin. */
  if (F){
    /* Kiinteässä kentässä ruutu itse on mittakaava: mittakaavapalkki olisi toistoa,
       ja ruudun kokoteksti oli toistoa sekin. Kumpaakaan ei piirretä. */
  } else {
  var nice = [0.5, 1, 2, 5, 10, 20, 50], total = step, ni;
  for (ni = 0; ni < nice.length; ni++) if (nice[ni] <= W * 0.6) total = nice[ni];
  if (total < step) total = step;
  var segs = Math.max(1, Math.min(6, Math.round(total / step)));
  total = segs * step;
  var barY = vh - 22, barH = 5, bx = X(0);
  for (k = 0; k < segs; k++){
    if (k % 2 === 0)
      g += '<rect class="scalefill" x="' + f1(bx + k * step * sc) + '" y="' + barY + '" width="' + f1(step * sc) + '" height="' + barH + '"/>';
  }
  g += '<rect class="scalebar" fill="none" x="' + f1(bx) + '" y="' + barY + '" width="' + f1(segs * step * sc) + '" height="' + barH + '"/>'
    +  '<text class="scaletx" x="' + f1(bx + segs * step * sc + 6) + '" y="' + (barY + barH + 1) + '">'
    +  esc(num(segs * step)) + ' m</text>';
  }

  var alt = pts.length ? t('r.diagram.alt', { n:pts.length, w:num(W), l:num(L) })
                       : t('k2.plan.alt', { w:num(W), l:num(L) });
  return '<div class="plan' + (o.small ? ' plan-s' : '') + '">'
    + '<svg viewBox="0 0 ' + vw + ' ' + vh + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="' + esc(alt) + '">'
    + g + '</svg>' + (o.caption || '') + '</div>';
}
/* tuloksen pilaripisteet metreinä */
function resultPoints(r){
  var W = state.w, L = state.l;
  var g = r.grid || (r.range ? r.range.gridLoose : null);
  if (!g) return null;
  var pts = [], i, j;
  if (g.visualOnly){
    var n = r.pillars[0].qty || 0, a = Math.ceil(n / 2), b = n - a;
    var spread = function(cnt, len){
      var arr = []; if (cnt === 1) return [len / 2];
      for (var k = 0; k < cnt; k++) arr.push(k * (len / (cnt - 1)));
      return arr;
    };
    if (L >= W){
      spread(a, L).forEach(function(y){ pts.push([0, y]); });
      spread(b, L).forEach(function(y){ pts.push([W, y]); });
    } else {
      spread(a, W).forEach(function(x){ pts.push([x, 0]); });
      spread(b, W).forEach(function(x){ pts.push([x, L]); });
    }
  } else {
    for (i = 0; i < g.cols; i++) for (j = 0; j < g.rows; j++)
      pts.push([i * (W / (g.cols - 1)), j * (L / (g.rows - 1))]);
  }
  return pts;
}
function diagram(){
  var r = RESULT;
  if (!r || r.handoff || state.building === 'tolppa') return '';
  var pts = resultPoints(r);
  if (!pts) return '';
  var g = r.grid || (r.range ? r.range.gridLoose : null);
  var gap = g && !g.visualOnly ? Math.min(g.spacing_w, g.spacing_l)
          : Math.max(state.w, state.l) / Math.max(1, Math.ceil((r.pillars[0].qty || 2) / 2) - 1);
  return planSVG({ w:state.w, l:state.l, pts:pts, gap:gap,
    caption: r.range ? '<p class="fine">' + esc(t('r.diagram.range', { sp:num(r.range.sp2) })) + '</p>' : '' });
}

            b === 'katos' ? !!state.post : !!(state.beam && state.fixing));

    G(1, 1, 'Δh > 60 cm', hf === 'korkeus');
    if (b === 'mokki') G(1, 2, 'Mökki ja routiva', hf === 'mokki_savi');
    G(1, 3, 'A > raja', hf === 'area');
    G(1, 4, 'F > Rd', hf === 'kuorma');
  }

  A(2, 0, 'Käyttökohde', !!b);
  if (b !== 'tolppa') A(2, 1, 'Korkeusalue', !!state.terrain);
  A(2, 4, (r && r.family) ? r.family + '-pilari' : 'Tuoteperhe', !!(r && r.family));

  if (b === 'katos') A(3, 3, 'Tolpat = pilarit', !!b);
  else if (b !== 'tolppa') A(3, 2, 'Jakoväli palkista', !!state.beam);
  A(3, 4, (r && !r.handoff)
      ? 'n = ' + (r.pillars[0].qty != null ? num(r.pillars[0].qty) : r.pillars[0].qtyRange.join('–'))
      : 'n = c · r', !!(r && !r.handoff));

  if (b !== 'tolppa'){
    A(4, 3, 'A = w · l', !!b);
    A(4, 4, (r && r.load && r.load.per_pillar_kN != null)
        ? 'F = ' + num(r.load.per_pillar_kN) + ' kN' : 'F = q · A / n',
      !!(r && r.load && r.load.per_pillar_kN != null));
    A(5, 2, 'Liitostyyppi', b === 'katos' ? !!state.post : !!state.fixing);
    A(5, 4, (r && r.accessories.length) ? r.accessories.length + ' nimikettä' : 'Kiinnikkeet',
      !!(r && r.accessories.length));
  }

}
function swimWrap(text, max){
  var w = String(text).split(' '), out = [], cur = '';
  for (var i = 0; i < w.length; i++){
    if (!cur) cur = w[i];
    else if ((cur + ' ' + w[i]).length <= max) cur += ' ' + w[i];
    else { out.push(cur); cur = w[i]; }
    if (out.length === 1 && cur.length > max) break;
  }
  if (cur) out.push(cur);
  return out.slice(0, 2);
}
function swimlane(){
  var N = swimNodes(), LW = 92, CW = 86, HH = 26, LH = 44;
  var W = LW + SWIM_COLS.length * CW, H = HH + SWIM_LANES.length * LH;
  var o = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Päätöspuu uimaratoina: '
        + 'mihin kukin vastaus vaikuttaa ja missä kohtaa logiikkaa ollaan nyt.">';

  SWIM_COLS.forEach(function(c, i){
    o += '<text class="col-lbl" x="' + (LW + i * CW + CW / 2) + '" y="16" text-anchor="middle">' + esc(c) + '</text>';
  });
  SWIM_LANES.forEach(function(l, i){
    var y = HH + i * LH;
    o += '<line class="sep" x1="0" y1="' + y + '" x2="' + W + '" y2="' + y + '"/>'
      +  '<text class="lane-lbl" x="' + (LW - 8) + '" y="' + (y + LH / 2 + 3) + '" text-anchor="end">' + esc(l) + '</text>';
  });
  o += '<line class="sep" x1="0" y1="' + H + '" x2="' + W + '" y2="' + H + '"/>'
    +  '<line class="sep" x1="' + LW + '" y1="0" x2="' + LW + '" y2="' + H + '"/>';

  /* yhteysviivat: pystysuunnassa sarakkeen sisällä, vaakasuunnassa uimaradalla */
  var byCol = {}, byLane = {};
  N.forEach(function(n){
    (byCol[n.col] = byCol[n.col] || []).push(n.lane);
    (byLane[n.lane] = byLane[n.lane] || []).push(n.col);
  });
  Object.keys(byCol).forEach(function(c){
    var ls = byCol[c], mn = Math.min.apply(null, ls), mx = Math.max.apply(null, ls);
    if (mx > mn){
      var x = LW + (+c) * CW + CW / 2;
      o += '<path class="flow" d="M' + x + ' ' + (HH + mn * LH + 37) + ' V' + (HH + mx * LH + 7) + '"/>';
    }
  });
  Object.keys(byLane).forEach(function(l){
    var cs = byLane[l], mn = Math.min.apply(null, cs), mx = Math.max.apply(null, cs);
    if (mx > mn){
      var y = HH + (+l) * LH + LH / 2;
      o += '<path class="flow" d="M' + (LW + mn * CW + CW - 4) + ' ' + y + ' H' + (LW + mx * CW + 4) + '"/>';
    }
  });

  N.forEach(function(n){
    var x = LW + n.col * CW + 5, y = HH + n.lane * LH + 7, w = CW - 10, h = 30;
    var lines = swimWrap(n.text, 12);
    o += '<rect class="bx-' + n.st + '" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="3"/>';
    lines.forEach(function(ln, i){
      var ty = y + (lines.length === 1 ? 19 : (i === 0 ? 13 : 24));
      o += '<text class="nlbl tx-' + n.st + '" x="' + (x + w / 2) + '" y="' + ty + '" text-anchor="middle">' + esc(ln) + '</text>';
    });
  });
  return '<div class="swim">' + o + '</svg></div>'
    + '<div class="swimkey">'
    + '<span><i></i>odottaa</span>'
    + '<span><i class="k-done"></i>päätetty</span>'
    + '<span><i class="k-now"></i>käsillä nyt</span>'
    + '<span><i class="k-hit"></i>kieltäytyminen laukesi</span>'
    + '</div>';
}

/* Monisanainen muuttujanimi sidotaan kovilla väleillä: "kuorma neliölle" ei saa
   katketa kesken murtoluvun osoittajan. */
function mv(x, sub){
  return '<span class="v">' + esc(String(x).replace(/ /g, '\u00A0')) + '</span>'
       + (sub ? '<span class="sub">' + esc(sub) + '</span>' : '');
}
function mo(x){ return '<span class="op">' + esc(x) + '</span>'; }
function mn(x){ return '<span>' + esc(typeof x === 'number' ? num(x) : x) + '</span>'; }
function mu(x){ return '<span class="u">' + esc(x) + '</span>'; }
function mfrac(a, b){ return '<span class="frac"><span class="num">' + a + '</span><span class="den">' + b + '</span></span>'; }
function mgrp(parts){ return '<span class="mg">' + parts.join('') + '</span>'; }
function mrow(parts){
  /* Ruudunlukija lukee kaavan tekstinä: murtoviiva luetaan kauttaviivana. */
  var html = parts.join('');

function formulaBlock(inline){

function renderPhone(){
  var m = { start:rStart, rakennus:rRakennus, lisa:rLisa, kaltevuus:rKaltevuus,
            maapohja:rMaapohja, liitos:rLiitos, palkki:rPalkki, paksuus:rPaksuus, mitat:rMitat,
            result:rResult, lead:rLead, sent:rSent, stores:rStores, handoff:rHandoff };
  phone.innerHTML = (m[SCREEN] || rStart)();
}
function render(){ renderPhone(); renderWS(); }
function recalc(){
  if (['result','lead','sent','stores','handoff'].indexOf(SCREEN) < 0) return;
  RESULT = compute(state, RULES, LANG);
  if (RESULT.handoff && SCREEN !== 'handoff') SCREEN = 'handoff';
  else if (!RESULT.handoff && SCREEN === 'handoff' && SENT !== 'handoff') SCREEN = 'result';
}

phone.addEventListener('change', function(e){
  var nk = e.target.getAttribute && e.target.getAttribute('data-num');
  if (!nk) return;
  var lim = numLimits(nk);
  var v = parseFloat(String(e.target.value).replace(',', '.'));
  if (isNaN(v)) v = state[nk];
  v = Math.round(v / (lim.dec ? 0.5 : 1)) * (lim.dec ? 0.5 : 1);
  state[nk] = Math.min(lim.max, Math.max(lim.min, v));
  render();
});
phone.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!b || b.disabled) return;
  var a = b.getAttribute('data-act'), k, v;
  if (a === 'back'){ back(); return; }
  if (a === 'start'){ push('laskuri_start'); go('rakennus'); return; }
  if (a === 'next'){ next(); return; }
  if (a === 'goto'){ go(b.getAttribute('data-scr')); return; }
  if (a === 'pick'){
    k = b.getAttribute('data-key'); v = b.getAttribute('data-val');
    state[k] = v;
    if (k === 'building'){
      state.cover = null; state.heated = null; state.post = null; state.beam = null;
      state.thickness = null; state.fixing = null;
      state.poles = (v === 'katos') ? 4 : 2;
    }
    push('laskuri_step', { step:SCREEN, value:v });
    render();
    /* Jokaisella klikkiruudulla on tasan yksi kysymys, joten valinta vie eteenpäin
       eikä erillistä Jatkaa tarvita. Viive jättää valinnan näkyviin hetkeksi. */
    setTimeout(next, 150);
    return;
  }
  if (a === 'bump'){
    k = b.getAttribute('data-key');
    var d = parseFloat(b.getAttribute('data-d'));
    /* Rajat luetaan numLimits():stä eikä kirjoiteta tähän uudelleen. Ennen tässä oli
       oma katto 15, vaikka kenttä ja + -painike lupasivat 50: yli 15 metrin kohdalla
       painike näytti toimivalta mutta ei tehnyt mitään. */
    var lim = numLimits(k), min = lim.min, max = lim.max;
    var nv = Math.round(((state[k] || 0) + d) * 100) / 100;
    state[k] = Math.min(max, Math.max(min, nv));
    render();
    return;
  }
  if (a === 'stores'){ push('laskuri_store_view'); go('stores'); return; }
  if (a === 'expert'){
    push('laskuri_handoff', { code:'epavarma', building:state.building, area:RESULT ? RESULT.area : null });
    if (RESULT) RESULT.handoff = null;
    go('handoff');
    return;
  }
  if (a === 'sendlead'){
    var payload = { email:state.email, postcode:state.postcode, tips:!!state.tips, state:state, result:RESULT };
    console.log('[bce-pilarilaskuri] liidi, ei oikeaa lähetystä:', payload);
    push('laskuri_lead', { has_postcode:!!state.postcode, tips:!!state.tips });
    SNOWDELTA = null;
    if (state.building === 'katos' && state.postcode){
      var before = RESULT, after = compute(state, RULES, LANG);
      RESULT = after;
      if (after.handoff){ SENT = null; go('handoff'); return; }
      if (before && !before.handoff && after.load.snow_zone_kNm2 !== before.load.snow_zone_kNm2)
        SNOWDELTA = t('s.snow', { n:totalPillars(after) });
    }
    SENT = 'lead'; go('sent');
    return;
  }
  if (a === 'sendhandoff'){
    console.log('[bce-pilarilaskuri] yhteydenotto, ei oikeaa lähetystä:',
      { contact:state.contact, message:state.message || handoffPlaceholder(), state:state, result:RESULT });
    push('laskuri_lead', { has_postcode:false, tips:false });
    SENT = 'handoff'; render();
    return;
  }
  if (a === 'call'){
    var box = phone.querySelector('[data-act="call"]');
    box.insertAdjacentHTML('afterend', '<p class="fine" role="status">' + esc(t('h.call.todo')) + '</p>');
    box.disabled = true;
    return;
  }
  if (a === 'restart'){
    push('laskuri_restart');
    state = freshState(); RESULT = null; SENT = null; SNOWDELTA = null; HIST = [];
    go('start', true);
    return;
  }
});
phone.addEventListener('input', function(e){
  var el = e.target;
  var nk = el.getAttribute && el.getAttribute('data-num');
  if (nk){
    /* Kesken kirjoittamisen ei piirretä uudelleen: se veisi kohdistuksen ja
       katkaisisi luvun. Rajat tarkistetaan vasta kun kenttä jätetään. */
    var raw = String(el.value).replace(',', '.');
    var v = parseFloat(raw);
    if (!isNaN(v)) state[nk] = v;
    /* Kuva ja pinta-ala päivittyvät kirjoittaessa; kenttää itseään ei piirretä
       uudelleen, jottei kohdistus ja kesken oleva luku katoa. Vain piirros korvataan,
       ei koko lohkoa: säätimet ovat nyt samassa ruudukossa, ja niiden uudelleenluonti
       veisi kohdistuksen juuri siitä kentästä, johon kirjoitetaan. */
    var plan = document.getElementById('k2plan');
    if (plan && (nk === 'w' || nk === 'l')) plan.innerHTML = k2plan();
    var area = document.getElementById('k2area');
    if (area) area.textContent = t('k2.area', { area:num(state.w * state.l) });
    return;
  }
  var k = el.getAttribute && el.getAttribute('data-key');
  if (!k) return;
  state[k] = (el.type === 'checkbox') ? el.checked : el.value;
  var cta = phone.querySelector('[data-act="sendlead"]') || phone.querySelector('[data-act="sendhandoff"]');
  if (cta) cta.disabled = (cta.getAttribute('data-act') === 'sendlead') ? !/@/.test(state.email) : !state.contact;
});

/* --- työpajapaneelin tapahtumat ------------------------------------------- */
function setHSR(mode, custom){
  if (!mode){ RULES.heightSplitRule = null; delete RULES._edited['heightSplitRule']; return; }
  var o = { __mode:mode, __custom:custom || '' };
  if (mode === 'min') o.muut = 'min';
  else if (mode === 'puoliksi') o.muut = 'puoliksi';
  else (custom || '').split(',').forEach(function(pair){
    var kv = pair.split(':');
    if (kv.length === 2) o[kv[0].trim()] = kv[1].trim();
  });
  RULES.heightSplitRule = o;
  RULES._edited['heightSplitRule'] = true;
}
function markWorkshop(el){
  var row = el.closest ? el.closest('.t') : null;
  if (!row) return;
  Array.prototype.slice.call(row.querySelectorAll('.chip')).forEach(function(c){ c.parentNode.removeChild(c); });
  el.insertAdjacentHTML('beforebegin', chip('ok', 'Työpaja'));
}
wsEl.addEventListener('input', function(e){
  var el = e.target, p = el.getAttribute('data-tune'), sp = el.getAttribute('data-snow');
  if (!p && !sp) return;
  var raw = String(el.value).trim().replace(',', '.');
  var v = (raw === '') ? null : parseFloat(raw);
  if (raw !== '' && isNaN(v)) return;
  if (p){ setPath(RULES, p, v); RULES._edited[editedKey(p)] = true; }
  else { RULES.snowByPostcodePrefix[sp] = v; RULES._edited['snowByPostcodePrefix'] = true; }
  markWorkshop(el);
  recalc(); renderPhone();
});
wsEl.addEventListener('change', function(e){
  if (e.target.getAttribute('data-act') === 'hsr'){
    setHSR(e.target.value, '');
    recalc(); render();
  }
});
wsEl.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!b) return;
  var a = b.getAttribute('data-act');
  if (a === 'loadcase'){
    var sel = document.getElementById('tc'), id = sel.value;
    if (!id) return;
    var c = TESTCASES.filter(function(x){ return String(x.id) === String(id); })[0];
    if (!c) return;
    /* Esimerkit ovat speksin tapauksia: niiden on toistuttava samanlaisina.
       Siksi sääntövakiot palautetaan ensin lähteiden arvoihin, ja vasta sitten
       ajetaan tapauksen omat muutokset. Ilman tätä edellisen esimerkin säätö
       jäisi voimaan ja seuraava tapaus antaisi hiljaa väärän tuloksen. */
    RULES = defaultRules();
    state = freshState();
    for (var k in c.st) state[k] = c.st[k];
    if (c.rules) c.rules(RULES);
    SENT = null; SNOWDELTA = null; HIST = ['start'];
    toResult();
    return;
  }
  if (a === 'addsnow'){
    var pre = (document.getElementById('tu-snowpre').value || '').trim();
    var val = (document.getElementById('tu-snowval').value || '').trim().replace(',', '.');
    if (!/^\d{2}$/.test(pre) || val === '' || isNaN(parseFloat(val))) return;
    RULES.snowByPostcodePrefix[pre] = parseFloat(val);
    RULES._edited['snowByPostcodePrefix'] = true;
    recalc(); render();
    return;
  }
  if (a === 'resetrules'){
    RULES = defaultRules();
    recalc(); render();
    return;
  }
  if (a === 'hsrc'){ return; }
});
wsEl.addEventListener('blur', function(e){
  if (e.target.getAttribute && e.target.getAttribute('data-act') === 'hsrc'){
    setHSR('oma', e.target.value);
    recalc(); renderPhone();
  }
}, true);

/* --- kieli ja työpajakytkin ----------------------------------------------- */
function renderLangs(){
  var box = document.getElementById('langs');
  box.innerHTML = ['fi','sv','en'].map(function(l){
    return '<button class="lang" type="button" data-lang="' + l + '" aria-pressed="' + (LANG === l ? 'true' : 'false') + '">' + l + '</button>';
  }).join('');
}
document.getElementById('langs').addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-lang]') : null;
  if (!b) return;
  LANG = b.getAttribute('data-lang');
  document.documentElement.setAttribute('lang', LANG);
  renderLangs();
  if (RESULT) RESULT = compute(state, RULES, LANG);
  render();
});
window.addEventListener('popstate', function(){
  if (HIST.length){ SCREEN = HIST.pop(); render(); }
});

var wsBtn = document.getElementById('wstoggle');
wsBtn.addEventListener('click', function(){
  WS = !WS;
  wsBtn.setAttribute('aria-pressed', WS ? 'true' : 'false');
  try { sessionStorage.setItem('bce-ws', WS ? '1' : '0'); } catch (err){}
  renderWS();
});
try { if (sessionStorage.getItem('bce-ws') === '1'){ WS = true; wsBtn.setAttribute('aria-pressed','true'); } } catch (err){}

renderLangs();
render();

/* --- kaappauskoukku ------------------------------------------------------
   Miro-vientiä varten jokainen polun ruutu on saatava esiin ilman klikkaamista:
   headless-Chrome ei aja klikkiketjua luotettavasti, ja käsin napsuteltu kuvasarja
   vanhenee heti kun järjestys muuttuu. ?polku=terassi&ruutu=liitos asettaa polulle
   tyypillisen vastausjoukon ja hyppää nimettyyn ruutuun.

   Tämä on vientityökalu, ei tuotteen ominaisuus: ilman parametria mikään ei muutu,
   ja parametri ei ole linkitetty mistään. Vastaukset ovat samat kuin
   docs/pilarilaskuri/ruutukuvat.py:ssä, joka ajaa kuvat. */
var DEMOT = {
  terassi: { building:'terassi', w:4, l:5, cover:'ei',    terrain:'alle20', soil:'kantava', beam:'48x148', thickness:'48', fixing:'nakyva' },
  mokki:   { building:'mokki',   w:5, l:5, heated:'kesa', terrain:'20-40',  soil:'kantava', beam:'48x148', thickness:'96', fixing:'palkki' },
  sauna:   { building:'sauna',   w:4, l:3,               terrain:'alle20', soil:'kantava', beam:'48x148', thickness:'48', fixing:'nakyva' },
  piha:    { building:'piha',    w:4, l:3,               terrain:'alle20', soil:'kantava', beam:'48x148', thickness:'48', fixing:'nakyva' },
  katos:   { building:'katos',   w:6, l:8, poles:8,      terrain:'20-40',  soil:'kantava', post:'90-140' },
  tolppa:  { building:'tolppa',  poles:4 }
};
(function demo(){
  var q = {}, hae = String(location.search || '').replace(/^\?/, '');
  hae.split('&').forEach(function(pari){
    if (!pari) return;
    var i = pari.indexOf('=');
    q[decodeURIComponent(i < 0 ? pari : pari.slice(0, i))] = i < 0 ? '' : decodeURIComponent(pari.slice(i + 1));
  });
  if (!q.polku || !DEMOT[q.polku]) return;
  /* karsi=1 piilottaa yläpalkin kaappauksista: 43 ruudun ruudukossa sama otsikkorivi
     43 kertaa on pelkkää kohinaa, eikä se kuulu polkukaavioon. */
  if (q.karsi){
    var tyyli = document.createElement('style');
    tyyli.textContent = '.top,header,.wsbtn{display:none!important}'
      + '.stage{padding-top:0!important}body{background:#fff}';
    document.head.appendChild(tyyli);
  }
  var d = DEMOT[q.polku], k;
  for (k in d) state[k] = d[k];
  var ruutu = q.ruutu || 'result';
  if (ruutu === 'result'){ toResult(); return; }
  SCREEN = ruutu;
  render();
})();
})();
</script>
