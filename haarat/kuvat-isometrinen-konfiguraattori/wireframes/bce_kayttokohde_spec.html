(function(){
  "use strict";
  const E=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const L=u=>E(SPECLINK(u));
  const J=JAETTU;

  const avain=(new URLSearchParams(location.search).get("kohde")||"").toLowerCase();
  const K=KOHTEET[avain]||KOHTEET.autokatos;

  const t=s=>String(s==null?"":s).replace(/\{(gen|ill|nimi|per)\}/g,(_,k)=>K[k]);
  const T=s=>E(t(s)).replace(/\[([^\]]+)\]/g,m=>'<span class="tbd">'+m+"</span>");

  document.title=K.seo_title;
  document.querySelector('meta[name="description"]').setAttribute("content",K.seo_description);

  /* Ristiinlinkityssääntö 6: murupolku on pakollinen, koska orgaaninen kävijä
     laskeutuu suoraan tälle sivulle. */
  SPECSHELL(E,{crumb:[["Etusivu","/"],["Perustuksen teko",J.url.kayttokohteet],[K.nimi,null]],
               active:"Perustuksen teko"});

  const sect=(inner,id)=>'<div class="w"'+(id?' id="'+id+'"':"")+"><section>"+inner+"</section></div>";
  const head=(h,p)=>'<div class="head"><h2>'+T(h)+"</h2>"+(p?"<p>"+T(p)+"</p>":"")+"</div>";
  const arrow=x=>T(x)+" →";
  const mitoita=sijainti=>'<a class="btn btn-1" href="'+L(J.url.mitoita)+
    '" data-event="cta_konfiguraattori" data-sijainti="'+E(sijainti)+'">'+T(J.cta_mitoita)+"</a>";
  const more=(l,sij)=>'<a class="more" href="'+L(l[1])+'" data-event="'+E(l[2])+'"'+
    (sij?' data-sijainti="'+E(sij)+'"':"")+">"+arrow(l[0])+"</a>";
  const erotin='<span aria-hidden="true"> · </span>';

  /* Videot slotin mukaan. Tyhjä slot on archive, joka näkyy vain moduulissa 13. */
  const slot=s=>K.videos.filter(v=>(v.slot||"archive")===s);
  const vidlist=vs=>vs.length?'<ul class="vidlist">'+vs.map(v=>"<li>"+
    (v.url?'<a href="'+E(v.url)+'" data-event="cta_asennusvideo">'+T(v.title)+"</a>":T(v.title))+
    (v.topic?' <span class="vt">'+T(v.topic)+"</span>":"")+"</li>").join("")+"</ul>":"";

  /* Moduuli 4: aina viisi askelta, 1 ja 5 kentistä, 2–4 jaetusta sisällöstä. */
  const askeleet=[K.step_first].concat(J.shared_steps_2_3_4,[K.step_last]);
  /* Moduuli 11: neljä jaettua kysymystä ensin, sitten sivukohtaiset. */
  const ukk=J.shared_faq.concat(K.faq_local);

  document.getElementById("main").innerHTML=

  /* 1 · Hero. H1 on object_name sellaisenaan. Ensisijaisen CTA:n vieressä
        hero_value_prop, toissijainen on ankkuri moduuliin 4. */
  '<div class="w"><section class="hero">'+
    "<div><h1>"+T(K.object_name)+'</h1><p class="lede">'+T(K.hero_intro)+"</p>"+
      '<div class="cta">'+mitoita("hero")+
        '<span class="sub">'+T(K.hero_value_prop)+"</span></div>"+
      '<div class="cta cta-2">'+more(J.hero_cta2,"hero")+"</div></div>"+
    '<div class="hero-img">'+T(J.hero_image)+"</div></section></div>"+

  /* 2 · Kuvanosto. Kuvateksti on pakollinen jokaisella kuvalla; ilman kuvatekstiä
        kuvaa ei renderöidä. Merkitty kuvateksti on kuvateksti, ei puuttuva kenttä. */
  sect(head(J.h2_kuvanosto)+
    '<div class="cases cases-3">'+K.gallery.filter(g=>g.caption).map(g=>'<div class="case">'+
      '<div class="ph ph-1610">'+T(g.image)+"</div><p>"+T(g.caption)+"</p></div>").join("")+"</div>")+

  /* 3 · Kohteen oma kysymys. Ennen tuotepuhetta. Ainoa moduuli joka erottaa sivut
        toisistaan hakutuloksessa, joten otsikko on H2 ja teksti indeksoituvaa. */
  sect(head(K.focus.heading)+"<p>"+T(K.focus.body)+"</p>"+vidlist(slot("focus")),"kysymys")+

  /* 4 · Näin perustus tehdään. Viisi askelta, jokaisella voi olla video. Moduulin
        lopussa linkki kirjalliseen asennusohjeeseen. */
  sect(head(J.h2_tekeminen)+'<div class="flow">'+
    askeleet.map((s,i)=>'<div class="st"><div class="ph ph-1610">'+T(s.img)+"</div>"+
      '<div class="tx"><span class="n" aria-hidden="true">'+(i+1)+"</span><b>"+T(s.h)+"</b>"+
      "<p>"+T(s.p)+"</p>"+vidlist(slot("step_"+(i+1)))+"</div></div>").join("")+"</div>"+
    '<p class="next">'+more(J.ohje_linkki)+"</p>","tekeminen")+

  /* 5 · Mikä pilari tähän. Alkaa valintasäännöstä, ei mallitunnuksesta. Ei
        kuormalukuja eikä taulukoita. Päättyy mitoitus-CTA:han ja perhelinkkiin. */
  sect('<div class="side"><div>'+
    head(J.h2_pilari,K.selection_rule)+
    (K.exception_model?"<p>"+T(K.exception_condition)+"</p>":"")+
    "<p>"+T(K.quantity_drivers)+"</p>"+
    '<div class="cta-block">'+mitoita("pilari")+"</div>"+
    '<p class="next">'+
      '<a class="more" href="'+L(K.primary_model[1])+'" data-event="cta_pilariperhe" data-perhe="'+
        E(t(K.primary_model[0]))+'">'+arrow("Katso "+K.primary_model[0])+"</a>"+
      erotin+more(J.vertaa)+"</p></div>"+
    '<div class="ph ph-43">'+T(K.model_image)+"</div></div>","pilari")+

  /* 6 · Maapohja ja olosuhteet. Järjestys: kaivamattomuus jaetusta, routa jaetusta,
        kohteen oma haaste, talviasennus jaetusta. */
  sect(head(J.h2_speksista.maapohja)+
    "<p>"+T(J.shared_no_digging)+"</p>"+
    "<p>"+T(J.shared_frost_text)+"</p>"+
    "<p>"+T(K.ground.body)+"</p>"+
    "<p>"+T(J.shared_winter_text)+"</p>"+vidlist(slot("ground")),"maapohja")+

  /* 7 · Tarvikkeet. Enintään kolme. Jokainen tuo mukanaan oman videonsa ja mittansa
        tuotedatasta, ei tältä sivulta. */
  sect(head(J.h2_tarvikkeet)+
    '<ul class="uses">'+K.accessories.slice(0,3).map(a=>"<li>"+
      (a.product?'<a href="'+L(a.product[1])+'" data-event="cta_tarvikkeet" data-tarvike="'+
        E(t(a.product[0]))+'">'+T(a.product[0])+"</a> ":"")+
      T(a.reason)+
      (a.product&&a.product[2]?'<ul class="vidlist"><li>'+T("[TÄYTETTÄVÄ]")+
        ' <span class="vt">Asennusvideo: '+T(a.product[0])+"</span></li></ul>":"")+
      "</li>").join("")+"</ul>"+
    vidlist(slot("accessory"))+
    "<p>"+T(J.shared_accessory_note)+"</p>"+
    '<p class="next">'+more(J.tarvikkeet_linkki)+"</p>","tarvikkeet")+

  /* 8 · Näin hinta muodostuu. Ei hintoja eikä lukuja. Kolme osaa: mistä kustannus
        koostuu (jaettu), kohteen vertailu, hinnan kysyminen kauppiaalta (jaettu). */
  sect(head(J.h2_speksista.hinta)+
    "<p>"+T(J.shared_cost_intro)+"</p>"+
    "<p>"+T(K.cost_comparison)+"</p>"+
    "<p>"+T(J.shared_cost_ask)+"</p>","hinta")+

  /* 9 · Luvat ja määräykset, ehdollinen. Ei lakitekstiä, ohjaus kunnan
        rakennusvalvontaan. */
  (K.requires_permit?sect(head(J.h2_speksista.luvat)+
    "<p>"+T(K.permit_body)+"</p>","luvat"):"")+

  /* 10 · Näin pääset alkuun. Kokonaan jaettua. Jälleenmyyjälista tulee yhdestä
         lähteestä (SPEC.dealers, SPECDEALERS). Lopussa tarjouspyyntö, puhelinnumero ja
         vastausaikalupaus: ristiinlinkityssääntö 7. */
  sect(head(J.shared_getting_started.h2)+
    '<ol class="steps">'+J.shared_getting_started.steps.map(s=>
      "<li><b>"+T(s[0]||J.cta_mitoita)+"</b><span>"+T(s[1])+"</span></li>").join("")+"</ol>"+
    '<div class="cta-block">'+mitoita("aloitus")+"</div>"+
    '<div class="buyrow"><h3 class="lbl">'+T(J.shared_getting_started.ostat_h3)+"</h3>"+
      SPECDEALERS(E,{cls:"dealers-4",sijainti:"aloitus"})+"</div>"+
    '<div class="buyrow"><h3 class="lbl">'+T(J.shared_getting_started.iso_h3)+"</h3>"+
      '<p class="fine">'+T(J.shared_phone)+erotin+T(J.shared_response_promise)+"</p>"+
      '<p class="next">'+more(J.tarjous_linkki,"aloitus")+"</p></div>","aloita")+

  /* 11 · Usein kysyttyä. Neljä jaettua ensin, sitten sivukohtaiset. */
  sect(head(J.h2_ukk)+'<div class="faq">'+ukk.map((f,i)=>
    "<details><summary>"+T(f[0])+'<span class="c" aria-hidden="true">▾</span></summary>'+
    '<div class="b"><p>'+T(f[1])+
      (i===J.shared_faq.length-1?" "+more(J.ukk_ostat_linkki,"ukk"):"")+
    "</p></div></details>").join("")+"</div>","ukk")+

  /* 12 · Referenssit. Suodatus object_type-kentällä. Viidellä sivulla kuudesta
         suodatus palauttaa tyhjän, joten varareitti on oletus: kokemuslinkki ja
         asiakaslainaus, ei tyhjää tilaa. */
  sect(head(J.h2_speksista.referenssit)+
    (K.references.length
      ? '<div class="cases cases-3">'+K.references.map(r=>'<div class="case">'+
          '<div class="ph ph-1610">'+T(r.image)+"</div><p>"+T(r.caption)+"</p></div>").join("")+"</div>"
      : '<div class="quote"><div class="ph ph-43">'+T(TB)+"</div>"+
        "<div><blockquote>"+T(J.shared_reference_quote)+"</blockquote>"+
        "<cite>"+T(J.shared_reference_cite)+"</cite></div></div>")+
    vidlist(slot("reference"))+
    '<p class="next">'+more(J.referenssit_linkki)+"</p>","referenssit")+

  /* 13 · Koko videosarja, vain kun videoita on neljä tai enemmän. Arkisto, ei
         ensisijainen tapa löytää jakso. Aiheet näkyvät tekstinä. */
  (K.videos.length>=4?sect(head(J.h2_speksista.videosarja)+
    vidlist(K.videos),"videosarja"):"");

  /* FAQPage-schema, moduuli 11. Vain kysymykset joilla on oikea teksti: merkitty
     kenttä ei kuulu rakenteiseen dataan. */
  const kysymykset=ukk.filter(f=>f[0]&&f[0].indexOf("[")<0&&f[1]&&f[1].indexOf("[")<0);
  if(kysymykset.length){
    const ld=document.createElement("script");
    ld.type="application/ld+json";
    ld.textContent=JSON.stringify({"@context":"https://schema.org","@type":"FAQPage",
      mainEntity:kysymykset.map(f=>({"@type":"Question",name:t(f[0]),
        acceptedAnswer:{"@type":"Answer",text:t(f[1])}}))});
    document.head.appendChild(ld);
  }

  /* Kuusi sivua, yksi tiedosto: sivun omat tapahtumat kantavat kohteen, jotta raportti
     erottaa ne ilman että se nojaa osoitteeseen. Kuoren tapahtumat jäävät ulkopuolelle. */
  [...document.querySelectorAll("#main [data-event]")].forEach(e=>{e.dataset.kohde=K.nimi;});

  /* Harmonikan avaus on mitattava tapahtuma, sama toteutus kuin tarvikesivulla. */
  [...document.querySelectorAll(".faq details")].forEach(function(d){
    d.addEventListener("toggle",function(){
      if(!d.open)return;
      d.dataset.event="avaus_ukk";
      d.dataset.kohde=K.nimi;
      d.dataset.kysymys=d.querySelector("summary").textContent.replace("▾","").trim();
    });
  });
})();
