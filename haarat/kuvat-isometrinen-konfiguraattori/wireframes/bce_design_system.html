<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design system — BCE Pilarimaailma, wireframet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap">
<link rel="stylesheet" href="bce-v4.css">
<script src="bce-spec-shell.js"></script>
<!-- Tuotekuvademo piirretään samasta generaattorista kuin sivujen kuvat:
     katalogi ei näytä kopiota vaan komponentin itsensä. -->
<script src="mittakaavio.js"></script>
<script src="tuotekuva.js"></script>
<script src="palkkikuva.js"></script>
<script src="tarvikekuva.js"></script>
<script src="yhdistelmakuva.js"></script>
<script src="asennuskuva.js"></script>
<script src="tuotevalitsin.js"></script>
<style>
/* Katalogin oma kehys. Nämä eivät kuulu bce-v4.css:ään: ne kuvaavat komponentteja,
   eivät ole komponentteja. Sivu ei ole sivuston sivu vaan suunnittelun työväline. */
.ds-note{background:var(--dark);color:#fff;font-size:14px}
.ds-note .w{padding-top:10px;padding-bottom:10px;display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline}
.ds-note b{font-family:var(--ff-d);text-transform:uppercase;font-size:16px;letter-spacing:.03em}
.ds-note a{color:#e9e7e5}
.ds-toc{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:15px;font-weight:600;margin:0;padding:0;list-style:none}
.ds-toc a{text-decoration:none;border-bottom:2px solid var(--rule-2);padding:10px 0}
.ds-item{padding:34px 0;border-top:1px solid var(--rule)}
.ds-item:first-of-type{border-top:0;padding-top:0}
.ds-meta{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 40px;margin-bottom:22px;align-items:start}
.ds-meta h3{font-size:19px}
.ds-meta code{font-family:ui-monospace,monospace;font-size:13px;background:#fff;border:1px solid var(--rule);border-radius:3px;padding:2px 7px;color:var(--ink)}
.ds-meta .on{font-size:13px;color:var(--ink-3);margin:8px 0 0}
.ds-meta .on span{display:inline-block;border:1px solid var(--rule-2);border-radius:3px;padding:2px 8px;margin:0 4px 4px 0;background:#fff}
.ds-meta p{font-size:15px;color:var(--ink-2);margin:0}
.ds-meta p+p{margin-top:8px}
.ds-meta .merge{color:var(--accent-dark);font-weight:600}
.ds-demo{background:#fff;border:1px solid var(--rule);border-radius:4px;padding:28px}
.ds-demo.paper{background:var(--paper)}
.ds-demo>*+*{margin-top:0}
.ds-row{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.sw div{border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:#fff;font-size:13px}
.sw i{display:block;height:64px}
.sw b{display:block;padding:8px 10px 0;font-family:ui-monospace,monospace;font-weight:600;font-size:13px}
.sw span{display:block;padding:2px 10px 10px;color:var(--ink-2)}
.spec{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 24px;align-items:baseline}
.spec code{font-family:ui-monospace,monospace;font-size:13px;color:var(--ink-3)}
.scale{display:grid;gap:8px}
.scale div{display:grid;grid-template-columns:60px minmax(0,1fr);gap:14px;align-items:center;font-size:13px;color:var(--ink-3)}
.scale i{display:block;height:14px;background:var(--accent-dark);border-radius:2px}
/* Kuvademot: rivi, jossa kuvat seisovat samalla tasolla. Alareunaan tasaus on
   se, mikä tekee yhteisen mittakaavan näkyväksi — keskitettynä matala AP kelluisi
   korkean KP:n puolivälissä ja rivi kertoisi päinvastoin kuin on tarkoitus. */
.ds-kuvarivi{display:flex;flex-wrap:wrap;gap:var(--s5) var(--s6);align-items:flex-end;justify-content:center}
.ds-kuvarivi>div{text-align:center}
.ds-kuvarivi svg{display:block;margin:0 auto;max-width:100%;height:auto}
.ds-kuvarivi b{display:block;font-family:var(--ff-d);text-transform:uppercase;
  font-size:15px;letter-spacing:.03em;margin-top:var(--s2);color:var(--ink-2)}
.ds-mk svg{display:block;margin:0 auto;max-width:100%;height:auto}
.ds-legacy{font-size:13px;color:var(--ink-3);margin:14px 0 0;line-height:1.7}
.ds-legacy code{font-family:ui-monospace,monospace;background:var(--paper-2);padding:1px 6px;border-radius:2px}
.ds-status{font-size:13px;font-weight:600;padding:2px 8px;border-radius:3px;display:inline-block;margin-left:6px}
.ds-status.ok{background:#e4efe4;color:#24532a}.ds-status.todo{background:#f7ead9;color:#7a3a10}.ds-status.dec{background:var(--paper-2);color:var(--ink-2);border:1px solid var(--rule-2)}
/* Tuotantovastine: mikä tästä komponentista tulee WordPressissä. Sarake on
   katalogin ja tuotannon ainoa side — ilman sitä devaaja arvioi työn kuvista. */
.ds-wp{font-size:14px;color:var(--ink-2);margin:12px 0 0;line-height:1.6;
  border-top:1px solid var(--rule);padding-top:12px}
.ds-wp code{font-size:12.5px;padding:1px 5px}
.k{font-family:var(--ff-d);text-transform:uppercase;letter-spacing:.03em;
  font-size:13px;padding:2px 8px;border-radius:3px;margin-right:8px;
  display:inline-block;white-space:nowrap}
.k-core{background:#e4efe4;color:#24532a}
.k-acf{background:#f7ead9;color:#7a3a10}
.k-pattern{background:#e6ecf3;color:#24456d}
.k-teema{background:var(--paper-2);color:var(--ink-2);border:1px solid var(--rule-2)}
.k-ei{background:transparent;color:var(--ink-3);border:1px dashed var(--rule-2)}
.topline p.lede.ds-johdanto{margin:30px 0 0}
.ds-avain{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:10px 26px;margin:18px 0 0;padding:0;list-style:none;font-size:14px;color:var(--ink-2)}
.ds-avain li{line-height:1.6}
@media(max-width:820px){.ds-meta{grid-template-columns:1fr}.ds-demo{padding:18px}}
</style>
</head>
<body>
<a class="skip" href="#main">Siirry sisältöön</a>
<div class="ds-note"><div class="w"><b>Design system, wireframe-taso</b><span>Katalogi siitä mitä <code style="color:#fff">bce-v4.css</code> jo sisältää. Säännöt ja siirtotaulukko: <a href="DESIGN-SYSTEM.md">DESIGN-SYSTEM.md</a>. Kuori ylä- ja alatunnisteena on itse komponentti.</span></div></div>
<div class="urow"><div class="w"></div></div>
<header class="site"><div class="w"></div></header>
<nav class="crumb"><div class="w"></div></nav>
<main id="main"></main>
<footer><div class="w"></div></footer>
<script>
(function(){
"use strict";
const E=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const T=s=>E(s).replace(/\[([^\]]+)\]/g,m=>'<span class="tbd">'+m+"</span>");
SPECSHELL(E,{crumb:[["Etusivu","/"],["Design system",null]]});

/* Sivut, joilla komponentti on käytössä. Lyhenteet toistuvat katalogissa. */
const P={etu:"Etusivu",pil:"Pilarit-hubi",tp:"TP-perhesivu",ak:"Autokatos",jeki:"JeKi-sokkeli",tavat:"Perustustavat",ref:"Referenssi",a:"Tarvikkeet A",b:"Tarvikkeet B",sivu:"Luurankosivu",kuori:"Kuori"};
const on=(...k)=>'<p class="on">'+k.map(x=>"<span>"+E(P[x]||x)+"</span>").join("")+"</p>";
const ph=(t,mod)=>'<span class="ph '+(mod||"ph-43")+'">'+E(t)+"</span>";
const arrow=t=>E(t)+" →";
const st=(k,t)=>'<span class="ds-status '+k+'">'+E(t)+"</span>";

/* Tuotantovastine. Viisi luokkaa, ja jokainen komponentti on tasan yksi niistä:
   core = ydinlohko, acf = ACF Composer -lohko, pattern = lohkomalli ydinlohkoista,
   teema = sivupohja tai teeman asetus, ei = ei siirry tuotantoon.
   Teksti on HTML:ää, koska lohkonimet luetaan koodina. Neljä päätöstä joilla
   luokka valitaan: ydinlohko voittaa aina kun se riittää; oma URL tai suodatus
   tarkoittaa sisältötyyppiä eikä repeateria; selattava arvo on taksonomia eikä
   kenttä; vapaa sisältöalue on NativeBlock, kiinteä rakenne tai kysely on ACF. */
const WPK={core:"core",acf:"ACF",pattern:"Lohkomalli",teema:"Teema",ei:"Ei siirry"};
const wp=(k,t)=>'<p class="ds-wp"><span class="k k-'+k+'">'+E(WPK[k])+"</span>"+t+"</p>";

/* Yksi katalogikohta: nimi, luokka, käyttöpaikat, sääntö, demo. */
function item(o){
  return '<div class="ds-item" id="'+E(o.id)+'"><div class="ds-meta"><div><h3>'+E(o.n)+(o.status?st(o.status[0],o.status[1]):"")+"</h3>"+
    "<p><code>"+E(o.c)+"</code></p>"+(o.on||"")+"</div>"+
    "<div>"+(o.rule?"<p>"+o.rule+"</p>":"")+(o.merge?'<p class="merge">'+o.merge+"</p>":"")+(o.wp||"")+"</div></div>"+
    (o.demo?'<div class="ds-demo'+(o.paper?" paper":"")+(o.stat?" ds-static":"")+'">'+o.demo+"</div>":"")+
    (o.legacy?'<p class="ds-legacy">'+o.legacy+"</p>":"")+"</div>";
}
const sect=(id,h,p,items)=>'<div class="w" id="'+id+'"><section><div class="head"><h2>'+E(h)+"</h2>"+(p?"<p>"+p+"</p>":"")+"</div>"+items.map(item).join("")+"</section></div>";

/* ---- Värit: kontrasti lasketaan renderöidyistä arvoista, ei luvata. ---- */
const hex2=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const lum=([r,g,b])=>{const f=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4)};return .2126*f(r)+.7152*f(g)+.0722*f(b)};
const cr=(a,b)=>{const x=lum(hex2(a)),y=lum(hex2(b));return ((Math.max(x,y)+.05)/(Math.min(x,y)+.05)).toFixed(2)};
const COL=[["--accent","#e25d25","Ensisijainen painike, pilarit piirustuksissa. Ei tekstinä."],
  ["--accent-dark","#b8420f","Oranssi pienessä tekstissä: linkit, numerointi, kuittaus."],
  ["--ink","#252425","Leipäteksti ja otsikot."],["--ink-2","#515151","Ingressit ja selitteet."],
  ["--ink-3","#6f6d6b","Pienet selitteet, kuvapaikat. Heikoin sallittu teksti."],
  ["--dark","#323132","Ylä- ja alatunniste."],["--paper","#faf9f7","Sivun tausta."],
  ["--paper-2","#f2f0ec","Paneelit, kuvapaikat, valittu tila."],
  ["--rule","#e1ded9","Erottimet."],["--rule-2","#cfcac3","Kehykset, katkoviivat."]];
const swatches='<div class="sw">'+COL.map(c=>'<div><i style="background:'+c[1]+'"></i><b>'+E(c[0])+"</b><span>"+E(c[1])+"<br>"+E(c[2])+
  "<br>paperilla "+cr(c[1],"#faf9f7")+":1 · valkoisella "+cr(c[1],"#ffffff")+":1</span></div>").join("")+"</div>";

/* ---- Typografia: koot luetaan laskennasta renderöinnin jälkeen. ---- */
const type='<div class="spec">'+
  '<code>h1</code><h1 data-fs>Valmiit perustuspilarit</h1>'+
  '<code>.hero h1</code><div class="hero" style="display:block;padding:0"><h1 data-fs style="margin:0">Valmiit perustuspilarit</h1></div>'+
  '<code>.hero-spec h1</code><div class="hero-spec"><h1 data-fs style="margin:0">BCE-pilarit — valmis betoniperustus ilman valua</h1></div>'+
  '<code>h2</code><h2 data-fs>Perustus ei ole projektin hitain vaihe</h2>'+
  '<code>.subh</code><p class="subh" data-fs style="margin:0">Terassit, pienmökit ja saunat</p>'+
  '<code>h3</code><h3 data-fs>Pilarikenkä</h3>'+
  '<code>.lede</code><p class="lede" data-fs style="margin:0">Pilarit tulevat tehtaalta valmiiksi valettuina, joten omaa valua ei tarvita.</p>'+
  '<code>body</code><p data-fs style="margin:0">Leipäteksti 17 px, riviväli 1,6, enintään 68 merkkiä rivillä.</p>'+
  '<code>.small (15)</code><p data-fs style="margin:0;font-size:15px;color:var(--ink-2)">Selite kortissa ja listarivillä.</p>'+
  '<code>.fine</code><p class="fine" data-fs style="margin:0">Pieni huomautus taulukon alla.</p>'+
  '<code>.lbl</code><p class="lbl" data-fs style="margin:0">Valitse korkeus</p>'+
  '<code>.btn</code><span class="btn btn-2" data-fs>Painikkeen teksti</span>'+
  "</div>";

const spacing='<div class="scale">'+[["--s1","4"],["--s2","8"],["--s3","12"],["--s4","16"],["--s5","24"],["--s6","32"],["--s7","48"],["--s8","64"]]
  .map(s=>"<div><span>"+s[0]+"</span><i style=\"width:"+(s[1]*4)+"px\"></i></div>").join("")+
  '</div><p class="fine" style="margin-top:16px">Osioiden väli 60 px (mobiili 44), lohkon palstaväli 48 px (hero 56), kortin sisäväli 24 px, listarivin pystyväli 13 px. Rytmi syntyy sisällöstä, ei osioiden eri väleistä: osio on aina 60 px.</p>';

/* Kokovalitsimen demo on elävä: katalogi näyttää komponentin itsensä, ei kuvaa
   siitä. Tekstit ovat samat kuin TP-sivulla. */
const DSVAL={perhe:"TP",id:"ds",otsikko:"Valitse korkeus",tyhjenna:"Kaikki koot",yks:"mm",
  mitat:[["Korkeus","H1"],["Paino","paino"],["Pohjalaatta","D1","nelio"],["Pilarin pää","D2","nelio"]],
  /* Lasketut rivit ensin, sitten sivun omat vakiorivit samaan taulukkoon. */
  lisatiedot:[["Suositeltu enimmäiskuormitus","1 600 kg"],["Kierre","M20-sisäkierre"],["CE-merkintä","Kyllä"]],
  painot:{"TP-200":"43 kg","TP-300":"49 kg","TP-400":"55 kg","TP-500":"61 kg","TP-600":"67 kg"}};

/* ---- Kuvat: viisi generaattoria, yksi kamera ----------------------------
   Demot piirretään samoista tiedostoista kuin sivujen kuvat. Katalogi ei näytä
   kopiota vaan komponentin itsensä — jos mitta muuttuu, tämä sivu muuttuu.
   Kaikki kuvat ovat koristeita (aria-hidden): otsikko ja sääntö kertovat mistä
   on kyse, eikä ruudunlukija toista sitä. */
const kuvaDemo=(function(){
  const TKU=window.tarvikekuva, YKU=window.yhdistelmakuva, KAN=window.tuotekuva.kangas;
  const rivi=(kuvat,tunnukset)=>'<div class="ds-kuvarivi">'+kuvat.map((k,i)=>
    "<div>"+k+"<b>"+E(tunnukset[i])+"</b></div>").join("")+"</div>";

  /* Neljä perhettä yhteen mittakaavaan ja yhdelle kankaalle. */
  const perheet=window.tuotekuva.rivi(window.tuotekuva.perheet,
    {korkeus:200,koriste:true,merkinta:false,id:"dsp"});

  /* Kymmenen tarviketta, yksi mittakaava. Silhuetit ovat 150…371 mm, joten
     pienin ei katoa isoimman viereen. */
  const tavaimet=TKU.osat();
  const tskaala=150/Math.max.apply(null,tavaimet.map(k=>TKU.laajuus(k)));
  const tkuvat=KAN(tavaimet.map(k=>TKU({osa:k,skaala:tskaala,koriste:true,id:"dst-"+k})));

  /* Kolme palkkikokoa. kiintea:true, muuten 48 × 123 näyttää yhtä korkealta
     kuin 48 × 198 ja kuva tekee päinvastoin kuin pitäisi. */
  const pavaimet=window.palkkikuva.koot();
  const pkuvat=KAN(pavaimet.map(k=>window.palkkikuva(
    {koko:k,korkeus:120,kiintea:true,koriste:true,id:"dsb-"+k})));

  return {
    mk:'<div class="ds-mk">'+window.mittakaavio({perhe:"TP",id:"dsmk"})+"</div>",
    pilarit:rivi(perheet.map(o=>o.svg),perheet.map(o=>window.tuotekuva.koodi(o.perhe,o.koko))),
    tarvikkeet:rivi(tkuvat,tavaimet.map(k=>TKU.tieto(k).koodi)),
    palkit:rivi(pkuvat,pavaimet.map(k=>window.palkkikuva.nimi(k))),
    parit:rivi([YKU({pari:"pik-50-70",korkeus:200,koriste:true,id:"dsy1"}),
                YKU({pari:"pak-100x150",korkeus:200,koriste:true,id:"dsy2"}),
                YKU({pari:"tl-150x150",korkeus:200,koriste:true,id:"dsy3"})],
               ["PIK 50-70 + tolppa","PAK-100×150 + palkki","TL 150×150 + lauta"]),
    /* Asennuskuvat yhteiseen mittakaavaan ja yhdelle kankaalle. Tasaus «ala»,
       koska neljällä kuvalla on nyt yhteinen alataso: pilarin rajaus. */
    asennus:(function(){
      const kuvaukset=[{pari:"pik-50-70"},{pari:"pak-100x150"},
                       {pari:"tl-150x150"},{osa:"nostokorva-m20"}];
      const AK=window.asennuskuva;
      const sk=190/Math.max.apply(null,kuvaukset.map(k=>AK.laajuus(k)));
      return rivi(KAN(kuvaukset.map((k,i)=>AK(Object.assign({},k,
               {skaala:sk,koriste:true,id:"dsa"+i}))),"ala"),
        ["PIK 50-70 + tolppa","PAK-100×150 + palkki","TL 150×150 + lauta",
         "Nostokorva M20"]);
    })(),
    /* Oma piirtokutsu eikä sama SVG kahdesti: kuvan sisäiset id:t (rakeisuus,
       valoliuku, varjosuodin) muodostetaan id-etuliitteestä, ja sama kuva kahdesti
       samassa dokumentissa tarkoittaa 14 kaksoiskappaletta — silloin toisen kuvan
       suodin osuu ensimmäiseen. Tämä nähtiin tällä sivulla ennen kuin korjattiin. */
    kortit:'<div class="series series-4" style="max-width:none">'+
      window.tuotekuva.rivi(window.tuotekuva.perheet,
        {korkeus:200,koriste:true,merkinta:false,id:"dsk"})
        .map(o=>'<div class="serie"><div class="im piirros">'+o.svg+
          "</div><h3>"+E(o.perhe)+"-pilari</h3></div>").join("")+"</div>"
  };
})();

document.getElementById("main").innerHTML=
'<div class="w"><section class="topline" style="padding-bottom:20px"><h1>Design system</h1>'+
  '<p class="lede">Yksi CSS, yksi kuori, kanoninen nimi jokaiselle tehtävälle. Tämä sivu renderöi komponentit samasta <code>bce-v4.css</code>-tiedostosta kuin sivut, joten se ei voi valehdella niistä.</p>'+
  '<ul class="ds-toc"><li><a href="#tokenit">Tokenit</a></li><li><a href="#primitiivit">Primitiivit</a></li><li><a href="#layout">Layout</a></li><li><a href="#karki">Sivun kärki</a></li><li><a href="#kortit">Kortit ja ruudukot</a></li><li><a href="#rivit">Rivilistat</a></li><li><a href="#data">Taulukot ja tiedot</a></li><li><a href="#kuvat">Kuvat</a></li><li><a href="#toiminnot">Valitsimet ja toiminnot</a></li><li><a href="#kuori">Kuori</a></li></ul>'+
  '<p class="lede ds-johdanto" style="font-size:17px">Jokaisella komponentilla on <strong>tuotantovastine</strong>: mikä siitä tulee WordPressissä. Se on katalogin ja toteutuksen ainoa side — ilman sitä työ arvioidaan kuvista, ja lohkoja syntyy 56 siellä missä 14 riittää. Sama sarake on <a href="DESIGN-SYSTEM.md">DESIGN-SYSTEM.md</a>:n luvussa 3.</p>'+
  '<ul class="ds-avain">'+
    '<li><span class="k k-core">core</span>Ydinlohko sellaisenaan. Ei ylläpidettävää, ei dokumentoitavaa.</li>'+
    '<li><span class="k k-acf">ACF</span>ACF Composer -lohko: kiinteä rakenne, kysely tai tuotedata.</li>'+
    '<li><span class="k k-pattern">Lohkomalli</span>Ydinlohkoja yhdessä. Synkronoitu, jos sisällön on pysyttävä samana.</li>'+
    '<li><span class="k k-teema">Teema</span>Sivupohja tai teeman asetus, ei toimittajan valinta.</li>'+
    '<li><span class="k k-ei">Ei siirry</span>Suunnitteluväline. Merkinnät, paikanpitäjät, modifierit.</li>'+
  "</ul>"+
  '<p class="fine" style="margin:18px 0 0">Kaksi avointa kysymystä, jotka on ratkaistava ennen toteutusta. <strong>1 · Tarvikedata: repeater vai sisältötyyppi?</strong> Kahdeksan nimikettä ovat yhdellä sivulla ilman omia URLeja, mutta samaa dataa tarvitaan laskurissa, referenssin <code>tarvikkeet</code>-relaatiossa ja ohjeen <code>kaytetyt_tuotteet</code>-relaatiossa. Suositus: piilotettu sisältötyyppi (<code>public=false</code>, <code>show_in_rest=true</code>), koska relaatiokenttä tarvitsee kohteen. Repeaterina sama data syötetään kolmesti. <strong>2 · Piirretyt tuotekuvat: SVG-tiedosto vai generaattori?</strong> Staattiset kuvat voi viedä mediakirjastoon, mutta TP-perhesivun kokovalitsin morffaa kuvaa valinnan mukaan — se on JS-riippuvuus lohkossa, ei kuva. Suositus: mediakirjasto kaikelle paitsi kokovalitsimelle ja mittakaaviolle.</p>'+
"</section></div>"+

sect("tokenit","Tokenit","Arvot ovat <code>:root</code>-lohkossa. Uusi sääntö valitsee arvon asteikolta; vanhat pikseliarvot siirretään lohko kerrallaan.",[

sect("kuvat","Kuvat","Viisi generaattoria ja yksi kamera: <code>tuotekuva.projektio</code> (CX 0,866 · CY 0,42). Pilari, tarvike, palkki ja niiden yhdistelmät ovat väistämättä samassa kulmassa, koska kukaan ei määrittele omaa. Valo on eri materiaaleille eri, ja se on tarkoitus. Demot piirtyvät samoista tiedostoista kuin sivujen kuvat. Käyttöönotto-ohje on <a href=\'TUOTEKUVAT.md\'>TUOTEKUVAT.md</a>, työlista puuttuvista <a href=\'SVG-INVENTAARIO.md\'>SVG-INVENTAARIO.md</a>.",[
  {id:"mk",wp:wp("acf","<code>bce/mittakaavio</code> tai esirenderöity SVG mediakirjastoon. Ks. avoin kysymys 2."),n:"Mittakaavio",c:".mk svg · .mitoitus .mk (mittakaavio.js)",on:on("tp"),
   rule:"Selite taulukolle, ei kuvituskuva: kirjaimet kaaviossa, luvut viereisessä taulukossa. Piirretään DOMiin <code>window.mittakaavio({perhe:\"TP\"})</code>-kutsulla, jotta merkinnät saavat sivun Oswaldin. Leveys enintään 620 px, kangas mitoitettu perheen suurimman koon mukaan (<code>kiintea</code>), joten valinta ei muuta piirroksen eikä tekstin kokoa.",
   merge:"Vain TP, AP ja KP. PP puuttuu tarkoituksella: sen pää on 45 mm:n holkki eikä M20-kierre, ja se tarvitsee oman piirroksen — ks. SVG-INVENTAARIO kohta 5.",
   demo:kuvaDemo.mk,paper:true},
  {id:"tuotekuva",wp:wp("acf","Staattisena SVG mediakirjastoon ja <code>core/image</code>. Morffaava versio vaatii lohkon ja JS:n. Ks. avoin kysymys 2."),n:"Tuotekuva: pilari",c:"tuotekuva({perhe,koko,korkeus,kiintea,koriste,id}) · .perhe() · .rivi() · .morffi()",on:on("pil","tp"),status:["ok","18.9."],
   rule:"Tehtävä on <strong>muistijälki muodosta</strong>, ei mitoitus: ei mittaviivoja eikä kirjaimia. Mitat luetaan <code>mittakaavio.js</code>:n <code>PERHEET</code>-taulukosta, joten toista totuutta ei ole. Projektio on aksonometrinen (pystymitat 1:1), joten saman perheen koot ovat vertailukelpoisia. Betonipinnat <code>--bet-*</code>; särmä <code>--bet-viiva</code>, ei <code>--ink</code>, koska musta viiva tekisi kuvasta sarjakuvan.",
   merge:"Neljä perhettä on tässä samassa mittakaavassa (<code>tuotekuva.rivi</code>): AP-400 ei saa näyttää KP-1000:n kokoiselta, koska perhe valitaan koon mukaan.",
   demo:kuvaDemo.pilarit,paper:true},
  {id:"tarvikekuva",wp:wp("acf","Sama ratkaisu kuin pilarikuvalla. Nämä ovat staattisia, joten mediakirjasto riittää."),n:"Tarvikekuva",c:"tarvikekuva({osa,korkeus,skaala,koriste,id}) · .osat() · .tieto() · .laajuus()",on:on("a"),status:["ok","18.9."],
   rule:"Kymmenen nimikettä. Kamera luetaan <code>tuotekuva.projektio</code>-oliosta, mutta <strong>valo on eri ja se on tarkoitus</strong>: betoni luetaan pehmeistä sävyeroista, kuumasinkitty teräs kovista heijastuksista — neliportainen cel-varjostus ja kiiltojuova särmän vieressä. Sävy lasketaan <strong>pinnan normaalista</strong> eikä anneta parametrina, joten ohutlevyn jokainen taite erottuu itsestään. Teräkset <code>--met-*</code>.",
   merge:"Ei <code>kiintea</code>-valitsinta, koska perheitä ei ole: yhteinen mittakaava tehdään <code>laajuus()</code>-suhteella. Varjo ei ole oletus — tarvike ei seiso maassa vaan kiertyy pilarin päähän, joten kontaktivarjo väittäisi alustaa jota ei ole.",
   demo:kuvaDemo.tarvikkeet,paper:true},
  {id:"palkkikuva",wp:wp("ei","Ei millään sivulla. Laskurin kuva, ei sivuston — ei siirry teemaan."),n:"Palkkikuva",c:"palkkikuva({koko,korkeus,kiintea,syyt,oksat,koriste,id}) · .rivi() · .koot()",on:"",status:["todo","ei vielä sivulla"],
   rule:"Laskurin kolme palkkikokoa. Oma generaattori eikä <code>tuotekuva.js</code>:n perhe — puu ei ole betonia — mutta sama projektio, koska palkki ja pilari näkyvät samassa laskurissa. <strong>Mitat luetaan kokotunnuksesta</strong> («48x148» <em>on</em> mitat), joten toista kopiota luvuista ei ole. Puu <code>--puu-*</code>.",
   merge:"Paikka on laskurin kysymys K5, ja se on muutos toimivaan käyttöliittymään: esitetään ennen toteutusta. Tuotesivuille näitä ei laiteta — BCE myy pilareita, ei sahatavaraa, ja tuotesivulla palkki väittäisi kuuluvansa toimitukseen.",
   demo:kuvaDemo.palkit,paper:true},
  {id:"yhdistelma",wp:wp("acf","Renderöityy <code>bce/tarvikesuodattimen</code> sisällä, ei omana lohkonaan."),n:"Yhdistelmäkuva",c:"yhdistelmakuva({pari,korkeus,skaala,rajahdys,koriste,id}) · .parit()",on:on("a"),status:["ok","18.9."],
   rule:"Tarvike ja siihen kuuluva puu samassa kuvassa: vastaa kysymykseen <strong>miten päin puu menee kiinni</strong>. Ei piirrä itse mitään vaan asettaa kaksi generaattoria samaan kankaaseen. Piirtojärjestys ratkaistaan koukulla (<code>C.puu()</code>), koska puu on tarvikkeen <em>sisällä</em> eikä kutsuja voi päätellä sitä. Puun paikka lasketaan <code>tarvikekuva.tieto()</code>:n mitoista.",
   merge:"Kuusi paria, kaikki käytössä. <strong>P-PIK 50×70:n ristiriita ratkesi 21.9.2026</strong>: copy sanoo piilokiinnike ja geometria panee levyn tolpan kylkeen — piiloon jäävät kiinnikkeet eikä levy, koska naulattava puoli on vain yksi. Teräslaatta on ainoa pari räjäytettynä — paikalleen laskettuna lauta peittää koko tarvikkeen.",
   demo:kuvaDemo.parit,paper:true},
  {id:"asennus",wp:wp("acf","Sama ratkaisu kuin tuotekuvalla. Ks. avoin kysymys 2."),n:"Asennuskuva",c:"asennuskuva({pari|osa,perhe,koko,nakyva}) · .laajuus() · .oletus()",on:on("tp"),status:["ok","20.9."],
   rule:"Pilarin pää, siihen kierretty tarvike ja siihen tuleva puu. Vastaa kysymykseen <strong>mihin osa kiinnittyy</strong> — tarvikekuva kertoo miltä osa näyttää, yhdistelmäkuva miten päin puu menee siihen. Kuvaus on sama olio kuin lohkon riveillä (<code>{pari:…}</code> tai <code>{osa:…}</code>), joten sivulla vaihtuu generaattorin nimi eikä datamalli. Kosketustaso tulee osalta (<code>tarvikekuva.tieto().pilariZ</code>), ja kierretappi jää pilarin sisään <code>piilotaso</code>-parametrilla: maalarin algoritmi ei sitä hoida, koska tappi on kameraan päin pilarin yläpinnasta katsottuna.",
   merge:"<strong>Pilarista näkyy vain pää, ja rajaus tehdään kankaasta eikä geometriasta.</strong> Koko pilari piirretään ja viewBox jättää alaosan näkymättä, joten pää on oikean pilarin pää eikä lyhennetty tynkä. Kokonainen TP-400 pohjalaattoineen veisi kuvan leveyden ja kenkä olisi rivin kuvapaikassa parinkymmenen pikselin kokoinen. Säätömutteri jää yhä piiloon: kamera on yhteinen kaikille generaattoreille, joten matalampi kulma olisi toinen kamera samalla sivulla.",
   demo:kuvaDemo.asennus,paper:true},
  {id:"tk",wp:wp("ei","Modifier, ei lohko: kertoo että paikassa on aito kuva eikä paikanpitäjä. Tuotannossa tätä eroa ei ole."),n:"Piirretty kuva kuvapaikassa",c:".ph.piirros · .im.piirros · .thumbs button.piirros · .pick-how .ph.piirros",on:on("pil","a"),status:["ok","lisätty 18.9."],
   rule:"Modifier sanoo, että paikassa on aito kuva eikä paikanpitäjää: katkoviiva, <code>--paper-2</code>-täyttö ja keskitys pois. Kuva on läpinäkyvä, joten levy sen alla lupaisi taustan jota kuvassa ei ole. Ei koske kuvasuhdetta — kortin ruudukko pysyy samana, vaikka sisältö vaihtuu.",
   merge:"Saman lohkon kuvat saavat saman mittakaavan ja <strong>saman kankaan</strong> (<code>tuotekuva.rivi</code> pilareille, <code>tuotekuva.kangas</code> mille tahansa generaattorille). Eri kokoisilla kankailla CSS skaalaa jokaisen omalla kertoimellaan heti kun laatikko on kuvaa kapeampi — mittakaava olisi oikein vain työpöydällä. Nimi ei ole <code>.tk</code>, koska <code>.tcard .tk</code> on tarvikesivun tuotekoodi.",
   demo:kuvaDemo.kortit,paper:true}
])+

/* Typografian koot luetaan laskennasta, ei luvata. */
document.querySelectorAll("[data-fs]").forEach(el=>{const cs=getComputedStyle(el);
  const tag=document.createElement("span");tag.className="fine";tag.style.cssText="display:block;margin:4px 0 0;font-size:12px";
  tag.textContent=Math.round(parseFloat(cs.fontSize))+" px · "+cs.fontWeight+" · "+cs.fontFamily.split(",")[0].replace(/"/g,"")+(cs.textTransform==="uppercase"?" · versaali":"");
  /* Suoraan .spec-ruudukossa oleva näyte kääritään, jottei kokorivi lisää ruudukkoon
     ylimääräistä solua ja riko koodi–näyte-vuorottelua. */
  if(el.parentElement.classList.contains("spec")){const w=document.createElement("div");el.replaceWith(w);w.appendChild(el);w.appendChild(tag)}
  else el.insertAdjacentElement("afterend",tag)});

/* Kuittaavan painikkeen demo toimii, jotta kuittaus näkyy eikä sitä tarvitse kuvitella. */
const say=document.createElement("p");say.className="sr";say.setAttribute("role","status");say.setAttribute("aria-live","polite");document.body.appendChild(say);
document.querySelectorAll(".cp").forEach(b=>b.addEventListener("click",function(){
  const t=b.textContent;const ok=()=>{b.textContent="Kopioitu";b.setAttribute("data-copied","true");say.textContent="Kopioitu";setTimeout(()=>{b.textContent=t;b.removeAttribute("data-copied")},2200)};
  const fail=()=>{b.textContent="Kopiointi ei onnistunut";b.setAttribute("data-failed","true");say.textContent=b.textContent;setTimeout(()=>{b.textContent=t;b.removeAttribute("data-failed")},2600)};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText("TP-400 125/450  6430000000400").then(ok,fail);else fail();}));
window.tuotevalitsin.kiinnita(document.querySelector(".ds-demo .mitoitus"),DSVAL);
document.querySelectorAll(".sizes button,.thumbs button").forEach(b=>b.addEventListener("click",function(){
  [...b.parentElement.children].forEach(x=>x.setAttribute("aria-pressed",String(x===b&&x.getAttribute("aria-pressed")!=="true")))}));
})();
