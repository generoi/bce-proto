<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiinnitystarvikkeet — versio B, sama tuotelohko kuin perhesivulla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap">
<link rel="stylesheet" href="bce-v4.css">
<script src="bce-spec-shell.js"></script>
</head>
<body>
<a class="skip" href="#main">Siirry sisältöön</a>
<div class="urow"><div class="w"></div></div>
<header class="site"><div class="w"></div></header>
<nav class="crumb"><div class="w"></div></nav>
<main id="main"></main>
<footer><div class="w"></div></footer>
<script>
/* Tarvikesivu /pilarien-kiinnitystarvikkeet/ — VERSIO B, 15.9.2026.

   Rinnakkainen ehdotus tiedostolle bce_tarvikkeet_spec.html. Ero on periaatteessa,
   ei yksityiskohdissa:

   B lähtee siitä, että tuoteperhesivu ja tarvikesivu käyttävät SAMAA tuotelohkoa.
   Kävijän ei kuulu opetella kahta kuviota. Lohkon kentät ja järjestys ovat samat
   kuin TP-sivun ostolaatikossa — kuva, nimi, mihin sopii, koot, tuotekoodi ja EAN —
   ja ero on tiheydessä: perhesivulla lohko on ensimmäinen ruutu, täällä sama lohko
   toistuu kahdeksan kertaa tiiviinä. Kokovalinta on lohkossa silloin kun tuotteella
   on kokoja (PAK) ja jää pois kun ei ole. Tämä on verkkokaupan varianttivalitsimen
   logiikka.

   Osiot on nimetty niin, että ne vastaavat perhesivun osioita yksi yhteen:
     Sopii näihin kohteisiin   ↔  Mihin pilariin tämä sopii
     TP-pilarin koot           ↔  Koot ja kierteet
     Tähän sopivat tarvikkeet  ↔  Tähän sopivat pilariperheet
     Tekniset tiedot           ↔  Tekniset tiedot
     Montako tarvitset         ↔  Montako tarvitset
     Osta jälleenmyyjältä      ↔  Osta jälleenmyyjältä

   Kahdeksan tarviketta ovat yhdellä sivulla ankkureina, eivät omilla URLeillaan
   (päätös 15.9.2026): pilarikenkä on 81 % koko tarvikekysynnästä (3 930 näyttöä),
   nostokorvalla on 3 näyttöä 12 kuukaudessa. Siksi kärjessä on hakemisto.

   CTA-hierarkia kortin 4 mukaan: 1) Mistä ostat, 2) Mitoita perustus. Jälleenmyyjät
   ovat siksi sivutasolla eivätkä jokaisessa lohkossa — kahdeksan kertaa neljä
   painiketta olisi 32 painiketta.

   Tuotenimet, koodit ja kuvaustekstit luettu nykysivustolta 15.9.2026.
   Yhteensopivuus on pilari–tarvike-matriisista (docs/pilari-tarvike-matriisi.md):
   AP, TP ja KP jakavat M20-kierteen, PP on eri kiinnitys. EAN-koodit ovat
   paikanpitäjiä kuten perhesivulla. */
const C={
  crumb:[["Etusivu","/"],["Tarvikkeet",null]],
  chains:["Hartman","K-Rauta","Soraterminaali","Stark"],

  hero:{h1:"Pilarien kiinnitystarvikkeet",
    lede:"Tarvike ratkaisee, miten rakenne kiinnittyy perustukseen. Kaikki tarvikkeet ruuvataan pilarin valmiiseen M20-kierteeseen, joten työmaalla ei porata, ja säätövara korjaa pienet heitot korkeus- ja sivusuunnassa.",
    cta:["Mistä ostat","/mista-ostat/","cta_mista_ostat","hero"],
    cta2:["Laske pilarien määrä","/konfiguraattori/","cta_konfiguraattori"],
    idx:"Kahdeksan tarviketta"},

  /* Valintalogiikka ennen tuotteita. Jako on liitostyypin mukaan, koska kävijä
     tietää mitä hän kiinnittää — ei sitä, minkä niminen osa siihen tarvitaan. */
  how:{h2:"Miten valitset oikean tarvikkeen",
    ing:"Valinta seuraa sitä, miten rakenne liittyy pilariin.",
    rows:[
      ["Pystyrakenne pilarin päälle","Pilarikenkä","Lankku tai tolppa kiinnittyy pilarin päähän. Koko valitaan puutavaran leveyden mukaan.","#pilarikengat"],
      ["Vaakapalkki pilarin kylkeen","Palkkikenkä","Kannatinpalkki ripustetaan pilarin kylkeen.","#palkkikengat"],
      ["Tasainen alusta rakenteelle","Teräslaatta","Valmis rakenne asennetaan suoraan laatan päälle.","#teraslaatat"],
      ["Pilarin siirtäminen","Nostokorva","Ei rakenteen osa vaan asennuksen apuväline.","#nostokorva"]]},

  groups:[
    {id:"pilarikengat", h2:"Pilarikengät", ing:"Pystyrakenne kiinnittyy pilarin päähän. Korkeutta säädetään kiertämällä, ja jälkisäätö onnistuu asennuksen jälkeenkin.",
     items:[
      ["Pieni pilarikenkä PIK 50-70","Detaljikuva: PIK 50-70 pilarin päässä, lankku kiinni",
       "Yhdelle 50–70 mm:n lankulle, esimerkiksi terassin runkoon. Kierretapin uran ansiosta jälkisäätö on vaivatonta.",
       "AP · TP · KP","PIK 50-70","6430000001070"],
      ["Pilarikenkä PIK 90-140","Detaljikuva: PIK 90-140 ja kannatintolppa",
       "90–140 mm:n tolpille, esimerkiksi katoksen kannatintolpat. Pyöreä laatta tekee jälkisäädöstä helppoa.",
       "AP · TP · KP","PIK 90-140","6430000001090"],
      ["Pieni L-mallinen pilarikenkä P-PIK 50×70","Detaljikuva: P-PIK piilokiinnikkeenä",
       "Puolikas pilarikenkä 50–70 mm:n lankuille. Piilokiinnike silloin kun kiinnikkeitä ei haluta näkyviin.",
       "AP · TP · KP","P-PIK 50×70","6430000001050"]]},
    {id:"palkkikengat", h2:"Palkkikengät", ing:"Vaakasuuntainen kannatinpalkki ripustetaan pilarin kylkeen. Jos korkeussäätöä tarvitaan, palkkikengän alapohja täytetään.",
     items:[
      ["Palkkikenkä PAK","Detaljikuva: palkkikenkä pilarin kyljessä, vaakapalkki kiinni",
       "Välipohjan ja rungon kannatinpalkeille, jotka kiinnitetään pilariin tai seinään.",
       "AP · TP · KP","PAK","6430000002100",
       [["PAK-100×150","100 × 150 mm"],["PAK-100×200","100 × 200 mm"]]]]},
    {id:"teraslaatat", h2:"Teräslaatat", ing:"Laatta kierretään kohtisuoraan pilarin kierteeseen, ja valmis rakenne asennetaan suoraan sen päälle. Ero on kiinnityspisteissä.",
     items:[
      ["Teräslaatta TL 100×100×6","Detaljikuva: TL 100×100 pilarin päällä",
       "Kaksi reikää vastakkaisissa nurkissa. Pienin laatoista.",
       "AP · TP · KP","TL 100×100×6 M20×50","6430000003100"],
      ["Teräslaatta TL 150×150×8","Detaljikuva: TL 150×150 pilarin päällä",
       "9 mm:n reiät jokaisessa neljässä kulmassa. Paksuin laatoista.",
       "AP · TP · KP","TL 150×150×8 M20×50","6430000003150"],
      ["Teräslaatta TL 100×175×6","Detaljikuva: TL 100×175, kiinnityspisteet pilarin ulkopuolella",
       "Kiinnityspisteet ulottuvat pilarin kärjen ulkopuolelle, joten laatan voi kiinnittää alapuolelta myös jälkikäteen.",
       "AP · TP · KP","TL 100×175×6 M20×50","6430000003175"]]},
    {id:"nostokorva", h2:"Nostokorva", ing:"Asennuksen apuväline, ei rakenteen osa.",
     items:[
      ["Nostokorva M20","Detaljikuva: nostokorva kiinnitettynä, tanko läpi",
       "Ruuvataan pilarin kierteeseen. Nostokorvan läpi viedään tanko, jolloin kaksi ihmistä saa pilarin paikalleen.",
       "AP · TP · KP","Nostokorva M20","6430000004020"]]}],

  part:{fit:"Sopii pilariin", ean:"EAN",
    copy:"Kopioi", copied:"Kopioitu", failed:"Kopiointi ei onnistunut",
    size:"Valitse koko"},

  /* Kaksisuuntainen linkitys, jota kortti 4 vaatii. Sama tieto on perhesivulla
     toisin päin. Sisältö on pilari–tarvike-matriisista. */
  fit:{h2:"Mihin pilariin tarvike sopii",
    ing:"Sama M20-kierre on AP-, TP- ja KP-pilareissa, joten tarvike valitaan rakenteen mukaan eikä pilariperheen mukaan.",
    rows:[["AP-pilari","Kaikki tarvikkeet","/bce-pilarit/ap-pilari/","AP"],
      ["TP-pilari","Kaikki tarvikkeet","/bce-pilarit/tp-pilari/","TP"],
      ["KP-pilari","Kaikki tarvikkeet","/bce-pilarit/kp-pilari/","KP"],
      /* PP-600:n kiinnitys on 82 mm kiristysrengas 60 mm putkelle, ei M20-kierre. */
      ["PP-pilari","Eri kiinnitys, ks. tuotesivu","/bce-pilarit/pp-pilari/","PP"]],
    fine:"Kuormankantokyky riippuu myös siitä, mitä rakennetaan. Suurissa kuormissa yhdistelmä tarkistetaan rakennesuunnittelijalla."},

  tech:{h2:"Tekniset tiedot",
    rows:[["Kierre","M20"],["Kiinnityssyvyys","Vähintään 25 mm"],
      ["Materiaali","[TÄYTETTÄVÄ]"],["Pintakäsittely","[TÄYTETTÄVÄ]"],
      ["CE-merkintä","[TÄYTETTÄVÄ]"],["Yhteensopivuus","AP, TP ja KP"]],
    dh3:"Ladattavat",
    docs:[["Tarvikkeiden mitat","PDF","lataus_dokumentti","[TÄYTETTÄVÄ]"],
      ["Asennusperiaate A-601","PDF · FI, SV, EN","lataus_dokumentti",null],
      ["Tuote-esite","PDF","lataus_dokumentti","[TÄYTETTÄVÄ]"]]},

  cfg:{h2:"Montako tarviketta tarvitset?",
    ing:"Konfiguraattori laskee pilarien lisäksi tarvikkeet kappalemäärineen. Tarvike määräytyy siitä, missä kohtaa ruudukkoa pilari on — kulmassa, reunalla vai keskellä.",
    img:"kuvat/konfiguraattori-isometric-c.png",
    alt:"Isometrinen havainnekuva: terassi kohotettuna pilarien yläpuolelle, kulmapilarit korostettuina.",
    cta:"Laske pilarien määrä",
    sub:"Kestää muutaman minuutin."},

  buy:{h2:"Osta lähimmältä jälleenmyyjältä",
    ing:"Tarvikkeet myydään samoissa rautakaupoissa kuin pilarit. Ota tuotekoodit mukaan — niillä myyjä löytää oikean osan.",
    all:"Kaikki jälleenmyyjät ja verkkokaupat"},

  big:{h2:"Isompi kohde tai kysyttävää?",
    p:"Suuremmat tilaukset ja projektikohteet hoituvat suoraan meidän kauttamme. Vastaamme tarjouspyyntöön tunnin sisällä.",
    cta:"Pyydä tarjous", sub:"[TÄYTETTÄVÄ]"}
};

(function(){
  "use strict";
  const E=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const T=s=>E(s).replace(/\[([^\]]+)\]/g,m=>'<span class="tbd">'+m+"</span>");
  const L=u=>E(SPECLINK(u));
  SPECSHELL(E,{crumb:C.crumb,active:"Tarvikkeet"});
  const sect=(inner,id)=>'<div class="w"'+(id?' id="'+id+'"':"")+"><section>"+inner+"</section></div>";
  const head=(h,p)=>'<div class="head"><h2>'+E(h)+"</h2>"+(p?"<p>"+T(p)+"</p>":"")+"</div>";
  const arrow=t=>E(t)+" →";
  const down=t=>E(t)+" ↓";
  const DLIC='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+
    '<path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>';
  const kaikki=C.groups.reduce((a,g)=>a.concat(g.items.map(i=>[i[0],g.id])),[]);

  document.getElementById("main").innerHTML=

  /* 1 · Kärki ja hakemisto */
  '<div class="w"><section class="lead">'+
    "<div><h1>"+E(C.hero.h1)+'</h1><p class="lede">'+E(C.hero.lede)+"</p>"+
      '<div class="cta"><a class="btn btn-1" href="'+L(C.hero.cta[1])+'" data-event="'+
        E(C.hero.cta[2])+'" data-sijainti="'+E(C.hero.cta[3])+'">'+E(C.hero.cta[0])+"</a>"+
        '<a class="more" href="'+L(C.hero.cta2[1])+'" data-event="'+E(C.hero.cta2[2])+
        '" data-sijainti="hero">'+arrow(C.hero.cta2[0])+"</a></div></div>"+
    '<nav class="idx" aria-label="'+E(C.hero.idx)+'"><p class="lbl">'+E(C.hero.idx)+"</p>"+
      kaikki.map(k=>'<a href="#'+E(k[1])+'" data-event="cta_tarvike_ankkuri" data-tarvike="'+
        E(k[0])+'">'+down(k[0])+"</a>").join("")+"</nav></section></div>"+

  /* 2 · Valinta liitostyypin mukaan */
  sect(head(C.how.h2,C.how.ing)+
    '<div class="pick-how">'+C.how.rows.map(r=>'<a href="'+E(r[3])+'" data-event="valinta_liitostyyppi" '+
      'data-liitos="'+E(r[1])+'"><b>'+E(r[0])+'</b><span class="nm">'+E(r[1])+"</span>"+
      "<span>"+E(r[2])+"</span></a>").join("")+"</div>")+

  /* 3 · Kahdeksan tuotelohkoa neljässä ryhmässä — sama lohko kuin perhesivulla */
  C.groups.map(g=>sect(head(g.h2,g.ing)+
    '<div class="plots">'+g.items.map(it=>'<article class="plot">'+
      '<div class="im">'+E(it[1])+"</div>"+
      "<div><h3>"+E(it[0])+"</h3><p>"+E(it[2])+"</p>"+
        '<p class="fit"><span>'+E(C.part.fit)+"</span> <b>"+T(it[3])+"</b></p>"+
        (it[6]?'<div class="sizes sizes-s" role="group" aria-label="'+E(C.part.size)+'">'+
          it[6].map(v=>'<button type="button" aria-pressed="false" data-koodi="'+E(v[0])+
            '"><b>'+E(v[0])+"</b><span>"+E(v[1])+"</span></button>").join("")+"</div>":"")+
      "</div>"+
      '<div class="sku"><span class="k">'+E(it[4])+"</span>"+
        '<span class="e">'+E(C.part.ean)+" "+E(it[5])+"</span>"+
        '<button class="cp" type="button" data-event="kopioi_koodit" data-koodi="'+E(it[4])+
        '" data-ean="'+E(it[5])+'">'+E(C.part.copy)+"</button></div>"+
      "</article>").join("")+"</div>",g.id)).join("")+

  /* 4 · Kaksisuuntainen linkitys pilariperheisiin */
  sect(head(C.fit.h2,C.fit.ing)+
    '<dl class="spec2">'+C.fit.rows.map(r=>"<div><dt>"+E(r[0])+"</dt>"+
      '<dd>'+T(r[1])+'<a class="more lk" href="'+L(r[2])+'" data-event="cta_pilariperhe" '+
      'data-perhe="'+E(r[3])+'">'+arrow("Katso "+r[3])+"</a></dd></div>").join("")+"</dl>"+
    '<p class="fine tech-note">'+E(C.fit.fine)+"</p>")+

  /* 5 · Tekniset tiedot ja lataukset — sama kolmen kaistan rakenne kuin perhesivulla */
  sect(head(C.tech.h2)+
    '<dl class="spec2">'+C.tech.rows.map(r=>"<div><dt>"+E(r[0])+"</dt><dd>"+T(r[1])+"</dd></div>").join("")+"</dl>"+
    '<h3 class="sh">'+E(C.tech.dh3)+"</h3>"+
    '<div class="dl">'+C.tech.docs.map(d=>'<a href="'+L("/ohjeet/suunnittelijalle/")+
      '" data-event="'+E(d[2])+'" data-tiedosto="'+E(d[0])+'"><span class="ty">'+DLIC+E(d[1])+
      "</span><b>"+E(d[0])+"</b>"+(d[3]?'<span class="st">'+T(d[3])+"</span>":"")+
      "</a>").join("")+"</div>")+

  /* 6 · Konfiguraattori */
  sect('<div class="cfg"><div>'+head(C.cfg.h2,C.cfg.ing)+
    '<p class="act"><a class="btn btn-1" href="'+L("/konfiguraattori/")+'" data-event="cta_konfiguraattori" data-sijainti="lopetus">'+
    E(C.cfg.cta)+'</a><span class="sub">'+E(C.cfg.sub)+"</span></p></div>"+
    '<img class="shot" src="'+E(C.cfg.img)+'" alt="'+E(C.cfg.alt)+'" width="2400" height="1800" loading="lazy" decoding="async">'+
    "</div>","mitoita")+

  /* 7 · Mistä ostat — kortin 4 ensisijainen toiminto */
  sect(head(C.buy.h2,C.buy.ing)+
    '<div class="dealers dealers-4">'+C.chains.map(c=>'<a href="#" data-event="klikkaus_jalleenmyyja" '+
      'data-dealer="'+E(c)+'" data-sijainti="lopetus">'+E(c)+"</a>").join("")+"</div>"+
    '<p class="next"><a class="more" href="'+L("/mista-ostat/")+
      '" data-event="cta_mista_ostat" data-sijainti="lopetus">'+arrow(C.buy.all)+"</a></p>","ostat")+

  sect('<div class="band"><div><h2>'+E(C.big.h2)+"</h2><p>"+E(C.big.p)+"</p></div>"+
    '<div><a class="btn btn-1" href="'+L("/yhteystiedot/tarjouspyynto/")+'" data-event="cta_yhteydenotto">'+
    E(C.big.cta)+"</a>"+'<p class="sub">'+T(C.big.sub)+"</p></div></div>","yhteys");

  /* Kuittaukset ja kopiointi: sama toteutus kuin perhesivulla. */
  const say=document.createElement("p");
  say.className="sr";say.setAttribute("role","status");say.setAttribute("aria-live","polite");
  document.body.appendChild(say);
  function kopioi(btn,teksti,kuittaus){
    const vanha=btn.textContent;
    function ok(){btn.textContent=C.part.copied;btn.setAttribute("data-copied","true");
      say.textContent=kuittaus;
      setTimeout(function(){btn.textContent=vanha;btn.removeAttribute("data-copied");},2200);}
    function fail(){btn.textContent=C.part.failed;btn.setAttribute("data-failed","true");
      say.textContent=C.part.failed;
      setTimeout(function(){btn.textContent=vanha;btn.removeAttribute("data-failed");},2600);}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(teksti).then(ok,fail);
    } else { fail(); }
  }
  [...document.querySelectorAll(".plot .cp")].forEach(function(b){
    b.addEventListener("click",function(){
      kopioi(b,b.dataset.koodi+"  "+b.dataset.ean,C.part.copied+": "+b.dataset.koodi);
    });
  });

  /* Kokovalinta vaihtaa tuotekoodin samassa lohkossa. Ei esivalintaa, ei vieritystä. */
  [...document.querySelectorAll(".plot")].forEach(function(lohko){
    const napit=[...lohko.querySelectorAll(".sizes button")];
    if(!napit.length)return;
    const k=lohko.querySelector(".sku .k"), cp=lohko.querySelector(".sku .cp");
    const perus=k.textContent;
    napit.forEach(function(b){
      b.addEventListener("click",function(){
        const oli=b.getAttribute("aria-pressed")==="true";
        napit.forEach(x=>x.setAttribute("aria-pressed","false"));
        if(oli){k.textContent=perus;cp.dataset.koodi=perus;return;}
        b.setAttribute("aria-pressed","true");
        k.textContent=b.dataset.koodi;cp.dataset.koodi=b.dataset.koodi;
      });
    });
  });
})();
</script>
</body>
</html>
