<script>
/* Tuotesivu /jeki-sokkeli/. Copy asiakkaalta 17.9.2026.

   Sivun paikka rakenteessa. Sokkeleilla ei ole koontisivua eikä /sokkelit/-polkua:
   JeKi on ainoa tuote ja osoite pysyy ennallaan, koska kysyntä on brändättyä ja
   tarkkaa ("jeki sokkeli" CTR 57,1 %, pelkkä "sokkeli" 0,1 %). Sivukartan luku 0.1.
   Valikossa "Sokkelit" on ryhmäotsikko ilman URLia, joten murupolussa ei ole
   välitasoa: Etusivu › JeKi-sokkeli.

   Sivutyyppikortti. Lähin kortti on 3 (pilarimallisivu): tuote, jolle kerrotaan mihin
   se riittää, mitkä tarvikkeet kuuluvat mukaan ja mistä sen saa. Kortin CTA-hierarkia
   on 1) mitoitus 2) mistä ostat 3) mitoitusarvot — mutta mitoitus tarkoittaa siellä
   konfiguraattoria, ja konfiguraattori laskee pilarien määrän, ei sokkelielementtejä.
   Siksi tämän sivun mitoituspyyntö on yhteydenotto, kuten asiakkaan copy sen kirjoittaa
   ("Kysy mitoitus kohteeseesi"). Konfiguraattorilohkoa ei tälle sivulle tule; se
   lupaisi laskurin, joka ei tunne tätä tuotetta.

   Kolme poikkeamaa asiakkaan copysta, jokainen näkyvissä ja peruttavissa:

   1) HERON PAINIKKEET. Copy antaa kaksi rinnakkaista painiketta, "Katso soveltuuko
      kohteeseesi" ja "Mistä ostat". Kaksi samannäköistä painiketta vierekkäin on
      kirjattu virhe, jota ei toisteta (CLAUDE.md), ja auditin P0 on nimenomaan oranssi
      painike joka vierittää sivua sen sijaan että lataisi sivun. Siksi ensisijainen
      painike on "Mistä ostat" (lataa /mista-ostat/, sama toiminto kuin sivun
      alapalkissa) ja soveltuvuus on sen vieressä tekstilinkkinä ankkuriin #sopiiko.
      Molemmat copyn tekstit ovat tallella, vain painoarvo eroaa.

   2) LOPETUKSEN ENSISIJAINEN. Copyn lopetuksessa järjestys on [Ota yhteyttä]
      [Mistä ostat], ja se on pidetty: siinä kohdassa lukija on jo vakuuttunut ja
      seuraava askel on kysyä mitoitus. Lopetuksen oranssi painike on siis "Ota
      yhteyttä" ja "Mistä ostat" on sen alla tekstilinkkinä. Yhdessä näkymässä on
      yhä yksi oranssi painike.

   3) LOHKON 7 TOISTO. Copy luettelee kohdetyypit kahdesti: lohkossa 5 ("Valitse JeKi,
      kun haluat umpinaisen alareunan: omakoti- ja paritalot, huvilat ja mökit,
      autokatokset") ja lohkossa 7 samoilla sanoilla. Lohkosta 7 on jätetty pois vain
      tuo toistuva virke; sen toinen virke on tallella, koska se sanoo jotain uutta.
      Poistettu virke kokonaisuudessaan: "Omakoti- ja paritalot, huvilat ja mökit,
      autokatokset."

   Jälleenmyyjälohkoa ei ole. Muilla sivuilla neljän ketjun rivi renderöidään
   SPECDEALERS-funktiolla, mutta sen osoitteet ovat BCE:n brändisivuja, jotka on
   tarkistettu pilarituotteille. JeKin saatavuutta ei ole tarkistettu: neljästä ketjusta
   vain K-Raudan brändisivu mainitsee JeKin, eikä sielläkään tuotesivuna (tarkistettu
   17.9.2026). Aito ostolinkki tuotteeseen, jota ei ehkä myydä siellä, on pahempi kuin
   ei linkkiä, joten sivu ohjaa /mista-ostat/-sivulle. Kun saatavuus on varmistettu,
   lohko on yksi rivi: SPECDEALERS(E,{cls:"dealers-4",sijainti:"lopetus"}).

   "Isompi kohde tai kysyttävää?" -lohkoa (.band) ei ole, koska sivun oma lopetus on jo
   yhteydenotto samaan osoitteeseen. Kaksi yhteydenottoa kahdella nimellä samalla
   sivulla olisi juuri se virhe, joka on kirjattu toistamatta jätettäväksi.

   Mitä puuttuu, merkittynä sivulle: asennuksen kaksi ensimmäistä askelta, tekniset
   tiedot kokonaisuudessaan, talviasennuksen vahvistus, kolmen kohdekuvan kuvatekstit
   ja referenssi. Näitä ei arvata. */
const C={
  crumb:[["Etusivu","/"],["JeKi-sokkeli",null]],
  url:{ostat:"/mista-ostat/", yhteys:"/yhteystiedot/tarjouspyynto/",
       pilarit:"/bce-pilarit/", asennus:"/ohjeet/asennus/",
       suunnittelija:"/ohjeet/suunnittelijalle/", referenssit:"/referenssit/"},

  /* 1 · Hero. H1 on hakusana sellaisenaan: brändätty kysyntä on tämän sivun koko
     liikenne. Ingressi on kortin 3 vaatima kuvaava selite mallitunnuksen rinnalla. */
  hero:{h1:"JeKi-sokkeli",
    lede:"Valmis elementtisokkeli, joka sulkee rakennuksen alareunan ilman valua. Asennus valmistuu samana päivänä, eikä työmaalla tarvita saumavalua eikä hitsausta.",
    cta1:["Mistä ostat","/mista-ostat/","cta_mista_ostat"],
    cta2:["Katso soveltuuko kohteeseesi","#sopiiko","cta_soveltuvuus_ankkuri"],
    img:"Hero-kuva: valmis rakennus JeKi-sokkelilla, umpinainen alareuna maanpinnan tasolla"},

  /* 2 · Mikä sokkeli on. Ensimmäinen lohko vastaa kysymykseen, jota tuote ei itse
     esitä: tarvitsenko tällaista lainkaan.

     Pelkkää tekstiä, ei kuvaa. Ensimmäinen versio oli mediapari (.side), jolloin sivun
     kaksi ensimmäistä lohkoa olivat sama leiska peräkkäin: teksti vasemmalla, iso
     kuvapaikka oikealla, kaksi laatikkoa allekkain samassa palstassa. Avoimen ja
     suljetun alareunan vertailukuva siirtyi lohkoon 5, jossa se on itse asia eikä
     kuvitus — ja sinne se meni kahtena kuvana, yksi kummallekin haaralle. Leipäteksti
     on luettavan levyinen ilman omaa luokkaa: p on 68ch globaalisti. */
  what:{h2:"Mikä sokkeli on ja miksi sellainen tarvitaan",
    ps:["Pilariperustus nostaa rakennuksen irti maasta. Rakennuksen alle jää avointa tilaa, ja monissa kohteissa se on hyvä asia: ilma kiertää ja rakenne pysyy kuivana.",
        "Kaikkiin kohteisiin avointa reunaa ei kuitenkaan haluta. Sokkeli on umpinainen alareuna, joka sulkee rakennuksen ja maan välisen tilan. Se estää tuulen, lumen ja eläinten pääsyn alle ja viimeistelee rakennuksen ulkonäön.",
        "Perinteisesti sokkeli valetaan paikalla tai muurataan harkoista. JeKi on sama asia valmiina betonielementteinä."]},

  /* 3 · Miksi elementtisokkeli. Kuusi väitettä, jokainen vertaa valuun. Kolme
     saraketta eikä neljä, jotta kuusi korttia jakautuu kahdelle täydelle riville.
     Ikonit ovat rakennetta, eivät tekstiä. */
  why:{h2:"Miksi elementtisokkeli eikä valettu",
    claims:[
      ["Valmis samana päivänä","Elementit nostetaan paikalleen ja liitetään toisiinsa mekaanisesti. Betonin kuivumista ei odoteta."],
      ["Ei valukalustoa","Muotteja, sekoitusta ja kuljetuksia ei tarvita. Sama kalusto, jota käyttäisit kerran kymmenessä vuodessa, jää hankkimatta."],
      ["Vapaasti seisova","JeKi ei tarvitse erillistä tukirakennetta, joten perustustyö ei monimutkaistu."],
      ["Sää ei siirrä työtä","Asennus onnistuu myös kylmällä ja märällä."],
      ["Purettavissa ja siirrettävissä","Mekaaninen liitos avataan, ja elementit voidaan käyttää uudelleen. Rakennus voi muuttaa mukana."],
      ["Ennustettava lopputulos","Mitat ovat tehtaalla tehdyt. Epäonnistunutta valua ei tule."]]},

  /* 4 · Asennus. Neljä askelta kuvineen, sama lohko kuin käyttökohdesivulla.
     Askelten 1 ja 2 tekstit puuttuvat copysta; ne on merkitty eikä täytetty. */
  build:{h2:"Näin JeKi asennetaan",
    steps:[
      {h:"Valmistele pohja", p:"[TÄYTETTÄVÄ: pohjan valmistelu, murskepeti, routasyvyys]",
       img:"Kuva: valmisteltu pohja, murskepeti tasattuna"},
      {h:"Nosta elementit paikalleen", p:"[TÄYTETTÄVÄ: nostotapa ja tarvittava kalusto]",
       img:"Kuva: elementti nostetaan paikalleen"},
      {h:"Liitä elementit toisiinsa", p:"Liitos on mekaaninen. Liitostarvikkeet tulevat toimituksen mukana, joten erillisiä hankintoja ei tarvita. Työmaalla ei valeta saumoja eikä hitsata.",
       img:"Detaljikuva: kahden elementin mekaaninen liitos ja liitostarvike"},
      {h:"Jatka runkoon", p:"Sokkeli on valmis heti. Rakennustyö jatkuu samana päivänä.",
       img:"Kuva: runkotyö jatkuu valmiin sokkelin päältä"}],
    ohje:["Lataa asennusohje","/ohjeet/asennus/","cta_asennusohjeet"],
    /* Sama kuin käyttökohdesivulla: videolle ei ole omaa osoitetta sivukartassa,
       joten linkki osoittaa asennusohjeen ankkuriin. Ankkuri on tehtävä kun
       /ohjeet/asennus/ suunnitellaan. */
    video:["Katso asennusvideo","/ohjeet/asennus/#video","cta_asennusvideo"]},

  /* 5 · Pilarit vai JeKi. Sivun ainoa vertailu ja heron tekstilinkin kohde.
     Ei taulukkoa: yksi kontrasti riittää tällä tasolla (periaate 3, "näytä, älä
     taulukoi"). Toinen haara luovuttaa pilarisivuille, toinen on tämä sivu. */
  vs:{h2:"Pilarit vai JeKi",
    ing:"Molemmat ovat perustusratkaisuja samoihin kohteisiin, mutta ne tuottavat erilaisen lopputuloksen.",
    items:[
      ["Valitse pilarit","kun rakennuksen alle saa jäädä avointa tilaa. Tämä on tavallista terasseissa, pienissä piharakennuksissa, saunoissa ja mökeissä.",
       ["Katso pilariperheet","/bce-pilarit/","cta_tuotteet"],
       "Kuva: rakennuksen alareuna pilariperustuksella, avointa tilaa rakennuksen alla"],
      ["Valitse JeKi","kun haluat umpinaisen alareunan: omakoti- ja paritalot, huvilat ja mökit, autokatokset.",null,
       "Kuva: sama rakennus JeKi-sokkelilla, umpinainen alareuna maahan asti"]],
    note:"Kumpikaan ei ole toistaan vahvempi. Ero on siinä, jääkö reuna auki vai kiinni."},

  /* 6 · Tekniset tiedot. Copy antaa kentät mutta ei arvoja. Kentät on kirjoitettu
     riveiksi eikä yhdeksi merkinnäksi, jotta asiakas näkee mitä täsmälleen kysytään
     ja voi täyttää rivin kerrallaan. Sama leiska kuin perhe- ja tarvikesivulla. */
  tech:{h2:"Tekniset tiedot",
    rows:[["Elementin mitat","[TÄYTETTÄVÄ]"],["Korkeudet","[TÄYTETTÄVÄ]"],
      ["Paino","[TÄYTETTÄVÄ]"],["Kantavuus","[TÄYTETTÄVÄ]"],
      ["Pintakäsittelyvaihtoehdot","[TÄYTETTÄVÄ]"],["CE-merkintä","[TÄYTETTÄVÄ]"],
      ["Suoritustasoilmoitus","[TÄYTETTÄVÄ]"]],
    img:"Detaljikuva: elementin päätyleikkaus, liitoksen rakenne näkyvissä",
    dl:["Lataa mitoitusarvot ja DWG-tiedostot","/ohjeet/suunnittelijalle/","cta_dwg"]},

  /* 7 · Mihin JeKi sopii. Kuvat tekevät työn, teksti ei toista lohkon 5 luetteloa
     (ks. poikkeama 3 tiedoston alussa). Kuvateksti kertoo kohteen ja käytetyn
     korkeuden — sitä ei ole missään lähteessä, joten se on merkitty. */
  fits:{h2:"Mihin JeKi sopii",
    ing:"Kohteet, joissa rakennus halutaan näyttämään perustetulta eikä pilarien päällä seisovalta.",
    items:[
      ["Kuva: omakotitalo JeKi-sokkelilla, koko julkisivu","[TÄYTETTÄVÄ]"],
      ["Kuva: huvila tai mökki, sama kuvakulma","[TÄYTETTÄVÄ]"],
      ["Kuva: autokatos, sama kuvakulma","[TÄYTETTÄVÄ]"]]},

  /* 8 · Näin pääset alkuun. Sivun lopetus on polku tilaukseen, ei lomake sinänsä:
     askel 1 on mitoituspyyntö, koska konfiguraattori ei laske sokkelia. */
  start:{h2:"Näin pääset alkuun",
    steps:[
      ["Kysy mitoitus kohteeseesi","Kerro rakennuksen mitat ja pohjan muoto, niin saat elementtimäärän ja tarvikkeet."],
      ["Ota lista mukaan","Listassa ovat tuotekoodit, joilla tuotteet löytyvät suoraan."],
      ["Osta rautakaupasta","BCE-tuotteet myydään rautakauppojen kautta. Hinnat saat kauppiaalta. Jos tilauksesi on iso, kauppias hoitaa toimituksen suoraan tehtaalta."]],
    cta1:["Ota yhteyttä","/yhteystiedot/tarjouspyynto/","cta_yhteydenotto"],
    cta2:["Mistä ostat","/mista-ostat/","cta_mista_ostat"]},

  /* 9 · UKK. Kuusi kysymystä hakijan sanoin. Mikään ei ole valmiiksi auki, ja avaus
     on mitattava tapahtuma (avaus_ukk). Hintavastaus ei anna lukua vaan kertoo mistä
     hinta muodostuu — kortin 8 sivua ei ole vielä olemassa, joten linkkiä ei ole. */
  faq:{h2:"Usein kysyttyä",
    items:[
      ["Mikä sokkeli on?","Sokkeli on rakennuksen ja maan välinen umpinainen alareuna. Se estää tuulen, lumen ja eläinten pääsyn rakennuksen alle ja viimeistelee ulkonäön."],
      ["Mitä elementtisokkeli maksaa?","Hinnan saat rautakaupasta. Kokonaishintaan vaikuttavat rakennuksen koko ja muoto, elementtien korkeus sekä tarvittavien tarvikkeiden määrä. Vertailu valettuun sokkeliin kannattaa tehdä kokonaiskustannuksena, koska valussa hintaan tulee myös kalusto, työaika ja kuivumisen odottaminen."],
      ["Tarvitseeko JeKi erillisen tukirakenteen?","Ei tarvitse. JeKi on vapaasti seisova elementtisokkeli."],
      ["Voiko sokkelin asentaa talvella?","[TÄYTETTÄVÄ: vahvistus BCE:ltä]"],
      ["Voiko JeKi-sokkelin purkaa myöhemmin?","Voi. Liitos on mekaaninen, joten elementit voidaan irrottaa ja käyttää uudelleen."],
      ["Sopiiko JeKi omakotitaloon?","Sopii. Omakoti- ja paritalot ovat JeKin yleisin käyttökohde."]]},

  /* 10 · Referenssit. Sääntö: jokaisella tuotesivulla vähintään yksi nimetty kohde.
     JeKi-referenssiä ei ole missään lähteessä, joten sitaattia ei keksitä. */
  ref:{h2:"Referenssit",
    img:"Kuva: JeKi-referenssikohde, valmis rakennus",
    quote:"[TÄYTETTÄVÄ: vähintään yksi nimetty JeKi-kohde]", cite:"[TÄYTETTÄVÄ]",
    cta:["Lue asiakkaiden kokemuksia","/referenssit/","cta_referenssit"]}
};

(function(){
  "use strict";
  const E=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const T=s=>E(s).replace(/\[([^\]]+)\]/g,m=>'<span class="tbd">'+m+"</span>");
  const L=u=>E(SPECLINK(u));
  /* Alapalkin pari on sivukohtainen: konfiguraattori ei laske sokkelielementtejä,
     joten kuoren oletuspari (Laske pilarien määrä + Mistä ostat) lupaisi tällä
     sivulla toiminnon, jota ei ole. Pari on sama kuin sivun omat toiminnot. */
  SPECSHELL(E,{crumb:C.crumb,active:"JeKi-sokkeli",
    bar:[C.start.cta2,C.start.cta1]});
  const sect=(inner,id)=>'<div class="w"'+(id?' id="'+id+'"':"")+"><section>"+inner+"</section></div>";
  const head=(h,p)=>'<div class="head"><h2>'+E(h)+"</h2>"+(p?"<p>"+T(p)+"</p>":"")+"</div>";
  const arrow=t=>E(t)+" →";
  const btn=(l,sij)=>'<a class="btn btn-1" href="'+L(l[1])+'" data-event="'+E(l[2])+'"'+
    (sij?' data-sijainti="'+E(sij)+'"':"")+">"+E(l[0])+"</a>";
  const more=(l,sij)=>'<a class="more" href="'+L(l[1])+'" data-event="'+E(l[2])+'"'+
    (sij?' data-sijainti="'+E(sij)+'"':"")+">"+arrow(l[0])+"</a>";

  /* Ikonit ovat rakennetta, eivät tekstisisältöä: ei sanoja, ei käännettävää.
     Järjestys seuraa C.why.claims-taulukkoa. Kolme ensimmäistä ovat etusivulta
     (kello, ei-merkki, sadepilvi), kolme muuta ovat konventioita samalla viivalla:
     elementti maanpinnalla, kiertonuolet, ruksi ruudussa.

     "Vapaasti seisova" testattiin neljällä ehdokkaalla 110 px ja 34 px rinnakkain.
     Jaettu laatikko luettiin ikkunaksi ja jalallinen versio nimenomaan
     tukirakenteeksi eli päinvastoin kuin väite sanoo. Voittaja on umpinainen
     elementti maanviivan päällä: viiva on elementtiä leveämpi, jolloin se luetaan
     maaksi eikä alustaksi. */
  const ICON=[
    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M6 18 18 6"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M2 20h20"/><rect x="6" y="6" width="12" height="11" rx="1"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M7 14a4 4 0 0 1 .4-7.9 5 5 0 0 1 9.5 1.2A3.4 3.4 0 0 1 17 14z"/><path d="M8 18l-1 3"/><path d="M12 18l-1 3"/><path d="M16 18l-1 3"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15"/><path d="M4 20v-5h5"/></svg>',
    '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12.5l3 3 5-6"/></svg>'];

  document.getElementById("main").innerHTML=

  /* 1 · Hero. Yksi oranssi painike, soveltuvuus tekstilinkkinä ankkuriin. */
  '<div class="w"><section class="hero">'+
    "<div><h1>"+E(C.hero.h1)+'</h1><p class="lede">'+E(C.hero.lede)+"</p>"+
      '<div class="cta">'+btn(C.hero.cta1,"hero")+
        '<a class="more" href="'+E(C.hero.cta2[1])+'" data-event="'+E(C.hero.cta2[2])+
        '">'+arrow(C.hero.cta2[0])+"</a></div></div>"+
    '<div class="hero-img">'+E(C.hero.img)+"</div></section></div>"+

  /* 2 · Mikä sokkeli on — pelkkä teksti, jotta heron leiska ei toistu heti perässä */
  sect(head(C.what.h2)+C.what.ps.map(p=>"<p>"+E(p)+"</p>").join(""),"sokkeli")+

  /* 3 · Miksi elementtisokkeli — kuusi väitettä kolmessa sarakkeessa */
  sect(head(C.why.h2)+'<div class="claims claims-3">'+
    C.why.claims.map((c,i)=>'<div class="claim"><div class="ic" aria-hidden="true">'+ICON[i]+
      "</div><h3>"+E(c[0])+"</h3><p>"+E(c[1])+"</p></div>").join("")+"</div>","miksi")+

  /* 4 · Asennus — .flow, neljä askelta kuvineen */
  sect(head(C.build.h2)+'<div class="flow">'+
    C.build.steps.map((s,i)=>'<div class="st"><div class="ph ph-1610">'+E(s.img)+"</div>"+
      '<div class="tx"><span class="n" aria-hidden="true">'+(i+1)+"</span><b>"+E(s.h)+"</b>"+
      "<p>"+T(s.p)+"</p></div></div>").join("")+"</div>"+
    '<p class="next">'+more(C.build.ohje)+'<span aria-hidden="true"> · </span>'+
    more(C.build.video)+"</p>","asennus")+

  /* 5 · Pilarit vai JeKi — kaksi haaraa kuvineen, heron tekstilinkin kohde.
     Kuvat ovat tässä sivun ainoa vertailu: avoin reuna vasemmalla, suljettu oikealla. */
  sect(head(C.vs.h2,C.vs.ing)+'<div class="alt alt-2">'+
    C.vs.items.map(x=>'<div><div class="ph ph-1610">'+E(x[3])+"</div><h3>"+E(x[0])+"</h3><p>"+E(x[1])+"</p>"+
      (x[2]?more(x[2]):"")+"</div>").join("")+"</div>"+
    '<p class="next">'+E(C.vs.note)+"</p>","sopiiko")+

  /* 6 · Tekniset tiedot — arvoparit ja detaljikuva rinnakkain, lataus alle */
  sect(head(C.tech.h2)+
    '<div class="techrow"><div>'+
    '<dl class="spec2">'+C.tech.rows.map(r=>"<div><dt>"+E(r[0])+"</dt><dd>"+T(r[1])+
      "</dd></div>").join("")+"</dl></div>"+
    '<div class="ph tekninen">'+E(C.tech.img)+"</div></div>"+
    '<p class="next">'+more(C.tech.dl)+"</p>","tekniset")+

  /* 7 · Mihin JeKi sopii — kolme kohdekuvaa */
  sect(head(C.fits.h2,C.fits.ing)+
    '<div class="cases cases-3">'+C.fits.items.map(f=>'<div class="case">'+
      '<div class="ph ph-1610">'+E(f[0])+"</div><p>"+T(f[1])+"</p></div>").join("")+"</div>","kohteet")+

  /* 8 · Näin pääset alkuun — sivun lopetustoiminto */
  sect(head(C.start.h2)+
    '<ol class="steps">'+C.start.steps.map(s=>"<li><b>"+E(s[0])+"</b><span>"+E(s[1])+
      "</span></li>").join("")+"</ol>"+
    '<div class="cta-block">'+btn(C.start.cta1,"lopetus")+
      '<p class="next">'+more(C.start.cta2,"lopetus")+"</p></div>","aloita")+

  /* 9 · Usein kysyttyä */
  sect(head(C.faq.h2)+'<div class="faq">'+C.faq.items.map(f=>
    "<details><summary>"+E(f[0])+'<span class="c" aria-hidden="true">▾</span></summary>'+
    '<div class="b"><p>'+T(f[1])+"</p></div></details>").join("")+"</div>","ukk")+

  /* 10 · Referenssit — sama .quote kuin perhe- ja käyttökohdesivulla */
  sect(head(C.ref.h2)+
    '<div class="quote"><div class="ph ph-43">'+E(C.ref.img)+"</div>"+
    "<div><blockquote>"+T(C.ref.quote)+"</blockquote>"+
    "<cite>"+T(C.ref.cite)+"</cite>"+
    '<p class="next">'+more(C.ref.cta)+"</p></div></div>","referenssit");

  /* Harmonikan avaus on mitattava tapahtuma, sama toteutus kuin muilla sivuilla. */
  [...document.querySelectorAll(".faq details")].forEach(function(d){
    d.addEventListener("toggle",function(){
      if(!d.open)return;
      d.dataset.event="avaus_ukk";
      d.dataset.kysymys=d.querySelector("summary").textContent.replace("▾","").trim();
    });
  });
})();
</script>
</body>
</html>
