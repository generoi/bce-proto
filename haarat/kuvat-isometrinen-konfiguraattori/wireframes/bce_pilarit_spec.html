<script>
/* Koontisivu /bce-pilarit/, speksi 1.0. Sivun tehtävä: muuttaa kategoriahaku
   valinnaksi. Ei tuoteluettelo, eikä etusivun toisinto.

   16.9.2026, auditin P1: sivu toisti etusivun neljä lohkoa sanasta sanaan (.claims,
   .cases, JeKi-.side, .img-band) ja oli 657 sanaa etusivun 665:tä vastaan. Kävijä, joka
   klikkasi Pilarit, luki saman sivun eri otsikolla. Ne poistettiin. Jäljelle jäi se, mitä
   vain tällä sivulla on: käyttökohteet, neljä perhettä, tuotekoodihaku, tarvikkeet,
   konfiguraattori, jälleenmyyjät, isompi kohde. JeKi tavoitetaan navigaatiosta ja
   alatunnisteesta; miksi pilari eikä valu on etusivun ja käyttökohdesivun asia. */
const C={
  /* Sivukartta 17.9.2026: /bce-pilarit/ on kanoninen Pilarit-sivu. Se on
     Tuotteet-pudotuksen ensimmäinen ryhmä yhdessä tarvikkeiden ja sokkelien
     kanssa — /tuotteet/-välisivua ei ole, ryhmällä ei ole omaa URLia. JeKi
     tavoitetaan nyt myös valikosta, ja tämän sivun JeKi-lohko jää rinnalle.
     Linkeissä on tuotanto-URL, kuten etusivulla. Tarvike- ja referenssikohtaisia
     slugeja ei ole (/tarvikkeet/{tuote}/, /referenssit/{kohde}/), joten ne osoittavat
     toistaiseksi hubiin. */
  crumb:[["Etusivu","bce_etusivu_spec.html"],["Pilarit",null]],
  url:{konf:"/konfiguraattori/", kayttokohteet:"/pilariperustus/",
       tarvikkeet:"/pilarien-kiinnitystarvikkeet/", jeki:"/jeki-sokkeli/",
       referenssit:"/referenssit/", ostat:"/mista-ostat/",
       tarjous:"/yhteystiedot/tarjouspyynto/"},

  /* Jälleenmyyjät tulevat kuoresta (SPEC.dealers, SPECDEALERS). */

  /* 1 · Hero. Ensimmäinen lause määrittelee tuotteen, koska kategoriahakija
     ei välttämättä tiedä mikä perustuspilari on. Kolme reittiä kolmelle tulijalle. */
  hero:{h1:"BCE-pilarit — valmis betoniperustus ilman valua",
    lede:"Perustuspilari on valmiiksi valettu betonielementti. Se lasketaan sorapatjan päälle ja kantaa terassin, saunan, autokatoksen tai mökin ilman että työmaalla valetaan mitään. Neljä perhettä, 16 kokoa.",
    /* 16.9.2026: painike lataa konfiguraattorin kuten muilla sivuilla. Aiemmin se oli
       ankkuri #loyda, eli oranssi nappi vieritti toiseen oranssiin nappiin. */
    cta1:["Laske pilarien määrä","/konfiguraattori/","cta_konfiguraattori","hero"],
    /* 23.9.2026: molemmat toissijaiset ankkurit poistettiin, ja hero-oppi
       (PRODUCT.md kohta 2) sallii yhden. Kumpikin lupasi matkan sinne, minne sivu
       jo vie: perhelohko on järjestyksen vaihdon jälkeen heti heron alla, ja
       koodihaku nousi Ollin pyynnöstä sen yläpuolelle, eli molemmat kohteet ovat
       ensimmäisen vierityksen sisällä. Heroon jää yksi painike.
       Tapahtumat `cta_vertailu_ankkuri` ja `cta_koodihaku_ankkuri` katoavat;
       kumpaakaan ei ollut mittausdokumenteissa. */
    img:"Hero-kuva: pilari asennettuna käyttöyhteydessä"},

  /* 2 · Neljä perhettä heti heron alla. Etusivun .serie-kortti kuvineen, sama copy, laajennettuna
     PP:llä. Kantavuusarvot ovat perhesivuilla — niitä ei ole tällä tasolla.

     Rivin kolmas kenttä oli kuvapaikan teksti ("Kuva: AP-pilari"); 18.9.2026 se on
     perheen tunnus, jolla tuotekuva.js piirtää kortin kuvan. Etusivun sama lohko on
     yhä paikanpitäjillä: kortit ovat tarkoituksella merkki merkiltä samat, ja
     etusivu on hyväksytty 7.9.2026, joten muutos esitetään asiakkaalle eikä tehdä
     itsestään (TUOTEKUVAT.md luku 3, kohta 2). Näkyvä copy ei muuttunut. */
  fam:{h2:"Neljä pilariperhettä",
    ing:"Perhe valitaan sen mukaan mitä rakennat ja kuinka iso siitä tulee.",
    series:[
      /* AP:lle ohjataan /uusi-pienempi-pilari/ 301:llä */
      ["AP-pilari — kevyet piharakenteet","Matalat terassit, huussit ja pienet piharakennukset. Kevyin mallisto: yhden ihmisen työ alusta loppuun.","AP","Katso AP","/bce-pilarit/ap-pilari/"],
      ["TP-pilari — terassit ja pienet rakennukset","Terassit, pienmökit ja pihasaunat. Yleisin valinta tee-se-itse-kohteisiin.","TP","Katso TP","/bce-pilarit/tp-pilari/"],
      ["KP-pilari — kantavat rakennukset","Autokatokset, kesämökit ja isommat piharakennukset. Kun rakennuksen päällä on katto, lunta ja tuulta.","KP","Katso KP","/bce-pilarit/kp-pilari/"],
      ["PP-pilari — pylvään ja tolpan jalusta","Ei rakennuksen perustus. Jalusta yksittäiselle pylväälle tai tolpalle: lipputanko, pihavalaisin, aitatolppa.","PP","Katso PP","/bce-pilarit/pp-pilari/"]],
    cta:"Laske pilarien määrä",
    sub:"Vastaat muutamaan kysymykseen kohteestasi. Saat listan pilareista ja tarvikkeista.",
    /* Kantavuusarvot ovat perhesivuilla. Nykysivustolla AP on newtoneina ja TP
       sekä KP kiloina samalla sivulla; yksikkö on päätettävä ennen toteutusta. */
    },

  /* 4 · Käyttökohteet perheiden jälkeen. 22.9.2026: perheet nostettiin heron alle,
     joten tämä on toinen reitti samaan valintaan — sille joka tietää mitä rakentaa
     mutta ei mikä pilari siihen kuuluu. Etusivun käyttökohdevalitsin sellaisenaan. */
  use:{h2:"Mihin pilariperustusta käytetään",
    ing:"Helpoin tapa valita on aloittaa siitä mitä rakennat.",
    picks:[["Terassi","/kayttokohde/terassin-pilariperustus/"],
      ["Autokatos","/kayttokohde/autokatoksen-pilariperustukset/"],
      ["Sauna","/kayttokohde/saunan-pilariperustus/"],
      ["Mökki","/kayttokohde/mokkien-pilariperustukset/"],
      ["Piharakennus","/kayttokohde/piharakennuksen-pilariperustus/"],
      ["Parakki","/kayttokohde/parakkien-pilariperustukset/"]]},

  /* 2 · Tuotekoodihaku. Nostettu 23.9.2026 Ollin pyynnöstä perhekorttien yläpuolelle
     ja omaksi lohkokseen: se on oikotie sille, joka tietää jo mitä hakee, eikä
     oikotie kuulu sen jälkeen, mitä se ohittaa.

     Haku toimii nyt oikeasti. Auditin 16.9.2026 havainto oli «kaksi hakukenttää,
     kumpikaan ei toimi»: urakoitsija kirjoitti KP-900 ja sai tyhjän. `[TÄYTETTÄVÄ]`
     kentän alta poistettiin samalla — se lupasi koodilistan, ja koodilista on nyt
     haussa eikä tekstinä. EAN-koodit ovat tarvikesivulla; ne tulevat tähän vasta
     jos jälleenmyyjäosio toteutetaan. */
  find:{h3:"Etsi tuotekoodilla",
    p:"Tunnistatko tuotteen pakkauksesta tai jälleenmyyjän tiskiltä? Syötä koodi, niin näytämme oikean sivun.",
    ph:"Syötä tuotekoodi, esim. KP-900", cta:"Etsi",
    vihje:"Haku tuntee 16 pilarikoodia ja 9 tarvikekoodia.",
    tyhja:"Syötä tuotekoodi, esimerkiksi KP-900 tai PIK 50-70.",
    eiloydy:"ei ole tuntemamme koodi. Tarkista kirjoitusasu tai valitse perhe alta.",
    perhe:"pilariperheen sivu", tarvike:"kiinnitystarvikkeet"},

  /* 5 · Tarvikkeet. Jokaisesta on kerrottava mitä se tekee ja missä yhteydessä —
     nimilista ei kerro kumpaakaan, ja tarvikkeiden jääminen tilaamatta on yleisin
     virhe.

     23.9.2026: neljä tyhjää kenttää täytetty. Auditin havainto oli, että 3/4
     kontekstiriviä on tyhjä ja teräslaatan tehtävä `[TÄYTETTÄVÄ]`, vaikka lohkon
     koko peruste on kertoa mitä tarvike tekee. Tekstejä ei kirjoitettu tähän
     uusiksi eikä arvattu: **jokainen on lyhennys tarvikesivun omasta tekstistä**,
     joka taas on peräisin asiakkaan esitteestä 2023 (`../aineisto-taustamatskut-2026-09-18.md`
     luku 3). Hubi on tarvikesivun kärki, ei toinen lähde — jos tarvikesivun teksti
     muuttuu, tämä muuttuu sen mukana (`../jaettu-sisalto.md`).

     PAK:n tehtäväteksti on tarkoituksella yleinen («liittää vaakapalkin pilariin»).
     Kolme lähdettä on eri mieltä siitä, ripustetaanko palkki kylkeen vai lasketaanko
     se päälle — pilari–tarvike-matriisin avoin kysymys A — eikä hubi ota siihen
     kantaa ennen kuin se on ratkaistu. */
  parts:{h2:"Perustus on pilarit ja tarvikkeet",
    ing:"Yleisin virhe on tilata pelkät pilarit. Kiinnitystarvikkeet ratkaisevat sen, miten rakenne kiinnittyy perustukseen, ja ne mitoitetaan yhdessä pilarin kanssa. Kaikki tarvikkeet ovat BCE:n omaa valmistusta ja yhteensopivia keskenään. Tarvike ruuvataan pilarin valmiiseen kierteeseen, joten poraamista ei tarvita, ja säätövara korkeus- ja sivusuunnassa korjaa pienet heitot.",
    items:[
      ["Pilarikenkä","Detaljikuva: pilarikenkä pilarin päässä ja pystyrakenne kiinni siinä",
       "Liittää pystyrakenteen pilarin päähän.",
       "Terassin runkolankut (50–70 mm) ja katoksen kannatintolpat (90–140 mm). Korkeutta säädetään kiertämällä."],
      ["Palkkikenkä PAK","Detaljikuva: palkkikenkä ja vaakapalkki kiinnitettynä",
       "Liittää vaakapalkin pilariin.",
       "Välipohjan ja rungon kannatinpalkit. Kaksi kokoa: 100 × 150 ja 100 × 200 mm."],
      ["Teräslaatta","Detaljikuva: teräslaatta pilarin päällä",
       "Antaa tasaisen tukipinnan pilarin päähän.",
       "Kun valmis rakenne asennetaan suoraan pilarin päälle. Kolme kokoa, ero on kiinnityspisteissä."],
      ["Nostokorva","Detaljikuva: nostokorva kiinnitettynä, pilari nostossa",
       "Pilarin nostamiseen paikalleen.","KP-perheen pilarit painavat 126–187 kg ja nostetaan koneella."]],
    /* Perhekohtaiset tarvikesuositukset ovat perhesivuilla. */
    cta:"Katso kaikki kiinnitystarvikkeet"},

  /* 8 · Konfiguraattorin oma CTA-lohko. Projektin päämittari syntyy tästä.
     Kuvassa on aito konfiguraattorin tulosnäkymä, ei piirretty jäljitelmä. */
  /* 8 · Konfiguraattori. Ratkaisijat ja laskuri vastasivat samaan tarpeeseen
     kahdessa eri lohkossa — yhdistetty. Kolme asiaa ratkaisee valinnan, ja
     konfiguraattori kysyy juuri ne. Kuvassa on aito tulosnäkymä. */
  cfg:{h2:"Miten valitset oikean pilarin",
    ing:"Kolme asiaa ratkaisee: mitä rakennat, kuinka iso siitä tulee ja kuinka korkealle maasta rakenne halutaan. Konfiguraattori kysyy ne ja antaa sijoittelukaavion, pilarimäärän ja tarvikelistan kappalemäärineen.",
    steps:[
      ["Mitä rakennat","Kevyt rakennelma, terassi tai sauna, vai autokatos ja isompi rakennus. Tämä ratkaisee perheen."],
      ["Kuinka iso","Mitä isompi rakennus, sitä suurempi kantavuus. Muista myös myöhemmät lisäykset — esimerkiksi terassin lasitus lisää kuormaa merkittävästi."],
      ["Kuinka korkealle maasta","Korkeus valitaan sen mukaan, kuinka korkealle rakenne halutaan ja kuinka syvälle pilari asennetaan."]],
    alt:"Konfiguraattorin tulosnäkymä puhelimessa: sijoittelukaavio ja tarvikelista kappalemäärineen, vieressä terassin perustus pilareineen.",
    /* `sub` poistettu 20.9.2026 Ollin pyynnöstä. Teksti oli varauma painikkeen
       alla («et tarvitse kuormalaskelmia»), ja se vastasi vastaväitteeseen, jota
       lukija ei ollut vielä ehtinyt esittää — kolme askelta sen yläpuolella
       kertovat jo mitä konfiguraattori kysyy. Muilla sivuilla `.act .sub` jää. */
    cta:"Laske pilarien määrä"},

  /* 9 · Jälleenmyyjäklikki on sivun mitattavin tapahtuma. Yksi lista, sama kuin
     etusivulla, tasapuolisesti: sama järjestys, sama koko, ei korostuksia. */
  buy:{h2:"Osta jälleenmyyjältä",
    ing:"BCE-pilarit ja tarvikkeet myydään rautakaupoissa kaikkialla Suomessa. Hinnat ovat samaa tasoa jälleenmyyjien välillä."},

  /* 10 · Isompi kohde omana toimintonaan (kommentti 6) */
  big:{h2:"Isompi kohde tai kysyttävää?",
    p:"Suuremmat tilaukset ja projektikohteet hoituvat suoraan meidän kauttamme. Vastaamme tarjouspyyntöön tunnin sisällä.",
    cta:"Pyydä tarjous", sub:"[TÄYTETTÄVÄ]"}   /* puhelin ja sähköposti */
};

(function(){
  "use strict";
  const E=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const T=s=>E(s).replace(/\[([^\]]+)\]/g,m=>'<span class="tbd">'+m+"</span>");
  SPECSHELL(E,{crumb:C.crumb,active:"Pilarit"});

  /* Perhekorttien tuotekuvat: neljä perhettä, kustakin suurin koko.

     Neljä kuvaa on samassa mittakaavassa, ja se on lohkon koko peruste: perhe
     valitaan sen mukaan kuinka iso rakennus on, joten AP-400 ei saa näyttää
     KP-1000:n kokoiselta. tuotekuva.rivi tekee molemmat asiat joita se vaatii —
     saman kertoimen ja saman kankaan — joten kuvat ovat keskenään samankokoisia
     ja yksi CSS-sääntö skaalaa ne kaikki samalla kertoimella. Ilman yhteistä
     kangasta jokainen kortti skaalautuisi omalla kertoimellaan heti kun laatikko
     on kuvaa kapeampi, eli juuri kapeilla ruuduilla, joissa on 80,9 % kävijöistä.

     koriste:true — kortin H3 kertoo tuotteen nimen, joten kuva on koriste eikä
     ruudunlukija toista nimeä kahdesti (TUOTEKUVAT.md luku 6). merkinta:false —
     kaiverrettu tuotekoodi ei lue tässä koossa. id on etuliite, josta jokainen
     kuva saa oman päätteensä: neljä SVG:tä samassa dokumentissa, eikä kahdella
     saa olla samaa sisäistä id:tä.

     Kuvat tasataan alareunaan CSS:ssä (.serie .im.piirros), jotta neljä pilaria seisoo
     samalla tasolla kuin hyllyllä. */
  const KUVA={};
  window.tuotekuva.rivi(window.tuotekuva.perheet,
    {korkeus:200, koriste:true, merkinta:false, id:"kortti"})
    .forEach(function(o){ KUVA[o.perhe]=o.svg; });
  const sect=(inner,id)=>'<div class="w"'+(id?' id="'+id+'"':"")+"><section>"+inner+"</section></div>";
  const head=(h,p)=>'<div class="head"><h2>'+E(h)+"</h2>"+(p?"<p>"+T(p)+"</p>":"")+"</div>";
  const arrow=t=>E(t)+" →";
  const down=t=>E(t)+" ↓";
  document.getElementById("main").innerHTML=

  /* 1 · Hero */
  '<div class="w"><section class="hero hero-spec">'+
    "<div><h1>"+E(C.hero.h1)+'</h1><p class="lede">'+E(C.hero.lede)+"</p>"+
      '<div class="cta"><a class="btn btn-1" href="'+E(SPECLINK(C.hero.cta1[1]))+'" data-event="'+E(C.hero.cta1[2])+
        '" data-sijainti="'+E(C.hero.cta1[3])+'">'+E(C.hero.cta1[0])+"</a></div>"+
      "</div>"+
    '<div class="hero-img">'+E(C.hero.img)+"</div></section></div>"+

  /* 2 · Tuotekoodihaku omana lohkonaan, perhekorttien yläpuolella */
  sect('<div class="find find-yksin"><h3>'+E(C.find.h3)+"</h3><p>"+E(C.find.p)+"</p>"+
    '<form id="koodilomake"><input id="koodikentta" class="field" type="search" aria-label="'+E(C.find.ph)+'" placeholder="'+E(C.find.ph)+'">'+
    '<button class="btn btn-2" type="submit" data-event="haku_tuotekoodi">'+E(C.find.cta)+"</button></form>"+
    '<p class="tulos" id="kooditulos" role="status" aria-live="polite">'+E(C.find.vihje)+"</p></div>","koodi")+

  /* 3 · Neljä perhettä — etusivun .series kuvineen, neljä korttia kolmen sijaan */
  sect(head(C.fam.h2,C.fam.ing)+
    '<div class="series series-4">'+C.fam.series.map(s=>'<div class="serie"><div class="im piirros">'+KUVA[s[2]]+
      "</div><h3>"+E(s[0])+"</h3><p>"+E(s[1])+"</p>"+
      '<a class="more lk" href="'+E(SPECLINK(s[4]))+'" data-event="cta_pilariperhe" data-perhe="'+E(s[0])+'">'+arrow(s[3])+"</a></div>").join("")+"</div>"+
    '<div class="cta-block"><a class="btn btn-1" href="'+E(SPECLINK(C.url.konf))+'" data-event="cta_konfiguraattori" data-sijainti="perheet">'+
      E(C.fam.cta)+'</a><p class="sub">'+E(C.fam.sub)+"</p></div>","perheet")+

  /* 4 · Käyttökohteet — etusivun .pick */
  sect(head(C.use.h2,C.use.ing)+
    '<div class="pick pick-tight">'+C.use.picks.map(p=>'<a href="'+E(SPECLINK(p[1]))+'" data-event="valinta_kayttokohde" data-kohde="'+E(p[0])+'">'+
      '<span class="im">Kuva: '+E(p[0])+'</span><span class="nm">'+E(p[0])+"</span></a>").join("")+"</div>")+

  /* 5 · Tarvikkeet — etusivun .pick-kortti kahdella tietorivillä: tehtävä ja käyttöyhteys */
  sect(head(C.parts.h2,C.parts.ing)+
    '<div class="pick pick-parts">'+C.parts.items.map(p=>'<a href="'+E(SPECLINK(C.url.tarvikkeet))+'" data-event="cta_tarvikkeet" data-tarvike="'+E(p[0])+'"><span class="im">'+E(p[1])+'</span><span class="nm">'+E(p[0])+"</span>"+
      '<span class="fn">'+T(p[2])+"</span>"+
      '<span class="cx">'+(p[3]?T(p[3]):"")+"</span></a>").join("")+"</div>"+
    '<p class="next"><a class="more" href="'+E(SPECLINK(C.url.tarvikkeet))+'" data-event="cta_tarvikkeet" data-tarvike="kaikki">'+
      arrow(C.parts.cta)+"</a></p>"+
    "")+

  /* 8 · Konfiguraattori — etusivun .cfg, ratkaisijat mukana samassa lohkossa */
  /* Kommenttikierros 2 (15.9.2026): .cfg on kahdessa palstassa kaikilla sivuilla,
     koska kuva vei aiemmin koko leveyden. Teksti, vaiheet ja toiminto vasemmalle,
     kuva oikealle. */
  /* `ei-snap` 20.9.2026: lohko ei ole enää scroll-snapin kohta. Snap-kohtia on
     koko CSS:ssä vain tämä yksi, joten sivulta katoaa snap kokonaan. Animaatio
     jää — se ajetaan vierityksen aikajanalla eikä tarvitse snappia. */
  sect('<div class="cfg ei-snap"><div>'+head(C.cfg.h2,C.cfg.ing)+
    '<ol class="steps">'+C.cfg.steps.map(x=>"<li><b>"+E(x[0])+"</b><span>"+E(x[1])+"</span></li>").join("")+"</ol>"+
    '<p class="act"><a class="btn btn-1" href="'+E(SPECLINK(C.url.konf))+'" data-event="cta_konfiguraattori" data-sijainti="lopetus">'+
    E(C.cfg.cta)+"</a></p></div>"+
    '<div class="shot">'+terassikuva.cfg(C.cfg.alt)+'</div>'+
    "</div>","loyda")+

  /* 9 · Mistä ostat — yksi jälleenmyyjälista, sama kuin etusivulla */
  sect(head(C.buy.h2,C.buy.ing)+
    SPECDEALERS(E,{cls:"dealers-4",sijainti:"lopetus"}))+

  /* 10 · Isompi kohde — oma toiminto */
  sect('<div class="band"><div><h2>'+E(C.big.h2)+"</h2><p>"+E(C.big.p)+"</p></div>"+
    '<div><a class="btn btn-1" href="'+E(SPECLINK(C.url.tarjous))+'" data-event="cta_yhteydenotto">'+E(C.big.cta)+"</a>"+
    '<p class="sub">'+T(C.big.sub)+"</p></div></div>","yhteys");

  /* Koodihaku toimii. Auditin 16.9.2026 havainto oli «kaksi hakukenttää, kumpikaan
     ei toimi»; tämä korjaa niistä sivun oman. Koodilistaa ei kirjoiteta tähän käsin:
     pilarikoodit luetaan mittakaavio.js:n PERHEET-taulukosta ja perhesivun osoite
     C.fam.series-riviltä, joten uusi koko tulee hakuun samalla kun se tulee kuviin.
     PP-600 on erikseen, koska se ei ole mittakaaviossa — sen pää on istukka eikä
     M20-kierre. Tarvikekoodit ovat pilari–tarvike-matriisin luvusta 2 ja osoittavat
     tarvikesivulle, koska tarvikekohtaisia slugeja ei ole.

     Normalisointi poistaa kaiken paitsi kirjaimet ja numerot, joten «KP-900»,
     «kp 900» ja «KP900» ovat sama koodi. Se on koko syy siihen, että haku toimii
     jälleenmyyjän tiskillä: koodi luetaan pakkauksesta eikä kirjoitusasusta. */
  const norm=v=>String(v==null?"":v).toUpperCase().replace(/×/g,"X").replace(/[^A-Z0-9]/g,"");
  const KOODIT={}, PURL={};
  C.fam.series.forEach(s=>{PURL[s[2]]=s[4];});
  const PH=window.mittakaavio.perheet;
  Object.keys(PH).forEach(k=>PH[k].kt.forEach(mm=>{
    KOODIT[norm(k+mm)]={nimi:k+"-"+mm, url:PURL[k], mihin:C.find.perhe};
  }));
  KOODIT[norm("PP-600")]={nimi:"PP-600", url:PURL.PP, mihin:C.find.perhe};
  ["PIK 50-70","PIK 90-140","P-PIK 50×70","PAK-100×150","PAK-100×200",
   "TL 100×100×6","TL 150×150×8","TL 100×175×6","Nostokorva M20"]
    .forEach(k=>{KOODIT[norm(k)]={nimi:k, url:C.url.tarvikkeet, mihin:C.find.tarvike};});

  const kentta=document.getElementById("koodikentta"),
        tulos=document.getElementById("kooditulos");
  document.getElementById("koodilomake").addEventListener("submit",function(ev){
    ev.preventDefault();
    const syote=kentta.value.trim(), o=KOODIT[norm(syote)];
    tulos.innerHTML = !syote ? E(C.find.tyhja)
      : o ? '<a class="more" href="'+E(SPECLINK(o.url))+'" data-event="haku_tuotekoodi_osuma" data-koodi="'+E(o.nimi)+'">'+arrow(o.nimi+" — "+o.mihin)+"</a>"
          : "<b>"+E(syote)+"</b> "+E(C.find.eiloydy);
  });
})();
</script>
</body>
</html>
