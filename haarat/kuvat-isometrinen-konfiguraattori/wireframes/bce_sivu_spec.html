<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BCE Pilarimaailma — prototyyppi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap">
<link rel="stylesheet" href="bce-v4.css">
<script src="bce-spec-shell.js"></script>
</head>
<body>
<a class="skip" href="#main">Siirry sisältöön</a>
<div class="urow"><div class="w"></div></div>
<header class="site"><div class="w"></div></header>
<nav class="crumb"><div class="w"></div></nav>
<main id="main"></main>
<footer><div class="w"></div></footer>
<script>
/* Navigaation runko. Tämä tiedosto ei ole suunniteltu sivu vaan luuranko, jonka
   ansiosta prototyypin valikko vie johonkin. Jokainen kohta kertoo oman paikkansa
   sivukartassa ja luovuttaa lapsilleen. Kun sivusta tehdään oikea prototyyppi,
   sen avain saa kentän "proto" ja linkit ohjautuvat sinne itsestään. */
const MAP={
  pilarit:{h:"Pilarit", url:"/bce-pilarit/", nav:"Pilarit",
    p:"Pilarisarjat ja niiden väliset erot.",
    kids:["kp","tp","pp","ap"]},
  kp:{h:"KP-pilari", url:"/bce-pilarit/kp-pilari/", nav:"Pilarit", up:"pilarit"},
  tp:{h:"TP-pilari", url:"/bce-pilarit/tp-pilari/", nav:"Pilarit", up:"pilarit"},
  pp:{h:"PP-pilari", url:"/bce-pilarit/pp-pilari/", nav:"Pilarit", up:"pilarit"},
  ap:{h:"AP-pilari", url:"/bce-pilarit/ap-pilari/", nav:"Pilarit", up:"pilarit",
    p:"Vanha osoite /uusi-pienempi-pilari/ ohjautuu tänne."},
  tarvikkeet:{h:"Tarvikkeet", url:"/pilarien-kiinnitystarvikkeet/", nav:"Tarvikkeet",
    p:"Kahdeksan tarviketta. Tarvike määräytyy pilarin sijainnista ruudukossa, ei pilarimallista.",
    open:"Tarvikkeiden lopullinen lista"},
  /* Sokkeleilla ei ole koontisivua: JeKi on ainoa tuote, ja osoite pysyy ennallaan
     (päätös 17.9.2026). Valikossa "Sokkelit" on ryhmäotsikko Tuotteet-pudotuksessa. */
  jeki:{h:"JeKi-sokkeli", url:"/jeki-sokkeli/", nav:"JeKi-sokkeli",
    p:"Vapaasti seisova elementtisokkeli, oma tuoteperheensä pilarien rinnalla."},

  perustus:{h:"Perustuksen teko", url:"/pilariperustus/", nav:"Perustuksen teko",
    p:"Kategoriaselitys ja menetelmävertailu. Ei enää hub, vaan sivu joka vastaa kysymykseen mikä pilariperustus on.",
    kids:["perustustavat","k-terassi","k-autokatos","k-sauna","k-mokki","k-piharakennus","k-parakki"]},
  /* Menetelmävertailu on oma sivunsa (kortti 11), ei lohko tällä sivulla: se vastaa
     hakuun, jossa on 456 näyttöä ja nolla klikkiä. Osoite on ehdotus, ks. SPEC.map. */
  perustustavat:{h:"Perustustavat vertailussa", url:"/pilariperustus/perustustavat/",
    nav:"Perustuksen teko", up:"perustus"},
  "k-terassi":{h:"Terassi", url:"/kayttokohde/terassin-pilariperustus/", nav:"Perustuksen teko", up:"perustus"},
  "k-autokatos":{h:"Autokatos", url:"/kayttokohde/autokatoksen-pilariperustukset/", nav:"Perustuksen teko", up:"perustus"},
  "k-sauna":{h:"Sauna", url:"/kayttokohde/saunan-pilariperustus/", nav:"Perustuksen teko", up:"perustus"},
  "k-mokki":{h:"Mökki", url:"/kayttokohde/mokkien-pilariperustukset/", nav:"Perustuksen teko", up:"perustus"},
  "k-piharakennus":{h:"Piharakennus", url:"/kayttokohde/piharakennuksen-pilariperustus/", nav:"Perustuksen teko", up:"perustus"},
  "k-parakki":{h:"Parakki", url:"/kayttokohde/parakkien-pilariperustukset/", nav:"Perustuksen teko", up:"perustus"},

  ohjeet:{h:"Ohjeet", url:"/ohjeet/", nav:"Ohjeet",
    p:"Kaikki tekeminen yhdessä paikassa: mitoitus, asennus, kysymykset, suunnittelijan tiedostot ja ladattavat materiaalit.",
    kids:["mitoitus","asennus","ukk","suunnittelijalle","materiaalit"]},
  mitoitus:{h:"Mitoitus", url:"/ohjeet/mitoitus/", nav:"Ohjeet", up:"ohjeet",
    p:"Miten pilari valitaan. Etusivun kysymys \"Etkö tiedä mikä sopii?\" päätyy tänne. Ensimmäisenä osiossa, koska mitoitus on ostoa edeltävä kysymys ja asennus ostoa seuraava."},
  asennus:{h:"Asennus", url:"/ohjeet/asennus/", nav:"Ohjeet", up:"ohjeet",
    p:"Asennusohje sivuna. Tuote- ja tarvikesivujen asennus-CTA:t osoittavat tänne, eivät latauskoontiin."},
  ukk:{h:"Usein kysytyt", url:"/ohjeet/usein-kysytyt/", nav:"Ohjeet", up:"ohjeet"},
  suunnittelijalle:{h:"Suunnittelijalle", url:"/ohjeet/suunnittelijalle/", nav:"Ohjeet", up:"ohjeet",
    p:"Kantavuustaulukot, mitoitustiedot, CE-dokumentit ja DWG-tiedostot. Vanha osoite /suunnittelijan-tiedostot/ ohjautuu tänne."},
  /* 20.9.2026: "Oppaat" oli emonsa synonyymi (Ohjeet \u2192 Oppaat) eik\u00e4 sit\u00e4 haeta \u2014
     *rakentajan opas* 1 n\u00e4ytt\u00f6, *asennusohje* 2. Rakentajan oppaan 670 klikki\u00e4 tulevat
     aihehauista, ei formaattihausta. Kohta on nyt formaattikohta: t\u00e4nne tullaan kun
     halutaan tiedosto. /esitteet/ sulautuu t\u00e4h\u00e4n (301), jotta latauskoonteja on yksi. */
  materiaalit:{h:"Ladattavat materiaalit", url:"/ohjeet/materiaalit/", nav:"Ohjeet", up:"ohjeet",
    p:"Yksi paikka kaikille tiedostoille: Rakentajan opas, pilariesite, asennusohjeet, CE-dokumentit ja DWG. Vanha /esitteet/ ohjautuu t\u00e4nne.",
    open:"Menev\u00e4tk\u00f6 DWG ja A-601 s\u00e4hk\u00f6postiportin taakse \u2014 opas ei mene, se on kuluttajan opas"},

  referenssit:{h:"Referenssit", url:"/referenssit/", nav:"Referenssit",
    p:"Toteutuneet kohteet. Listaussivu on /referenssit/ ja detaljisivut pysyvät osoitteessa /referenssi/{slug} yksikössä: post-tyypin kanoninen osoite ja 429 klikkiä sijainnilla 3,6 eivät kestä uudelleenohjausta.",
    kids:["ref-villarosa"],
    open:"Autokatos-, sauna- ja terassireferenssit puuttuvat kokonaan"},
  /* Post-tyypin `reference` ensimmäinen suunniteltu ilmentymä. Muut kolme
     suomenkielistä referenssiä eivät ole prototyypissä, ja kuori ohjaa ne
     listaussivulle. */
  "ref-villarosa":{h:"Saaristomökki Villa Rosa",
    url:"/referenssi/alan-pitkalla-kokemuksella-oli-helppo-tehda-perustusvalinta-saaristomokkiin/",
    nav:"Referenssit", up:"referenssit"},

  ostat:{h:"Mistä ostat", url:"/mista-ostat/", nav:"Mistä ostat",
    p:"Jälleenmyyjät, kartta ja verkkokaupat. Toissijaisena lohkona reitti isoille projekteille.",
    open:"Jälleenmyyjien myymälälista"},

  yhteystiedot:{h:"Yhteystiedot", url:"/yhteystiedot/",
    p:"Ei päävalikossa vaan apurivillä.",
    kids:["tarjous"]},
  tarjous:{h:"Tarjouspyyntö", url:"/yhteystiedot/tarjouspyynto/", up:"yhteystiedot",
    p:"Ei navigaatiossa. Sisääntulot ovat tuotesivu, suunnittelijan sivu, Mistä ostat ja konfiguraattorin tulos."},

  konfiguraattori:{h:"Konfiguraattori", url:"/konfiguraattori/",
    p:"Oma osoite, koska se on myös QR-koodin kohde. Etusivun ensisijainen toiminto päätyy tänne."},
  tietosuoja:{h:"Tietosuojaseloste", url:"/tietosuojaseloste/"}
};

(function(){
  "use strict";
  const E=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const key=(new URLSearchParams(location.search).get("s")||"pilarit");
  const it=MAP[key]||MAP.pilarit;
  const href=k=>SPECLINK(MAP[k].url);

  const crumb=[["Etusivu",SPEC.home]];
  if(it.up){const u=MAP[it.up]; if(u.up)crumb.push([MAP[u.up].h,href(u.up)]); crumb.push([u.h,href(it.up)]);}
  crumb.push([it.h,null]);
  SPECSHELL(E,{crumb:crumb,active:it.nav});
  document.title=it.h+" — BCE Pilarimaailma (prototyyppi)";

  const kids=(it.kids||[]).map(k=>'<li><a href="'+href(k)+'">'+E(MAP[k].h)+
    '</a> <code>'+E(MAP[k].url)+"</code></li>").join("");

  document.getElementById("main").innerHTML=
    '<div class="w"><section>'+
      '<div class="head"><h1>'+E(it.h)+'</h1>'+
        (it.p?"<p>"+E(it.p)+"</p>":"")+"</div>"+
      '<p class="urlrow"><code>'+E(it.url)+"</code></p>"+
      (kids?'<ul class="kids">'+kids+"</ul>":"")+
      '<p class="stub"><span class="tbd">[SUUNNITTELEMATTA]</span> '+
        "Tämä sivu on prototyypissä vain navigaation kohteena. Sisältö ja rakenne "+
        "suunnitellaan omana tehtävänään."+
        (it.open?" Avoin kohta: "+E(it.open)+".":"")+"</p>"+
    "</section></div>";
})();
</script>
</body>
</html>
