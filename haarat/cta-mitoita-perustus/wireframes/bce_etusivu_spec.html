      ["TP-pilari — terassit ja pienet rakennukset","Terassit, pienmökit ja pihasaunat. Yleisin valinta tee-se-itse-kohteisiin.","TP","Katso TP","/bce-pilarit/tp-pilari/"],
      ["KP-pilari — kantavat rakennukset","Autokatokset, kesämökit ja isommat piharakennukset. Kun rakennuksen päällä on katto, lunta ja tuulta.","KP","Katso KP","/bce-pilarit/kp-pilari/"],

  /* Kommentti 5: pilarit + tarvikkeet prosessina, ei kahtena rinnakkaisena osana.

  flow:{h2:"Näin se toimii",

    steps:[

       img:"Kuva: pilari ja siihen kuuluvat tarvikkeet vierekkäin"},
      {h:"Tee sora-alusta",
       p:"Pilari asettuu konetiivistetyn soran päälle. Routaeristyksen ja salaojituksen tarve ratkaistaan tonttikohtaisesti.",
       img:"Kuva: konetiivistetty sora-alusta valmiina"},
      {h:"Laske pilarit paikoilleen",
       p:"Leveä jalusta jää soran päälle, eikä pilaria kaiveta maahan. Kevyimmän nostaa yksi ihminen, raskaimmat koneella.",
       img:"Kuva: pilari lasketaan sora-alustalle"},
      {h:"Kiinnitä tarvikkeet ja jatka rakentamista",
       p:"Tarvike ruuvataan pilarin valmiiseen kierteeseen, joten poraamista ei tarvita. Säätövara korkeus- ja sivusuunnassa korjaa pienet heitot, ja runko nousee suoraan pilarien päälle.",
       img:"Kuva: palkkikenkä kiinnitettynä ja runko alkamassa"}],
    cta:"Katso asennusohjeet",
    sub:"Asennusohjeet, mitoitusarvot ja CE-dokumentit löytyvät sivustolta."},

  /* JeKi on oma tuoteperheensä, ei pilarisarja: kysyntä on brändättyä
     ("jeki sokkeli" CTR 57,1 %, pelkkä "sokkeli" 0,1 %). Sisältö on
     bcepilarimaailma.fi/jeki-sokkeli/-sivulta. */
  /* Otsikko on kaksiosainen: tuotenimi ja sen alla kuvaava rivi. */
  jeki:{h2:"JeKi-sokkeli", h2b:"umpinainen alareuna ilman valua",
    ing:"Pilarit jättävät rakennuksen alle avointa tilaa. Sokkeli on umpinainen alareuna, joka sulkee sen. JeKi on valmis elementtisokkeli: se seisoo vapaasti, eikä sitä tarvitse tukea erikseen.",
    pts:["Ei tuulta, lunta eikä eläimiä rakennuksen alle. Alareuna on kiinni koko matkalta.",
         "Viimeisteltyä jälkeä. Rakennus näyttää perustetulta, ei pilarien päällä seisovalta.",
         "Asennusvalmis tehtaalta. Liitostarvikkeet tulevat toimituksen mukana.",
         "Ei saumavalua eikä hitsausta työmaalla. Liitos on mekaaninen ja valmis samana päivänä.",
         "Purettavissa ja siirrettävissä. Rakennus voi muuttaa mukana."],
    /* Valintaohje: lohko on haarautuma pilarien rinnalla, ei niiden alalaji.

    cmpQ:"Pilarit vai JeKi?",
    cmp:"Valitse pilarit, kun rakennuksen alle saa jäädä avointa tilaa. Valitse JeKi, kun haluat umpinaisen reunan: omakoti- ja paritalot, huvilat ja mökit, autokatokset.",

    items:[
      ["36 omakotitalon terassit, Tampere","BCE toimitti perustuspilarit Älvsbytalon 36 omakotitalon projektikohteeseen. Rakennuttajan mukaan ratkaisu oli aikatauluvarma sekä merkittävästi perinteisiä vaihtoehtoja helpompi ja kustannustehokkaampi.","Kuva: valmis kohde ja ihmiset","/referenssit/36-omakotitalon-kokonaisuus/"],
      ["Ympärivuotinen hirsimökki saaristoon","Saga ja Roger Sundqvist rakensivat hirsimökin omalle tontilleen Eugmon saaristoon. Pitkä kokemus alalta teki perustusvalinnasta helpon.","Kuva: valmis kohde ja ihmiset","/referenssit/alan-pitkalla-kokemuksella-oli-helppo-tehda-perustusvalinta-saaristomokkiin/"]],

  buy:{h2:"Osta jälleenmyyjältä",

(function(){
  "use strict";
  const E=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const T=s=>E(s).replace(/\[([^\]]+)\]/g,m=>'<span class="tbd">'+m+"</span>");
  SPECSHELL(E);

  /* Perhekorttien tuotekuvat: neljä perhettä, kustakin suurin koko.

     Neljä kuvaa on samassa mittakaavassa, ja se on lohkon koko peruste: perhe
     valitaan sen mukaan kuinka iso rakennus on, joten AP-400 ei saa näyttää
     KP-1000:n kokoiselta. tuotekuva.rivi antaa saman kertoimen ja saman
     kankaan; ilman jälkimmäistä jokainen kortti skaalautuisi omalla
     kertoimellaan heti kun laatikko on kuvaa kapeampi, eli juuri kapeilla
     ruuduilla, joissa on 80,9 % kävijöistä.

     Rivi riviltä sama kuin Pilarit-hubissa (bce_pilarit_spec.html) — lohko on
     tarkoituksella sama, joten myös sen kuvat piirretään samoin. */
  const KUVA={};
  window.tuotekuva.rivi(window.tuotekuva.perheet,
    {korkeus:200, koriste:true, merkinta:false, id:"kortti"})
    .forEach(function(o){ KUVA[o.perhe]=o.svg; });
  const sect=(inner,id)=>'<div class="w"'+(id?' id="'+id+'"':"")+"><section>"+inner+"</section></div>";
  const head=(h,p)=>'<div class="head"><h2>'+E(h)+"</h2>"+(p?"<p>"+T(p)+"</p>":"")+"</div>";
  const arrow=(t)=>E(t)+" →";
  /* Ikonit ovat rakennetta, eivät tekstisisältöä: ei sanoja, ei käännettävää.
     Järjestys seuraa C.why.claims-taulukkoa: aika, sade, ei kalustoa, vaikea tontti. */
  const ICON=[
    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M7 14a4 4 0 0 1 .4-7.9 5 5 0 0 1 9.5 1.2A3.4 3.4 0 0 1 17 14z"/><path d="M8 18l-1 3"/><path d="M12 18l-1 3"/><path d="M16 18l-1 3"/></svg>',
    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M6 18 18 6"/></svg>',
    '<svg viewBox="0 0 24 24"><path d="M2 20h20"/><path d="M2 20l6-8 4 5 3-4 5 7"/></svg>'];

  document.getElementById("main").innerHTML=
  /* 1 · Hero */
  /* 1 · Hero */
  '<div class="w" id="loyda"><section class="hero">'+
    "<div><h1>"+E(C.hero.h1)+'</h1><p class="lede">'+E(C.hero.lede)+"</p>"+
      '<div class="cta"><a class="btn btn-1" href="'+E(SPECLINK(C.hero.cta1[1]))+'" data-event="'+E(C.hero.cta1[2])+'" data-sijainti="hero">'+
        E(C.hero.cta1[0])+"</a>"+
        '<a class="more" href="'+E(C.hero.cta2[1])+'" data-event="'+E(C.hero.cta2[2])+'">'+arrow(C.hero.cta2[0])+"</a></div>"+
      "</div>"+
    '<div class="hero-img">'+E(C.hero.img)+"</div>"+
    /* Jälleenmyyjät omalle riville heron alle: puolikkaassa palstassa neljä korttia
       puristui kahdelle riville ja "Osta verkkokaupasta" taittui. */
    '<div class="trust">'+E(C.hero.trust.lead)+SPECDEALERS(E,{cls:"dealers-4",sijainti:"hero"})+"</div>"+
    "</section></div>"+

  /* 1b · Käyttökohdevalinta (spec lohko 1) */
  sect(head(C.choose.h2,C.choose.ing)+
    '<div class="pick">'+C.choose.picks.map(p=>'<a href="'+E(SPECLINK(p[1]))+'" data-event="valinta_kayttokohde" data-kohde="'+E(p[0])+'">'+
      '<span class="im">Kuva: '+E(p[0])+'</span><span class="nm">'+E(p[0])+"</span></a>").join("")+"</div>"+
    '<p class="next"><a class="more" href="'+E(SPECLINK(C.choose.secHref))+'" data-event="cta_miten_valitaan">'+arrow(C.choose.sec)+"</a></p>","valitse")+

  /* 2 · Miksi valmispilari eikä valu */
  sect(head(C.why.h2,C.why.ing)+'<div class="claims">'+
    C.why.claims.map((c,i)=>'<div class="claim"><div class="ic" aria-hidden="true">'+ICON[i]+"</div><h3>"+E(c[0])+"</h3><p>"+E(c[1])+"</p>"+
      (c[2]?'<a class="more lk" href="'+E(SPECLINK(c[3]))+'" data-event="klikkaus_referenssi">'+arrow(c[2])+"</a>":"")+"</div>").join("")+
    '</div><div class="hero-img img-band">'+E(C.why.img)+"</div>")+

  /* 3 · Miten valitset oikean pilarin */
  sect(head(C.pick.h2,C.pick.ing)+'<div class="series series-4">'+
    C.pick.series.map(s=>'<div class="serie"><div class="im piirros">'+KUVA[s[2]]+
      "</div><h3>"+E(s[0])+"</h3><p>"+E(s[1])+"</p>"+
      '<a class="more lk" href="'+E(SPECLINK(s[4]))+'" data-event="cta_pilariperhe" data-perhe="'+E(s[0])+'">'+arrow(s[3])+"</a></div>").join("")+
    "</div>")+

  /* 3b · Konfiguraattori — sivun ensisijainen toiminto omana lohkonaan */
  /* Sama rakenne kuin hubilla, TP:llä ja tarvikesivulla (design system 17.9.2026):
     teksti ja toiminto yhdessä palstassa, kuva toisessa. Aiemmin otsake, kuva ja
     painike olivat kolme erillistä ruudukon lasta, jolloin painike putosi omalle
     riville kuvan alle ja väliin jäi 200 px tyhjää. */
  sect('<div class="cfg"><div>'+head(C.cfg.h2,C.cfg.ing)+
    '<p class="act"><a class="btn btn-1" href="'+E(SPECLINK("/konfiguraattori/"))+'" data-event="cta_konfiguraattori" data-sijainti="lopetus">'+E(C.cfg.cta)+"</a>"+
    '<span class="sub">'+E(C.cfg.sub)+"</span></p></div>"+
    '<div class="shot">'+terassikuva.cfg(C.cfg.alt)+'</div>'+
    "</div>","laskuri")+

  /* 4 · Näin se toimii */
  sect(head(C.flow.h2,C.flow.ing)+'<div class="flow">'+
    C.flow.steps.map((s,i)=>'<div class="st"><div class="im">'+E(s.img)+"</div>"+
      '<div class="tx"><span class="n" aria-hidden="true">'+(i+1)+"</span><b>"+
      (s.href?'<a href="'+E(SPECLINK(s.href))+'" data-event="'+E(s.ev)+'">'+arrow(s.h)+"</a>":E(s.h))+
      "</b><p>"+E(s.p)+"</p></div></div>").join("")+"</div>"+
    '<p class="next"><a class="more" href="'+E(SPECLINK("/ohjeet/asennus/"))+'" data-event="cta_asennusohjeet">'+arrow(C.flow.cta)+"</a>"+
    '<span class="fsub">'+E(C.flow.sub)+"</span></p>")+

  /* 4b · JeKi-sokkeli — toinen tuoteperhe, oma reitti */
  sect('<div class="side"><div>'+
    '<div class="head"><h2>'+E(C.jeki.h2)+' <span class="h2b">'+E(C.jeki.h2b)+"</span></h2>"+
      "<p>"+E(C.jeki.ing)+"</p></div>"+
    '<ul class="uses">'+C.jeki.pts.map(p=>"<li>"+E(p)+"</li>").join("")+"</ul>"+
    '<p class="cmp"><b>'+E(C.jeki.cmpQ)+"</b> "+E(C.jeki.cmp)+"</p>"+
    '<p class="next"><a class="more" href="'+E(SPECLINK("/jeki-sokkeli/"))+'" data-event="klikkaus_jeki">'+arrow(C.jeki.cta)+"</a></p></div>"+
    '<div class="im">'+E(C.jeki.img)+"</div></div>")+

  /* 5 · Näin muut tekijät */
  sect(head(C.cases.h2)+'<div class="cases">'+
    C.cases.items.map(c=>'<div class="case"><div class="im">'+E(c[2])+"</div><h3>"+E(c[0])+"</h3><p>"+E(c[1])+"</p>"+
      '<a class="more" href="'+E(SPECLINK(c[3]))+'" data-event="klikkaus_referenssi">'+arrow(C.cases.link)+"</a></div>").join("")+
    '</div><p class="next"><a class="more" href="'+E(SPECLINK("/referenssit/"))+'" data-event="klikkaus_referenssit_kaikki">'+arrow(C.cases.all)+"</a></p>")+

  /* 6 · Mistä saat pilarit — yksi jälleenmyyjälista, ei kahta */
  sect(head(C.buy.h2,C.buy.ing)+
    SPECDEALERS(E,{cls:"dealers-4",sijainti:"lopetus"}))+

  /* 7 · Isompi kohde — oma toiminto */
  sect('<div class="band"><div><h2>'+E(C.big.h2)+"</h2><p>"+E(C.big.p)+"</p></div>"+
    '<div><a class="btn btn-1" href="'+E(SPECLINK("/yhteystiedot/tarjouspyynto/"))+'" data-event="cta_yhteydenotto">'+E(C.big.cta)+"</a>"+
    '<p class="sub">'+T(C.big.sub)+"</p></div></div>","yhteys")+

  /* 8 · Rakentajan opas */
  sect('<div class="guide"><div>'+head(C.guide.h2,C.guide.p)+
      '<form onsubmit="return false"><input class="field" type="email" aria-label="'+E(C.guide.field)+'" placeholder="'+E(C.guide.field)+'">'+
      '<button class="btn btn-1" type="submit" data-event="lataus_opas">'+E(C.guide.cta)+"</button></form>"+
      '<p class="fsub">'+E(C.guide.sub)+"</p></div>"+
    '<div class="ph">'+E(C.guide.img)+"</div></div>")+

  /* 9 · Ammattilaisille ja jälleenmyyjille */
  '<div class="w"><section class="tight"><div class="pro-strip"><div><h2>'+
    E(C.pro.h2)+'</h2><p>'+E(C.pro.p)+'</p></div>'+
    '<div><a class="more" href="'+E(SPECLINK("/ohjeet/suunnittelijalle/"))+'" data-event="cta_ammattilaiselle">'+arrow(C.pro.link)+"</a></div></div></section></div>"+

  /* 10 · Usein kysytyt kysymykset */
  sect(head(C.faq.h2)+C.faq.items.map((f,i)=>"<details><summary>"+E(f[0])+
      '<span class="c" aria-hidden="true">▾</span></summary><div class="b">'+T(f[1])+"</div></details>").join("")+
    '<p class="next"><a class="more" href="'+E(SPECLINK("/ohjeet/usein-kysytyt/"))+'" data-event="cta_faq_kaikki">'+arrow(C.faq.link)+"</a></p>");
})();
</script>
</body>
</html>
