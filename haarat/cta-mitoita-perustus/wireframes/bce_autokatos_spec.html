  const E=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const T=s=>E(s).replace(/\[([^\]]+)\]/g,m=>'<span class="tbd">'+m+"</span>");
  const L=u=>E(SPECLINK(u));

  /* Murupolku on pakollinen: orgaaninen kävijä laskeutuu suoraan tälle sivulle. */
  SPECSHELL(E,{crumb:C.crumb,active:"Perustuksen teko"});

  /* Lohkon 5 tuotekuva. kiintea:false — kuva on yksin sivulla eikä vertaa
     kokoja, joten se saa täyttää kuvapaikkansa. */
  const TUOTE=a=>window.tuotekuva({perhe:a.perhe,korkeus:300,kiintea:false,
    id:"kp-"+a.perhe.toLowerCase(),
    nimike:a.perhe+"-pilari kolmiulotteisena, pohjalaatta ja kapeneva runko"});

  const sect=(inner,id)=>'<div class="w"'+(id?' id="'+id+'"':"")+"><section>"+inner+"</section></div>";
  const head=(h,p)=>'<div class="head"><h2>'+E(h)+"</h2>"+(p?"<p>"+T(p)+"</p>":"")+"</div>";
  const arrow=t=>E(t)+" →";
  const mitoita=sijainti=>'<a class="btn btn-1" href="'+L(C.url.mitoita)+
    '" data-event="cta_konfiguraattori" data-sijainti="'+E(sijainti)+'">'+E(C.cta.mitoita)+"</a>";
  const more=(l,sij)=>'<a class="more" href="'+L(l[1])+'" data-event="'+E(l[2])+'"'+
    (sij?' data-sijainti="'+E(sij)+'"':"")+">"+arrow(l[0])+"</a>";
  const erotin='<span aria-hidden="true"> · </span>';

  document.getElementById("main").innerHTML=

  /* 1 · Hero */
  '<div class="w"><section class="hero">'+
    "<div><h1>"+E(C.hero.h1)+'</h1><p class="lede">'+E(C.hero.lede)+"</p>"+
      '<div class="cta">'+mitoita("hero")+'<span class="sub">'+E(C.hero.arvo)+"</span></div>"+
      '<div class="cta cta-2">'+more(C.hero.cta2,"hero")+"</div></div>"+
    '<div class="hero-img">'+E(C.hero.img)+"</div></section></div>"+

  /* 2 · Kuvanosto */
  sect(head(C.kuvat.h2)+
    '<div class="cases cases-3">'+C.kuvat.items.map(g=>'<div class="case">'+
      '<div class="ph ph-1610">'+E(g[0])+"</div><p>"+T(g[1])+"</p></div>").join("")+"</div>")+

  /* 3 · Kohteen oma kysymys */
  sect(head(C.kysymys.h2)+"<p>"+E(C.kysymys.p)+"</p>","kysymys")+

  /* 4 · Näin perustus tehdään */
  sect(head(C.tekeminen.h2)+'<div class="flow">'+
    C.tekeminen.steps.map((s,i)=>'<div class="st"><div class="ph ph-1610">'+E(s.img)+"</div>"+
      '<div class="tx"><span class="n" aria-hidden="true">'+(i+1)+"</span><b>"+E(s.h)+"</b>"+
      "<p>"+E(s.p)+"</p></div></div>").join("")+"</div>"+
    '<p class="next">'+more(C.tekeminen.ohje)+"</p>","tekeminen")+

  /* 5 · Mikä pilari tähän */
  sect('<div class="side"><div>'+
    head(C.pilari.h2,C.pilari.saanto)+
    "<p>"+E(C.pilari.poikkeus)+"</p><p>"+E(C.pilari.maara)+"</p>"+
    '<div class="cta-block">'+mitoita("pilari")+"</div>"+
    '<p class="next">'+
      '<a class="more" href="'+L(C.pilari.malli[1])+'" data-event="cta_pilariperhe" data-perhe="'+
        E(C.pilari.malli[2])+'">'+arrow(C.pilari.malli[0])+"</a>"+
      erotin+more(C.pilari.vertaa)+"</p></div>"+
    '<div class="ph ph-43 piirros">'+TUOTE(C.pilari.img)+"</div></div>","pilari")+

  /* 6 · Mitä maan alle tulee. Havainnekuva on oma rivinsä eikä mediaparin palsta.
        Kuvassa on vain numerot; selitteet ovat sen alla oikeana tekstinä, koska
        kuvaan ladottu teksti skaalautuu kankaan mukana ja renderöityy 390 px:n
        ruudulla 3,8 pikseliin (ks. bce-v4.css, .kuvaselite). Varauma on
        figcaption eikä leipätekstiä: se koskee kuvaa, ei kappaletta. Alimpana
        reitti tekniseen versioon — sitä ei poistettu sivustolta vaan siirrettiin
        sinne, missä sen lukija on. */
  sect(head(C.maapohja.h2,C.maapohja.nodig)+
    "<p>"+E(C.maapohja.routa)+"</p><p>"+E(C.maapohja.kohde)+"</p><p>"+E(C.maapohja.talvi)+"</p>"+
    '<figure class="figwide"><img src="'+E(C.maapohja.img)+'" alt="'+E(C.maapohja.alt)+
      '" width="1920" height="1280" loading="lazy" decoding="async">'+
      '<ol class="kuvaselite">'+C.maapohja.vaiheet.map(v=>
        "<li><b>"+E(v[0])+"</b><span>"+E(v[1])+"</span></li>").join("")+"</ol>"+
      "<figcaption>"+E(C.maapohja.varauma)+"</figcaption></figure>"+
    '<p class="next">'+more(C.maapohja.tekninen,"maapohja")+"</p>","maapohja")+

  /* 7 · Tarvikkeet */
  sect(head(C.tarvikkeet.h2,C.tarvikkeet.ing)+
    '<ul class="uses">'+C.tarvikkeet.items.map(p=>"<li>"+
      (p[0]?'<a href="'+L(p[1])+'" data-event="cta_tarvikkeet" data-tarvike="'+E(p[0])+'">'+E(p[0])+"</a> ":"")+
      E(p[2])+"</li>").join("")+"</ul>"+
    "<p>"+E(C.tarvikkeet.huom)+"</p>"+
    '<p class="next">'+more(C.tarvikkeet.cta)+"</p>","tarvikkeet")+

  /* 8 · Näin hinta muodostuu */
  sect(head(C.hinta.h2,C.hinta.ing)+
    "<p>"+E(C.hinta.vertailu)+"</p><p>"+E(C.hinta.kysy)+"</p>"+
    '<p class="next">'+more(C.hinta.cta,"hinta")+"</p>","hinta")+

  /* 10 · Näin pääset alkuun */
  sect(head(C.aloita.h2)+
    '<ol class="steps">'+C.aloita.steps.map(s=>
      "<li><b>"+E(s[0]||C.cta.mitoita)+"</b><span>"+E(s[1])+"</span></li>").join("")+"</ol>"+
    '<div class="cta-block">'+mitoita("aloitus")+"</div>"+
    '<div class="buyrow"><h3 class="lbl">'+E(C.aloita.ostatH3)+"</h3>"+
      SPECDEALERS(E,{cls:"dealers-4",sijainti:"aloitus"})+"</div>"+
    '<div class="buyrow"><h3 class="lbl">'+E(C.aloita.isoH3)+"</h3>"+
      "<p>"+E(C.aloita.isoP)+"</p>"+
      '<p class="contact"><a href="tel:'+E(C.aloita.puh.replace(/\s/g,""))+'">'+E(C.aloita.puh)+"</a>"+
        erotin+'<a href="mailto:'+E(C.aloita.email)+'">'+E(C.aloita.email)+"</a></p>"+
      '<p class="next">'+more(C.aloita.cta,"aloitus")+"</p></div>","aloita")+

  /* 11 · Usein kysyttyä */
  sect(head(C.ukk.h2)+'<div class="faq">'+C.ukk.items.map((f,i)=>
    "<details><summary>"+E(f[0])+'<span class="c" aria-hidden="true">▾</span></summary>'+
    '<div class="b"><p>'+E(f[1])+
      (i===C.ukk.items.length-1?" "+more(C.ukk.ostat,"ukk"):"")+
    "</p></div></details>").join("")+"</div>","ukk")+

  /* 12 · Referenssit */
  sect(head(C.ref.h2)+
    '<div class="quote"><div class="ph ph-43">'+E(C.ref.img)+"</div>"+
    "<div><blockquote>"+E(C.ref.quote)+"</blockquote><cite>"+E(C.ref.cite)+"</cite>"+
    '<p class="next">'+more(C.ref.cta)+"</p></div></div>","referenssit");

  /* FAQPage-schema kaikista kysymyksistä. */
  const ld=document.createElement("script");
  ld.type="application/ld+json";
  ld.textContent=JSON.stringify({"@context":"https://schema.org","@type":"FAQPage",
    mainEntity:C.ukk.items.map(f=>({"@type":"Question",name:f[0],
      acceptedAnswer:{"@type":"Answer",text:f[1]}}))});
  document.head.appendChild(ld);

  /* Harmonikan avaus on mitattava tapahtuma, sama toteutus kuin tarvikesivulla. */
  [...document.querySelectorAll(".faq details")].forEach(function(d){
    d.addEventListener("toggle",function(){
      if(!d.open)return;
      d.dataset.event="avaus_ukk";
      d.dataset.kysymys=d.querySelector("summary").textContent.replace("▾","").trim();
    });
  });
})();
</script>
</body>
</html>
