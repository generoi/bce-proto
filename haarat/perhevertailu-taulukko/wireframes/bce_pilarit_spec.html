     kahdella saa olla samaa sisäistä id:tä. */
  const DET_KORKEUS=150;
  const DET_SKAALA=DET_KORKEUS/Math.max.apply(null,
    C.parts.items.map(p=>window.asennuskuva.laajuus(p[1])));
  const DETALJI=window.tuotekuva.kangas(
    C.parts.items.map(p=>window.asennuskuva(Object.assign({},p[1],
      {skaala:DET_SKAALA, koriste:true, id:"det-"+(p[1].pari||p[1].osa)}))),"ala");

  /* Vertailutaulukon lasketut rivit. Molemmat lukevat saman mittataulukon kuin
     kortin tuotekuva, joten taulukko ei voi kertoa muuta kuin mitä kuva piirtää. */
  const LASKE={
    /* Korkeusalue ja kokojen määrä yhdellä rivillä: ne vastaavat samaan kysymykseen
       («kuinka paljon varaa perheessä on»), ja erillisinä riveinä taulukko kasvaisi
       rivin ilman omaa sisältöä. PP:llä on yksi koko, joten väliviivaa ei tule. */
    korkeudet:function(perhe){
      const k=window.tuotekuva.koot(perhe);
      const vali=k.length>1 ? k[0]+"–"+k[k.length-1]+" mm" : k[0]+" mm";
      return vali+" · "+k.length+(k.length===1 ? " koko" : " kokoa");
    },
    /* D1 on pohjalaatan sivu, ja laatta on neliö. Se ei ole perheen vakio kaikkialla:
       AP-300:n laatta on 450 ja perheen muiden 330. Poikkeusta ei keskiarvoisteta pois
       vaan se kirjoitetaan näkyviin — juuri se on syy, miksi AP:n kokoasteikko on
       epätasainen (aineisto-taustamatskut luku 3.7). */
    laatta:function(perhe){
      const ryhmat={};
      window.tuotekuva.koot(perhe).forEach(function(koko){
        const d=window.tuotekuva.mitat(perhe,koko).D1;
        (ryhmat[d]=ryhmat[d]||[]).push(koko);
      });
      const nelio=d=>d+" × "+d+" mm";
      const arvot=Object.keys(ryhmat).sort((a,b)=>ryhmat[b].length-ryhmat[a].length);
      if(arvot.length===1) return nelio(arvot[0]);
      return nelio(arvot[0])+" ("+arvot.slice(1).map(function(d){
        return ryhmat[d].map(koko=>window.tuotekuva.koodi(perhe,koko)).join(", ")+
          ": "+nelio(d);
      }).join("; ")+")";
    }};
  const sect=(inner,id)=>'<div class="w"'+(id?' id="'+id+'"':"")+"><section>"+inner+"</section></div>";
  const head=(h,p)=>'<div class="head"><h2>'+E(h)+"</h2>"+(p?"<p>"+T(p)+"</p>":"")+"</div>";
  const arrow=t=>E(t)+" →";
  const down=t=>E(t)+" ↓";
  document.getElementById("main").innerHTML=

  /* 1 · Hero */
  '<div class="w"><section class="hero hero-spec">'+
    "<div><h1>"+E(C.hero.h1)+'</h1><p class="lede">'+E(C.hero.lede)+"</p>"+
      '<div class="cta"><a class="btn btn-1" href="'+E(SPECLINK(C.hero.cta1[1]))+'" data-event="'+E(C.hero.cta1[2])+
        '" data-sijainti="'+E(C.hero.cta1[3])+'">'+E(C.hero.cta1[0])+"</a></div>"+
      '<div class="cta cta-2">'+
        '<a class="more" href="'+E(C.hero.cta2[1])+'" data-event="'+E(C.hero.cta2[2])+'">'+down(C.hero.cta2[0])+"</a>"+
      "</div></div>"+
    '<div class="hero-img">'+E(C.hero.img)+"</div></section></div>"+

  /* 3 · Neljä perhettä — etusivun .series kuvineen, neljä korttia kolmen sijaan.
     Ennen käyttökohteita 22.9.2026: perustelu on konfiguraation kohdassa 2. */
  sect(head(C.fam.h2,C.fam.ing)+
    '<div class="series series-4">'+C.fam.series.map(s=>'<div class="serie"><div class="im piirros">'+KUVA[s[2]]+
      "</div><h3>"+E(s[0])+"</h3><p>"+E(s[1])+"</p>"+
      '<a class="more lk" href="'+E(SPECLINK(s[4]))+'" data-event="cta_pilariperhe" data-perhe="'+E(s[0])+'">'+arrow(s[3])+"</a></div>").join("")+"</div>"+
    /* 3c · Vertailutaulukko korttien ja lohkon toiminnon väliin: se on korttien
       jatke eikä oma kysymyksensä, ja «Laske pilarien määrä» on molempien jälkeen.
       th[scope=row] on ominaisuuden nimi ja data-lbl kantaa perheen nimen kapealle
       ruudulle, jossa .stack piilottaa otsikkorivin ja pinoaa rivit lohkoiksi. */
    '<div class="vertailu"><h3>'+E(C.cmp.h3)+"</h3><p>"+E(C.cmp.p)+"</p>"+
      '<div class="tw"><table class="data stack"><thead><tr><th>'+E(C.cmp.kulma)+"</th>"+
        C.cmp.otsikot.map(c=>"<th>"+E(c)+"</th>").join("")+"</tr></thead><tbody>"+
        C.cmp.rows.map(function(r){
          const arvot=typeof r[1]==="string" ? C.cmp.perheet.map(p=>LASKE[r[1]](p)) : r[1];
          return '<tr><th scope="row">'+E(r[0])+"</th>"+
            arvot.map((v,i)=>'<td data-lbl="'+E(C.cmp.otsikot[i])+'">'+T(v)+"</td>").join("")+
            "</tr>";
        }).join("")+"</tbody></table></div>"+
      '<p class="fine">'+E(C.cmp.note)+"</p>"+
      '<p class="next"><a class="more" href="'+E(SPECLINK(C.cmp.link[1]))+'" data-event="'+
        E(C.cmp.link[2])+'">'+arrow(C.cmp.link[0])+"</a></p></div>"+
    '<div class="cta-block"><a class="btn btn-1" href="'+E(SPECLINK(C.url.konf))+'" data-event="cta_konfiguraattori" data-sijainti="perheet">'+
      E(C.fam.cta)+'</a><p class="sub">'+E(C.fam.sub)+"</p></div>"+
    '<div class="find" id="koodi"><h3>'+E(C.find.h3)+"</h3><p>"+E(C.find.p)+"</p>"+
      '<form onsubmit="return false"><input class="field" type="search" aria-label="'+E(C.find.ph)+'" placeholder="'+E(C.find.ph)+'">'+
      '<button class="btn btn-2" type="submit" data-event="haku_tuotekoodi">'+E(C.find.cta)+"</button></form>"+
      '<p class="tbd-l">'+T(C.find.note)+"</p></div>","perheet")+

  /* 2 · Käyttökohteet — etusivun .pick, perheiden jälkeen */
  sect(head(C.use.h2,C.use.ing)+
    '<div class="pick pick-tight">'+C.use.picks.map(p=>'<a href="'+E(SPECLINK(p[1]))+'" data-event="valinta_kayttokohde" data-kohde="'+E(p[0])+'">'+
      '<span class="im">Kuva: '+E(p[0])+'</span><span class="nm">'+E(p[0])+"</span></a>").join("")+"</div>")+

  /* 5 · Tarvikkeet — etusivun .pick-kortti kahdella tietorivillä: tehtävä ja käyttöyhteys */
  sect(head(C.parts.h2,C.parts.ing)+
    '<div class="pick pick-parts">'+C.parts.items.map((p,i)=>'<a href="'+E(SPECLINK(C.url.tarvikkeet))+'" data-event="cta_tarvikkeet" data-tarvike="'+E(p[0])+'"><span class="im piirros">'+DETALJI[i]+'</span><span class="nm">'+E(p[0])+"</span>"+
      '<span class="fn">'+T(p[2])+"</span>"+
      '<span class="cx">'+(p[3]?T(p[3]):"")+"</span></a>").join("")+"</div>"+
    '<p class="next"><a class="more" href="'+E(SPECLINK(C.url.tarvikkeet))+'" data-event="cta_tarvikkeet" data-tarvike="kaikki">'+
      arrow(C.parts.cta)+"</a></p>"+
    "")+

  /* 8 · Konfiguraattori — etusivun .cfg, ratkaisijat mukana samassa lohkossa */
  /* Kommenttikierros 2 (15.9.2026): .cfg on kahdessa palstassa kaikilla sivuilla,
     koska kuva vei aiemmin koko leveyden. Teksti, vaiheet ja toiminto vasemmalle,
     kuva oikealle. */
  /* `ei-snap` 20.9.2026: lohko ei ole enää scroll-snapin kohta. Snap-kohtia on
     koko CSS:ssä vain tämä yksi, joten sivulta katoaa snap kokonaan. Animaatio
     jää — se ajetaan vierityksen aikajanalla eikä tarvitse snappia. */
  sect('<div class="cfg ei-snap"><div>'+head(C.cfg.h2,C.cfg.ing)+
    '<ol class="steps">'+C.cfg.steps.map(x=>"<li><b>"+E(x[0])+"</b><span>"+E(x[1])+"</span></li>").join("")+"</ol>"+
    '<p class="act"><a class="btn btn-1" href="'+E(SPECLINK(C.url.konf))+'" data-event="cta_konfiguraattori" data-sijainti="lopetus">'+
    E(C.cfg.cta)+"</a></p></div>"+
    '<div class="shot">'+terassikuva.cfg(C.cfg.alt)+'</div>'+
    "</div>","loyda")+

  /* 9 · Mistä ostat — yksi jälleenmyyjälista, sama kuin etusivulla */
  sect(head(C.buy.h2,C.buy.ing)+
    SPECDEALERS(E,{cls:"dealers-4",sijainti:"lopetus"}))+

  /* 10 · Isompi kohde — oma toiminto */
  sect('<div class="band"><div><h2>'+E(C.big.h2)+"</h2><p>"+E(C.big.p)+"</p></div>"+
    '<div><a class="btn btn-1" href="'+E(SPECLINK(C.url.tarjous))+'" data-event="cta_yhteydenotto">'+E(C.big.cta)+"</a>"+
    '<p class="sub">'+T(C.big.sub)+"</p></div></div>","yhteys");
})();
</script>
</body>
</html>
