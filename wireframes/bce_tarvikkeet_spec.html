(function(){
  "use strict";
  const E=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

  const DLIC='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+

  const kaikki=C.parts.groups.reduce((a,g)=>a.concat(g.items),[]);

  /* ---- Kuvat -------------------------------------------------------------
     Kaksi joukkoa, kaksi tehtävää, ja **kummassakaan ei ole yhteistä
     mittakaavaa.** Se on poikkeus TUOTEKUVAT.md:n sääntöön 4, ja poikkeus on
     tehty 18.9.2026 tietoisesti — sääntö on oikea siellä, missä kuvat vertaavat
     kokoja, eivätkä nämä vertaa.

     Suodatinkortit nimeävät käyttötilanteen: «terassin runkopalkki»,
     «pilarien siirto ja asennus». Niiden kappaleet eroavat kooltaan niin paljon
     (nostokorva ⌀40 mm, PIK 90-140 tolppineen 371 mm), että yhteisellä
     mittakaavalla pienin jäi napiksi eikä tunnistunut miksikään. Tunnistamattomuus
     on pahempi väite kuin kokoeron puuttuminen: se lukee «tämä vaihtoehto on
     vähäpätöinen», ja juuri siitä kortin pitäisi vakuuttaa päinvastaista.

     Tuoterivin tunnistekuva on nimen vieressä, ja rivit ovat sivun mitalla
     toistensa alapuolella. Kahta tunnistetta ei voi verrata vierittämättä, joten
     yhteinen mittakaava maksoi luettavuutta antamatta mitään.

     **Missä sääntö pätee yhä:** tuotekuvasto (`bce_tuotekuvat.html#tarvikkeet`)
     piirtää kaikki yhdeksän samassa mittakaavassa ja sanoo sen ääneen, ja
     perhesivujen pilarikuvat käyttävät `kiintea:true`:ta ja `rivi()`:ä.
     Kokovertailu on niiden tehtävä, ei näiden korttien.

     id on pakollinen: sivulla on 14 inline-SVG:tä, ja kahdella ei voi olla
     samaa sisäistä id:tä (sääntö 3). */
  const TK=window.tarvikekuva, YK=window.yhdistelmakuva;

  /* Suodatinkortit. Jokainen kuva täyttää oman kuvapaikkansa.

     Ennen nämä olivat yhteisessä mittakaavassa (tuotekuva.kangas). Se on oikea
     ratkaisu silloin kun kuvat vertaavat kokoja, mutta **nämä viisi eivät vertaa
     kokoja, ne nimeävät käyttötilanteen** — ja niiden kokoero on niin suuri, että
     jaetulla skaalalla nostokorva jäi napin kokoiseksi eikä tunnistunut miksikään.
     Tunnistamattomuus on pahempi väite kuin kokoeron puuttuminen: se lukee «tämä
     vaihtoehto on vähäpätöinen».

     Mitä tästä menetetään, ja miksi se on siedettävää: PIK 50-70 ja PIK 90-140
     näyttävät nyt yhtä suurilta. Kortin oma teksti sanoo «50–70 mm» ja «90–140 mm»,
     ja kokovertailu on tuotekuvastossa (bce_tuotekuvat.html#tarvikkeet), jossa se
     on nimenomaan luvattu. Sama mittakaava samassa näkymässä pätee yhä siellä.
     Korjattu 18.9.2026. */
  const KAAVIO=C.pick.rows.map(r=>r[4]).map(a=>a.pari
    ? YK({pari:a.pari,korkeus:210,koriste:true,id:"kaavio-"+a.pari})
    : TK({osa:a.osa,korkeus:210,koriste:true,id:"kaavio-"+a.osa}));

  /* Tuoterivin tunnistekuva nimen vieressä. Sama ratkaisu ja sama syy: rivit ovat
     sivun mitalla toistensa alapuolella, joten kokovertailua ei voi tehdä
     vierittämättä — jaettu mittakaava maksoi luettavuutta antamatta mitään.
     Rivin kokotieto on «Kiinnitettävä mitta» -kentässä ja asennuskuvassa. */
  const TUOTE=(function(){
    const ulos={};
    TK.osat().forEach(k=>{
      ulos[k]=TK({osa:k,korkeus:150,koriste:true,id:"tuote-"+k});
    });
    return ulos;
  })();

  /* Kokovalinnan koodista generaattorin tunnus: "PAK-100×150" → "pak-100x150".
     Johdettu eikä kirjoitettu, jotta koodi ja kuva eivät voi ajautua erilleen. */

     kokovalitsimessa: kuva ei voi olla valitsematta, joten se näyttää perheen
     suurimman, ja koko lukee rivillä vaihteluvälinä ("100 × 150 tai 100 × 200 mm").
     Rivin muu tila — tuotekoodi, EAN — ei väitä kokoa (heuristiikka 5). */
  const RIVIKUVA=it=>TUOTE[it.sizes?KOKOAVAIN(it.sizes[it.sizes.length-1][0]):it.id]||"";

  /* ---- Asennuskuva: rivin suurin kuvapaikka ------------------------------
     Täytetty 20.9.2026. Paikka oli tyhjä kaikilla kahdeksalla rivillä siitä asti
     kun variantti 2 palautettiin 17.9. — se on rivin suurin elementti, koska
     kiinnikkeen tunnistaa siitä miltä se näyttää kiinni eikä siitä miltä se
     näyttää yksin. Generaattoria ei ollut ennen kuin `asennuskuva.js` kirjoitettiin.

     `it.im` oli paikanpitäjän teksti («Asennuskuva: PIK 50-70 pilarin päässä,
     lankku kiinni»); nyt se on generaattorin kuvaus. Sama ratkaisu kuin
     perhesivun tarvikerivillä ja Pilarit-hubin perhekorteilla.

     **Puu on mukana viidellä rivillä kahdeksasta, ja se on tietoinen jako:**

       pilarikengät   `pari` — tolppa uraan. Poikkeus P-PIK, jonka pari on
                      ristiriidassa lähteidensä kanssa eikä sitä saa käyttää
                      (yhdistelmakuva.js). Sen kuvassa on kenkä ja pilari, ei puuta.
       palkkikengät   `pari` — palkki satulaan, molemmat koot
       teräslaatat    `osa` — ei puuta. Laatat eroavat toisistaan **reikien
                      määrästä ja paikasta**, ja päälle laskettu lauta peittää
                      juuri ne. Sama havainto on yhdistelmakuva.js:ssä, jossa
                      TL 150×150 on ainoa pari räjäytettynä. Lisäksi 100×100:lle
                      ja 100×175:lle ei ole paria eikä lähdettä sille, mikä puu
                      niiden päälle tulee — kolme laattaa, joista yhdellä on
                      lauta, väittäisi eroa jota lähteissä ei ole.
       nostokorva     `osa` — ei kiinnitettävää puuta. Rivin teksti lupaa myös
                      tangon korvan läpi; sitä ei ole piirretty, koska tanko on
                      asentajan oma eikä BCE:n tuote.

     **Yhteinen mittakaava ja yhteinen kangas, toisin kuin sivun kahdella muulla
     kuvajoukolla.** Ylempänä on perusteltu, miksi tuoterivien tunnistekuvat ja
     suodatinkortit eivät jaa mittakaavaa: ne eivät vertaa kokoja. Asennuskuvat
     ovat eri tapaus, ja syy ei ole vertailu vaan **vakio**: jokaisessa kuvassa on
     sama TP-400:n pää. Jos jokainen kuva täyttäisi oman laatikkonsa, sama pilari
     olisi joka rivillä eri kokoinen, ja silloin kuva valehtelisi siitä mikä on
     tarvikkeen koko suhteessa pilariin — juuri se, mitä rivi on näyttämässä.
     Tasaus on «ala», koska kaikilla on yhteinen alataso: pilarin rajaus. */
  const AK=window.asennuskuva;
  const ASENNUS=(function(){
    /* Kokovalinnallisella rivillä tunnus johdetaan kokovalinnan koodista
       (KOKOAVAIN), ja kenttä — pari vai osa — säilyy riviltä, jotta
       kuvausta ei tarvitse kirjoittaa kahdesti. */
    const kuvaus=(im,tunnus)=>im.pari?{pari:tunnus}:{osa:tunnus};
    const rivit=[];
    kaikki.forEach(it=>{
      (it.sizes?it.sizes.map(v=>KOKOAVAIN(v[0])):[it.id])
        .forEach(t=>rivit.push([t,kuvaus(it.im,t)]));
    });
    const sk=300/Math.max.apply(null,rivit.map(r=>AK.laajuus(r[1])));
    const kuvat=window.tuotekuva.kangas(rivit.map(r=>AK(Object.assign({},r[1],
      {skaala:sk,koriste:true,id:"asennus-"+r[0]}))),"ala");
    const ulos={};
    rivit.forEach((r,i)=>{ulos[r[0]]=kuvat[i];});
    return ulos;
  })();
  const ASENNUSKUVA=it=>ASENNUS[it.sizes?KOKOAVAIN(it.sizes[it.sizes.length-1][0]):it.id]||"";

  /* Tuoterivi, variantti 2 (palautettu 17.9.2026). Vasemmalla asennuskuva rivin
     korkuisena, oikealla tuotekuva tunnisteena nimen vieressä, ingressi otsikon
     alla, kenttärivit ja tilaustiedot niiden alla. Kiinnikkeen tunnistaa siitä
     miltä se näyttää palkissa kiinni, joten asennuskuva on rivin suurin elementti.

     B:stä säilytetty sellaisenaan: tuotekoodi, EAN ja Kopioi, kokovalinta, ja
     merkintä "Sopii valintaasi", joka on paikallaan aina mutta piilossa kunnes
     suodatin osuu — kuittaus on tekstiä, ei pelkkä vaimennus.

     Kuvapaikat ovat kanoninen .ph, eivät oma .tim: DESIGN-SYSTEM.md luku 3. */
  function rivi(it){
    const kentta=(l,v)=>'<div class="fr"><span>'+E(l)+"</span><b>"+T(v)+"</b></div>";
    return '<article class="tcard" id="'+E(it.id)+'" data-tags="'+E(it.tags.join(" "))+'">'+
      '<div class="timcol"><span class="ph piirros">'+ASENNUSKUVA(it)+"</span></div>"+
      "<div>"+
        '<div class="tid"><span class="ph ph-1 piirros">'+RIVIKUVA(it)+"</span>"+
          "<div><h3>"+T(it.n)+"</h3>"+
            '<p class="tu">'+E(it.p)+"</p></div></div>"+
        '<div class="frs">'+
          kentta(C.parts.lbl.mitta,it.mitta||C.parts.none)+
          kentta(C.parts.lbl.fit,it.fit)+
        "</div>"+
        (it.sizes?'<div class="sizes sizes-s" role="group" aria-label="'+E(C.parts.lbl.size)+'">'+
          it.sizes.map(v=>'<button type="button" aria-pressed="false" data-koodi="'+E(v[0])+
            '"><b>'+E(v[0])+"</b><span>"+E(v[1])+"</span></button>").join("")+"</div>":"")+
        '<div class="sku"><span class="k">'+T(it.k)+"</span>"+
          '<span class="e">'+E(C.parts.lbl.ean)+" "+E(it.ean)+"</span>"+
          '<button class="cp" type="button" data-event="kopioi_koodit" data-koodi="'+E(it.k)+
          '" data-ean="'+E(it.ean)+'">'+E(C.parts.copy)+"</button></div>"+
      "</div></article>";
  }

  document.getElementById("main").innerHTML=

  /* 1 · Kärki ja hakemisto (B). Ensisijainen on ostopaikka omalle sivulleen. */
  '<div class="w"><section class="lead">'+
    "<div><h1>"+E(C.hero.h1)+'</h1><p class="lede">'+E(C.hero.lede)+"</p>"+
      '<div class="cta"><a class="btn btn-1" href="'+L(C.hero.cta[1])+'" data-event="'+
        E(C.hero.cta[2])+'" data-sijainti="'+E(C.hero.cta[3])+'">'+E(C.hero.cta[0])+"</a>"+
        '<a class="more" href="'+L(C.hero.cta2[1])+'" data-event="'+E(C.hero.cta2[2])+
        '" data-sijainti="hero">'+arrow(C.hero.cta2[0])+"</a></div></div>"+
    '<nav class="idx" aria-label="'+E(C.hero.idx)+'"><p class="lbl">'+E(C.hero.idx)+"</p>"+
      kaikki.map(k=>'<a href="#'+E(k.id)+'" data-event="cta_tarvike_ankkuri" data-tarvike="'+
        E(k.k)+'">'+down(k.n)+"</a>").join("")+"</nav></section></div>"+

  /* 2 · Suodatin (A): korostaa ja merkitsee, ei piilota */
  sect(head(C.pick.h2,C.pick.ing)+
    '<div class="pick-how" id="suodatin">'+C.pick.rows.map((r,i)=>
      '<a href="'+E(r[3])+'" data-kiinnitys="'+E(r[2])+'" data-event="valinta_kiinnitystarve">'+
      '<span class="ph ph-1610 piirros">'+KAAVIO[i]+"</span>"+
      '<span class="tx"><b>'+E(r[0])+'</b><span class="d">'+E(r[1])+"</span></span></a>").join("")+"</div>"+
    '<p class="fstate">'+
      '<button class="lnk" type="button" id="nollaa" hidden>'+E(C.pick.reset)+"</button></p>","valitse")+

  /* 3 · Kahdeksan tuoteriviä neljässä ryhmässä (B), ryhmät samassa osiossa (A) */
  '<div class="w" id="tuotteet"><section>'+
    C.parts.groups.map(g=>'<div class="tgroup" id="'+E(g.id)+'">'+
      '<div class="head gh"><h2>'+E(g.h2)+"</h2><p>"+E(g.ing)+"</p></div>"+
      '<div class="tgrid">'+g.items.map(rivi).join("")+"</div></div>").join("")+
    '<p class="fine mt">'+T(C.parts.open)+"</p>"+
  "</section></div>"+

  /* 4 · Tekniset tiedot ja lataukset. Sama leiska kuin perhesivulla (.techrow):
     yksi sarake arvopareja, kuva viereen, jotta puolikas sisältöleveys ei jää
     tyhjäksi. Kuusi riviä koko sisältöleveydellä jätti oikean puolen tyhjäksi ja
     venytti arvon niin kauas nimestä, ettei paria lukenut yhtenä. */
  sect(head(C.tech.h2)+
    '<div class="techrow"><div>'+
    '<dl class="spec2">'+C.tech.rows.map(r=>"<div><dt>"+E(r[0])+"</dt><dd>"+T(r[1])+"</dd></div>").join("")+"</dl>"+
    '<p class="fine tech-note">'+E(C.tech.fine)+"</p></div>"+
    '<div class="ph tekninen">'+E(C.tech.img)+"</div></div>"+
    '<h3 class="sh">'+E(C.tech.dh3)+"</h3>"+
    '<div class="dl">'+C.tech.docs.map(d=>'<a href="'+L("/ohjeet/suunnittelijalle/")+
      '" data-event="'+E(d[2])+'" data-tiedosto="'+E(d[0])+'"><span class="ty">'+DLIC+E(d[1])+
      "</span><b>"+E(d[0])+"</b>"+(d[3]?'<span class="st">'+T(d[3])+"</span>":"")+
      "</a>").join("")+"</div>")+

  /* 5 · Asennus (A): ohjaa ohjeeseen */
  sect('<div class="side flip">'+
    "<div>"+head(C.asen.h2)+"<p>"+E(C.asen.p)+"</p>"+
      '<p><a class="more" href="'+L("/ohjeet/asennus/")+'" data-event="cta_asennusohjeet">'+
      arrow(C.asen.cta)+"</a></p></div>"+
    '<span class="im vid">'+T(C.asen.vid)+"</span></div>")+

  /* 6 · Konfiguraattori, sama nimi kuin muualla */
  sect('<div class="cfg"><div>'+head(C.cfg.h2,C.cfg.ing)+
    '<p class="act"><a class="btn btn-1" href="'+L("/konfiguraattori/")+'" data-event="cta_konfiguraattori" data-sijainti="lopetus">'+
    E(C.cfg.cta)+'</a><span class="sub">'+E(C.cfg.sub)+"</span></p></div>"+
    '<div class="shot">'+terassikuva.cfg(C.cfg.alt)+'</div>'+
    "</div>","mitoita")+

  /* 7 · Mistä ostat */
  sect(head(C.buy.h2,C.buy.ing)+
    SPECDEALERS(E,{cls:"dealers-4",sijainti:"lopetus"})+
    '<p class="mt"><a class="more" href="'+L("/mista-ostat/")+
      '" data-event="cta_mista_ostat" data-sijainti="lopetus">'+arrow(C.buy.all)+"</a></p>","ostat")+

  /* 8 · Usein kysytyt (A) */
  sect(head(C.ukk.h2)+'<div class="faq">'+C.ukk.rows.map(q=>
    "<details><summary>"+E(q)+'<span class="c" aria-hidden="true">▾</span></summary>'+
    '<div class="b">'+T(C.ukk.a)+"</div></details>").join("")+"</div>","ukk")+

  sect('<div class="band"><div><h2>'+E(C.big.h2)+"</h2><p>"+E(C.big.p)+"</p></div>"+
    '<div><a class="btn btn-1" href="'+L("/yhteystiedot/tarjouspyynto/")+'" data-event="cta_yhteydenotto">'+
    E(C.big.cta)+"</a>"+'<p class="sub">'+T(C.big.sub)+"</p></div></div>","yhteys");

  /* ---- Suodatin: korostaa, ei piilota, ei vieritä ---- */
  const napit=[...document.querySelectorAll(".pick-how a")];
  const rivit=[...document.querySelectorAll(".tcard")];
  const ryhmat=[...document.querySelectorAll(".tgroup")];
  const nollaa=document.getElementById("nollaa");
  /* Kuittaus on vain ruudunlukijalle: näkyvällä rivillä on enää purkupainike. */
  const msg=document.createElement("p");
  msg.className="sr";msg.setAttribute("role","status");msg.setAttribute("aria-live","polite");
  document.querySelector(".fstate").appendChild(msg);

  function aseta(arvo,kuittaa){
    let n=0;
    /* Sopimattomat piilotetaan, ei vaimenneta: vaimennettu rivi on yhä 400 px
       korkea este, joka pitää ohittaa vierittämällä. Vieritystä ei tehdä
       käyttäjän puolesta. */
    rivit.forEach(function(r){
      const osuu=!arvo||r.dataset.tags.split(" ").indexOf(arvo)>-1;
      r.hidden=!osuu;
      if(arvo&&osuu)n++;
    });
    /* Tyhjä ryhmä piiloutuu otsikkoineen: otsikko ilman rivejä lukisi virheenä. */
    ryhmat.forEach(function(g){
      g.hidden=![...g.querySelectorAll(".tcard")].some(r=>!r.hidden);
    });
    napit.forEach(function(a){
      if(a.dataset.kiinnitys===arvo) a.setAttribute("aria-current","true"); else a.removeAttribute("aria-current");
    });
    /* Alkulatauksella ei kuitata mitään: "Valinta poistettu" on väärin ennen kuin
       valintaa on tehty. */
    if(kuittaa){
      const pohja=!arvo?C.pick.all:(n===1?C.pick.count1:C.pick.count);
      msg.textContent=pohja.replace("#n",String(n)).replace("#k",String(rivit.length));
    }
    nollaa.hidden=!arvo;
  }
  function url(arvo){
    const u=new URL(location.href);
    if(arvo) u.searchParams.set("kiinnitys",arvo); else u.searchParams.delete("kiinnitys");
    u.hash=""; history.replaceState(null,"",u);
  }
  napit.forEach(function(a){
    a.addEventListener("click",function(e){
      e.preventDefault();
      const oli=a.getAttribute("aria-current")==="true";
      const arvo=oli?"":a.dataset.kiinnitys;
      aseta(arvo,true); url(arvo);
    });
  });
  nollaa.addEventListener("click",function(){ aseta("",true); url(""); napit[0].focus(); });

  /* Hakemisto listaa kaikki kahdeksan. Jos suodatin on päällä ja kohde on
     piilossa, valinta puretaan ensin — muuten linkki ei vie mihinkään. */
  [...document.querySelectorAll(".idx a")].forEach(function(a){
    a.addEventListener("click",function(){
      const kohde=document.getElementById(a.getAttribute("href").slice(1));
      if(kohde&&kohde.hidden){ aseta("",true); url(""); }
    });
  });
  const alku=new URL(location.href).searchParams.get("kiinnitys")||"";
  aseta(napit.some(a=>a.dataset.kiinnitys===alku)?alku:"",false);

  /* ---- Kuittaukset ja kopiointi: sama toteutus kuin perhesivulla ---- */
  const say=document.createElement("p");
  say.className="sr";say.setAttribute("role","status");say.setAttribute("aria-live","polite");
  document.body.appendChild(say);
  function kopioi(btn,teksti,kuittaus){
    const vanha=btn.textContent;
    function ok(){btn.textContent=C.parts.copied;btn.setAttribute("data-copied","true");
      say.textContent=kuittaus;
      setTimeout(function(){btn.textContent=vanha;btn.removeAttribute("data-copied");},2200);}
    function fail(){btn.textContent=C.parts.failed;btn.setAttribute("data-failed","true");
      say.textContent=C.parts.failed;
      setTimeout(function(){btn.textContent=vanha;btn.removeAttribute("data-failed");},2600);}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(teksti).then(ok,fail);
    } else { fail(); }
  }
  [...document.querySelectorAll(".tcard .cp")].forEach(function(b){
    b.addEventListener("click",function(){
      kopioi(b,b.dataset.koodi+"  "+b.dataset.ean,C.parts.copied+": "+b.dataset.koodi);
    });
  });

  /* Kokovalinta vaihtaa tuotekoodin samassa lohkossa ja kuittaa sen ruudunlukijalle.
     Ei esivalintaa, ei vieritystä. */
  rivit.forEach(function(lohko){
    const napit=[...lohko.querySelectorAll(".sizes button")];
    if(!napit.length)return;
    const k=lohko.querySelector(".sku .k"), cp=lohko.querySelector(".sku .cp");
    const perus=k.textContent;
    /* Valinta vaihtaa myös kuvan. Koot ovat samassa mittakaavassa, joten
       PAK-100×150 piirtyy matalampana kuin PAK-100×200 — valinnan vaikutus näkyy
       samalla silmäyksellä eikä vain tuotekoodin numerossa. Ilman valintaa
       piirretään suurempi koko, sama kuin ensimmäisellä renderöinnillä. */
    const kuva=lohko.querySelector(".tid .ph.piirros");
    const peruskuva=kuva?kuva.innerHTML:"";
    /* Kokovalinta vaihtaa myös rivin asennuskuvan: PAK-100×150 ja PAK-100×200
       eroavat satulan korkeudesta, ja se on koko valinnan sisältö. Kuvat ovat
       yhteisellä kankaalla, joten matalampi piirtyy matalampana eikä vaihto
       liikuta riviä. */
    const akuva=lohko.querySelector(".timcol .ph.piirros");
    const aperus=akuva?akuva.innerHTML:"";
    napit.forEach(function(b){
      b.addEventListener("click",function(){
        const oli=b.getAttribute("aria-pressed")==="true";
        napit.forEach(x=>x.setAttribute("aria-pressed","false"));
        if(oli){k.textContent=perus;cp.dataset.koodi=perus;say.textContent=perus;
          if(kuva)kuva.innerHTML=peruskuva;
          if(akuva)akuva.innerHTML=aperus;return;}
        b.setAttribute("aria-pressed","true");
        k.textContent=b.dataset.koodi;cp.dataset.koodi=b.dataset.koodi;say.textContent=b.dataset.koodi;
        if(kuva&&TUOTE[KOKOAVAIN(b.dataset.koodi)])kuva.innerHTML=TUOTE[KOKOAVAIN(b.dataset.koodi)];
        if(akuva&&ASENNUS[KOKOAVAIN(b.dataset.koodi)])akuva.innerHTML=ASENNUS[KOKOAVAIN(b.dataset.koodi)];
      });
    });
  });

  /* Harmonikan avaus on mitattava tapahtuma. */
  [...document.querySelectorAll(".faq details")].forEach(function(d){
    d.addEventListener("toggle",function(){
      if(!d.open)return;
      d.dataset.event="avaus_ukk";
      d.dataset.kysymys=d.querySelector("summary").textContent.replace("▾","").trim();
    });
  });
})();
</script>
</body>
</html>
