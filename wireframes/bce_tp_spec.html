     mittakaavassa — silloin ero nähdään eikä sitä lasketa taulukosta. Viereinen
     arvotaulukko kirjoittaa saman millimetreinä. Sama valitsin toimii työpöydällä ja
     kapealla, joten aiempaa alasvetoa (.koko-m) ei enää tarvita. */
  const kaavio=document.getElementById("kaavio");
  const sku=document.querySelector(".sku");
  const rivit=[...document.querySelectorAll(".dims tbody tr")];
  let valittu=null;

  /* Kaaviossa on kirjaimet, ei millimetrejä (18.9.2026). Kaavio on nyt taulukon
     vieressä, ja siinä paikassa sen tehtävä on yksi: kertoa mitä sarakeotsikko H2
     tarkoittaa. Luvut ovat samalla rivillä taulukossa ja valitun koon mitat
     valitsimen vieressä, joten kaavioon kirjoitettuna ne olisivat kolmas kopio
     samoista numeroista — ja se kopio veisi tilan kirjaimelta, jota ei saa
     mistään muualta.

     Valinta muuttaa yhä piirroksen korkeutta: runko kasvaa valitun koon mukana,
     mutta merkintä pysyy kirjaimena.

     Kangas mitoitetaan perheen suurimman koon mukaan (kiintea:true), jolloin
     mittakaava ja tekstikoko pysyvät samoina valinnasta toiseen ja pilarien
     keskinäiset mittasuhteet näkyvät oikein: TP-200 on matala, TP-600 korkea.
     Pystytila on siis varattu TP-600:lle, ja pienemmät koot jättävät yläreunaan
     tyhjää — se tyhjä on tieto, ei virhe. */
  function piirra(){
    kaavio.innerHTML=window.mittakaavio(valittu
      ? {perhe:C.dims.fig, koko:+valittu.split("-")[1], kiintea:true}
      : {perhe:C.dims.fig, kiintea:true});
  }
  piirra();
  /* Säädin omistaa valinnan ja sen purkamisen; tämä vie saman tilan sivun muihin
     osiin. Siksi tässä ei ole enää vipua, joka kumoaisi valinnan toisella
     klikkauksella — purkaminen on säätimen oma painike, joka näkyy vain kun
     valinta on päällä. */
  function valitse(koko){
    valittu = koko || null;
    rivit.forEach(r=>r.removeAttribute("data-pick"));
    piirra();
    SPECDEALERSIZE(document.querySelector(".box"), valittu);
    if(!valittu){ sku.hidden=true; return; }
    const rivi=C.dims.rows.find(r=>r[0].indexOf(valittu)===0);
    const row=rivit.find(r=>r.textContent.indexOf(valittu)===0);
    if(row)row.setAttribute("data-pick","true");
    sku.hidden=false;
    sku.innerHTML='<span class="k">'+E(rivi[0])+"</span>"+
      '<span class="e">'+E(C.dims.ean)+" "+E(rivi[9])+"</span>"+
      '<button class="cp" type="button" data-event="kopioi_koodit" data-koodi="'+E(rivi[0])+
      '" data-ean="'+E(rivi[9])+'" data-sijainti="ostolaatikko">'+E(C.dims.copy)+"</button>";
    sku.querySelector(".cp").addEventListener("click",function(){
      kopioi(this,rivi[0]+"  "+rivi[9],C.dims.copied+": "+rivi[0]);
    });
  }
  window.tuotevalitsin.kiinnita(document.querySelector(".mitoitus"),VAL,valitse);

  /* Kopiointi riveittäin: myyjä tiskillä kopioi yhden tuotteen, ei koko listaa. */
  /* Taulukon painike kopioi EANin, koska sen nimi lupaa sen ja koodi on näkyvissä
     samalla rivillä. Ostolaatikon painike kopioi yhä koodin ja EANin yhdessä:
     siellä molemmat ovat näkyvissä ja myyjä tarvitsee molemmat. */
  /* ---- Galleria: pikkukuva vaihtaa pääkuvan ------------------------------
     Painikkeet olivat painikkeita, jotka eivät tehneet mitään — auditin
     heuristiikka 4 («klikattavan näköinen on klikattava»). Nyt kolmella
     viidestä on aito kuva, joten vaihto on myös sisällöllisesti tarpeen:
     mittakaavio ei lue 88 pikselissä, ja juuri sen takia siitä on isokin koko.

     Iso ruutu piirretään uudelleen eikä kopioida pikkukuvasta: kopio toisi
     mukanaan pikkukuvan id:t, ja niitä olisi silloin kaksi kappaletta. */
  (function(){
    const iso=document.getElementById("kuva");
    const napit=[...document.querySelectorAll(".thumbs button")];
    napit.forEach(function(b){
      b.addEventListener("click",function(){
        const t=GAL[+b.dataset.i];
        napit.forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
        if(t.piirra){
          iso.className="im piirros";
          iso.innerHTML=PIIRRA(t.piirra,330,"galiso");
        }else{
          iso.className="im";
          iso.textContent=t.nimi;
        }
      });
    });
  })();

  [...document.querySelectorAll(".dims .cp")].forEach(function(b){
    b.addEventListener("click",function(){
      kopioi(b,b.dataset.ean,C.dims.copied+": "+b.dataset.koodi);
    });
  });
})();
</script>
</body>
</html>
